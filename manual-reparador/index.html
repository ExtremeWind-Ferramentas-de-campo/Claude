<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --ink:#0e2033; --muted:#4f6273;
    --panel:rgba(255,255,255,.80); --panel-border:rgba(255,255,255,.65);
    --card:#ffffff; --card-line:#e2e8f0; --field:#ffffff;
    --sky-1:#6db3ef; --sky-2:#eaf6ff;
    --hill-1:#bfe3b5; --hill-2:#a1d597; --hill-3:#83c67b;
    --turbine:#f9fdff; --turbine-edge:#c7d8ea; --tower:#eef5fb;
    --sun:#ffd76a; --sun-glow:rgba(255,215,106,.55);
    --cloud:rgba(255,255,255,.9); --star:transparent;
    --ff:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    --shadow:0 18px 50px rgba(9,34,64,.18);
    --c:#7c3aed;
  }
  :root[data-theme="dark"]{
    --ink:#e8eff8; --muted:#9fb2c6;
    --panel:rgba(15,29,48,.74); --panel-border:rgba(120,150,185,.22);
    --card:#0f1d2e; --card-line:#2a3c52; --field:#0b1624;
    --sky-1:#081525; --sky-2:#173251;
    --hill-1:#123049; --hill-2:#0d2439; --hill-3:#081a2b;
    --turbine:#a9bccf; --turbine-edge:#6d859c; --tower:#93a8bf;
    --sun:#dde8f6; --sun-glow:rgba(221,232,246,.28);
    --cloud:transparent; --star:#dfeaff;
    --shadow:0 18px 50px rgba(0,0,0,.5);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ink:#e8eff8; --muted:#9fb2c6;
      --panel:rgba(15,29,48,.74); --panel-border:rgba(120,150,185,.22);
      --card:#0f1d2e; --card-line:#2a3c52; --field:#0b1624;
      --sky-1:#081525; --sky-2:#173251;
      --hill-1:#123049; --hill-2:#0d2439; --hill-3:#081a2b;
      --turbine:#a9bccf; --turbine-edge:#6d859c; --tower:#93a8bf;
      --sun:#dde8f6; --sun-glow:rgba(221,232,246,.28);
      --cloud:transparent; --star:#dfeaff;
      --shadow:0 18px 50px rgba(0,0,0,.5);
    }
  }
  html{overflow-x:hidden}
  body{font-family:var(--ff);color:var(--ink);min-height:100vh;position:relative;overflow-x:hidden;
    display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}

  /* ── CENA (fundo de turbinas) ── */
  .scene{position:fixed;inset:0;z-index:-1}
  .scene svg{width:100%;height:100%;display:block}
  .sky-1{stop-color:var(--sky-1)} .sky-2{stop-color:var(--sky-2)}
  .hill-1{fill:var(--hill-1)} .hill-2{fill:var(--hill-2)} .hill-3{fill:var(--hill-3)}
  .blade{fill:var(--turbine);stroke:var(--turbine-edge);stroke-width:.6}
  .nacelle{fill:var(--turbine);stroke:var(--turbine-edge);stroke-width:.6}
  .hub{fill:var(--turbine-edge)}
  .tower{fill:var(--tower);stroke:var(--turbine-edge);stroke-width:.4}
  .sun{fill:var(--sun)} .sun-glow{fill:var(--sun-glow)}
  .cloud{fill:var(--cloud)}
  .star{fill:var(--star)}

  /* ── TEMA / VOLTAR ── */
  .theme-btn{position:fixed;top:14px;right:14px;z-index:20;width:42px;height:42px;border-radius:50%;
    cursor:pointer;background:var(--panel);color:var(--ink);font-size:1.05rem;
    box-shadow:var(--shadow);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--panel-border)}
  .theme-btn:hover{filter:brightness(1.05)}
  .nav-back-link{position:fixed;top:14px;left:14px;z-index:20;width:42px;height:42px;border-radius:50%;
    border:1px solid var(--panel-border);cursor:pointer;background:var(--panel);color:var(--ink);
    display:grid;place-items:center;font-size:1.05rem;text-decoration:none;
    box-shadow:var(--shadow);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .nav-back-link:hover{filter:brightness(1.05)}

  /* ── CONTEÚDO ── */
  .landing{flex:1;width:100%;max-width:760px;margin:0 auto;padding:34px 18px 24px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center}
  .brand-pill{background:#fff;border-radius:16px;padding:12px 20px;box-shadow:var(--shadow);display:inline-block}
  .brand-pill img{height:46px;width:auto;display:block}
  .brand-fallback{font-weight:800;letter-spacing:.5px;font-size:1.5rem;color:#004aad}
  h1{font-size:clamp(1.5rem,4vw,2.3rem);font-weight:800;letter-spacing:-.5px;line-height:1.15;
    text-shadow:0 1px 12px rgba(255,255,255,.35)}
  :root[data-theme="dark"] h1{text-shadow:0 1px 14px rgba(0,0,0,.5)}
  .subtitle{font-size:1rem;color:var(--muted);font-weight:600;margin-top:-8px}

  /* ── PAINEL ── */
  .picker{width:100%;background:var(--panel);border:1px solid var(--panel-border);border-radius:24px;
    padding:26px 22px 28px;box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);margin-top:4px;
    text-align:left}
  .picker h2{font-size:1.1rem;font-weight:700;margin-bottom:4px;text-align:center}
  .picker .hint{font-size:.9rem;color:var(--muted);margin-bottom:20px;text-align:center}

  /* busca — só aparece quando a lista já é grande */
  .busca{position:relative;margin-bottom:14px}
  .busca i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
  .busca input{width:100%;padding:13px 14px 13px 40px;border-radius:14px;border:1px solid var(--card-line);
    background:var(--field);color:var(--ink);font:inherit;font-size:1rem}
  .busca input:focus{outline:2px solid var(--c);outline-offset:1px}

  /* ── LISTA DE TÓPICOS ── */
  .topicos{list-style:none;display:flex;flex-direction:column;gap:12px}
  .topico{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--card-line);
    border-left:5px solid var(--c);border-radius:18px;padding:16px 18px;text-decoration:none;color:var(--ink);
    box-shadow:0 6px 18px rgba(9,34,64,.10);transition:transform .18s ease,box-shadow .18s ease;position:relative}
  a.topico:hover,a.topico:focus-visible{transform:translateY(-3px);box-shadow:0 14px 30px rgba(9,34,64,.20);outline:none}
  .topico .num{flex-shrink:0;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;color:#fff;
    font-size:1.15rem;font-weight:800;letter-spacing:.3px;
    background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#fff))}
  .topico .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
  .topico .titulo{font-size:1.08rem;font-weight:800;line-height:1.25}
  .topico .desc{font-size:.86rem;color:var(--muted);line-height:1.35}
  .topico .go{flex-shrink:0;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;
    color:var(--c);border:2px solid var(--c);font-size:.95rem;transition:background .18s ease,color .18s ease}
  a.topico:hover .go,a.topico:focus-visible .go{background:var(--c);color:#fff}
  .topico .go i{margin-left:2px}

  /* tópico ainda sem vídeo */
  .topico.breve{cursor:not-allowed;opacity:.62;filter:saturate(.45)}
  .selo{flex-shrink:0;background:var(--card-line);color:var(--muted);font-size:.68rem;font-weight:800;
    letter-spacing:.4px;text-transform:uppercase;padding:4px 9px;border-radius:999px;white-space:nowrap}

  .vazio{text-align:center;color:var(--muted);padding:18px 8px;font-size:.95rem}
  .aviso{display:none;margin-top:14px;padding:12px 14px;border-radius:12px;font-size:.9rem;font-weight:600;
    background:#fff4e5;color:#8a4b00;border:1px solid #f5c98a;text-align:center}
  .aviso.ver{display:block}
  .nota{margin-top:16px;font-size:.8rem;color:var(--muted);text-align:center;line-height:1.4}

  footer{text-align:center;color:var(--muted);font-size:.8rem;padding:22px 16px 10px;
    text-shadow:0 1px 8px rgba(255,255,255,.3)}
  :root[data-theme="dark"] footer{text-shadow:0 1px 10px rgba(0,0,0,.5)}

  @media(max-width:768px){
    .landing{padding:16px 12px 16px;gap:14px}
    .brand-pill{padding:10px 16px}
    .brand-pill img{height:38px}
    h1{font-size:1.4rem}
    .subtitle{font-size:.9rem;margin-top:8px}
    .picker{padding:20px 14px 22px;border-radius:20px}
    .picker h2{font-size:1.05rem}
    .picker .hint{margin-bottom:16px;font-size:.85rem}
    .topico{padding:14px;gap:12px}
    .topico .num{width:46px;height:46px;font-size:1.05rem;border-radius:14px}
    .topico .titulo{font-size:1rem}
    .topico .go{width:38px;height:38px}
  }
</style>
</head>
<body>

<main class="landing">
  <div class="brand-pill">

         onerror="this.style.display='none';this.insertAdjacentHTML('afterend','<span class=\'brand-fallback\'>EXTREME WIND</span>')">

<script>
'use strict';
document.getElementById('year').textContent = new Date().getFullYear();
(function(){
  var KEY='ew_theme';
  function apply(t){
    if(t==='dark'||t==='light'){ document.documentElement.setAttribute('data-theme',t); }
    else { document.documentElement.removeAttribute('data-theme'); t=null; }
    var dark = t==='dark' || (!t && window.matchMedia('(prefers-color-scheme:dark)').matches);
    var b=document.getElementById('theme-btn'); if(b) b.innerHTML = dark?'<i class="fas fa-sun"></i>':'<i class="fas fa-moon"></i>';
  }
  apply(localStorage.getItem(KEY));
  document.getElementById('theme-btn').addEventListener('click',function(){
    var cur=document.documentElement.getAttribute('data-theme');
    var dark=cur==='dark'||(!cur&&window.matchMedia('(prefers-color-scheme:dark)').matches);
    var next=dark?'light':'dark'; localStorage.setItem(KEY,next); apply(next);
  });
})();
</script>
<script>
/* =========================== TÓPICOS ===========================
   Para acrescentar um vídeo: uma linha nova aqui embaixo.

     n       número que aparece no cartão (e que ordena a lista)
     titulo  nome do tópico
     desc    (opcional) frase curta embaixo do título
     link    link de compartilhamento do Google Drive
             — "Qualquer pessoa com o link" como Leitor.
             Deixe '' para o tópico aparecer como "Em breve".

   Só links https://drive.google.com/ são aceitos.
   ================================================================ */
var TOPICOS = [
  { n: '02', titulo: 'Sistema de Pintura',
    link: 'https://drive.google.com/file/d/17bxkR16JYy0X1H3Oo8NKK5aV4z1KCr3h/view?usp=drive_link' },
  { n: '03', titulo: 'Teste de Estanqueidade',
    link: 'https://drive.google.com/file/d/1Bb0RzkgD1FCpJKJZkERjTFOxAxvHMFFO/view?usp=drive_link' }
];
/* ============================================================== */

(function(){
  'use strict';
  var LIMITE_BUSCA = 6;            // a busca só aparece a partir de tantos tópicos
  var lista = document.getElementById('lista');
  var vazio = document.getElementById('vazio');
  var aviso = document.getElementById('aviso');
  var campo = document.getElementById('q');

  function norm(s){
    return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  }
  function linkOk(u){ return typeof u === 'string' && u.indexOf('https://drive.google.com/') === 0; }
  function el(tag, cls, txt){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(txt != null) e.textContent = txt;
    return e;
  }

  var ordenados = TOPICOS.slice().sort(function(a, b){
    return String(a.n).localeCompare(String(b.n), 'pt-BR', { numeric: true });
  });

  function cartao(t){
    var abre = linkOk(t.link);
    var li = el('li');
    var c = el(abre ? 'a' : 'div', 'topico' + (abre ? '' : ' breve'));
    if(abre){
      c.href = t.link;
      c.target = '_blank';
      c.rel = 'noopener noreferrer';
    }
    c.appendChild(el('span', 'num', t.n));

    var txt = el('span', 'txt');
    txt.appendChild(el('span', 'titulo', t.titulo));
    if(t.desc) txt.appendChild(el('span', 'desc', t.desc));
    c.appendChild(txt);

    if(abre){
      var go = el('span', 'go');
      go.setAttribute('aria-hidden', 'true');
      go.appendChild(el('i', 'fas fa-play'));
      c.appendChild(go);
      c.setAttribute('aria-label', 'Abrir vídeo: ' + t.titulo);
    } else {
      c.appendChild(el('span', 'selo', 'Em breve'));
    }
    li.appendChild(c);
    return li;
  }

  function desenhar(){
    var q = norm(campo.value).trim();
    lista.textContent = '';
    var n = 0;
    ordenados.forEach(function(t){
      if(q && norm(t.n + ' ' + t.titulo + ' ' + (t.desc || '')).indexOf(q) < 0) return;
      lista.appendChild(cartao(t));
      n++;
    });
    vazio.hidden = n > 0;
  }

  /* Sem internet o Drive não abre — avisa em vez de deixar o técnico
     tocando num cartão que parece não responder. */
  lista.addEventListener('click', function(e){
    var a = e.target.closest ? e.target.closest('a.topico') : null;
    if(!a) return;
    if(navigator.onLine === false){
      e.preventDefault();
      aviso.textContent = 'Sem internet. Os vídeos ficam no Google Drive — conecte-se e toque de novo.';
      aviso.classList.add('ver');
    }
  });
  window.addEventListener('online', function(){ aviso.classList.remove('ver'); });

  document.getElementById('busca').hidden = ordenados.length < LIMITE_BUSCA;
  campo.addEventListener('input', desenhar);
  desenhar();
})();
</script>
<script>
/* PWA — registra o service worker (uso offline) */
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('../sw.js').catch(function(){});});}
</script>
