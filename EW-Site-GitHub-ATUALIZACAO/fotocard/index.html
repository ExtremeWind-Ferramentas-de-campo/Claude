/* ═══════════════════════════════════════════════════════════════════════════
   CAMPOS OBRIGATÓRIOS
   ───────────────────────────────────────────────────────────────────────────
   Foto com campo em branco vira retrabalho: o card sai com um "—" no lugar do
   dado e, semanas depois, ninguém lembra qual era a torre ou a medida. Por
   isso a câmera e o "Salvar" só liberam com o fotocard inteiro preenchido.

   A ordem da lista é a mesma do formulário — é ela que decide para onde a
   tela rola quando falta alguma coisa.

   Dois campos não são um <input> comum:
     • Etapa do Processo — o <select> nunca fica vazio; só a opção "Outra"
       precisa do texto ao lado;
     • Lado / Localização — é um grupo de caixas: preenchido = pelo menos uma
       marcada.
   ═══════════════════════════════════════════════════════════════════════════ */
var OBRIG=[
  {rotulo:'Parque Eólico', id:'f-parque'},
  {rotulo:'Torre (WTG)',   id:'f-turbina'},
  {rotulo:'Cliente',       id:'f-cliente'},
  {rotulo:'Modelo',        id:'f-modelo'},
  {rotulo:'N/S Blade',     id:'f-ns'},
  {rotulo:'Etapa do Processo', id:'f-etapa-outra', box:'#box-etapa',
   pula:function(){ return document.getElementById('f-etapa').value!=='Outra'; }},
  {rotulo:'Dano',          id:'f-dano'},
  {rotulo:'Zi (mm)',       id:'f-z1'},
  {rotulo:'Zf (mm)',       id:'f-z2'},
  {rotulo:'Xi (mm)',       id:'f-x1'},
  {rotulo:'Xf (mm)',       id:'f-x2'},
  {rotulo:'Lado / Localização', grupo:['c-ps','c-ba','c-ss','c-bf','c-int','c-ext'],
   box:'.fld[data-fld="lado"]'},
  {rotulo:'Equipe',        id:'f-equipe'}
];

/* Só marca os campos de vermelho depois da primeira tentativa: formulário
   vermelho antes de a pessoa digitar qualquer coisa é ruído, não ajuda. */
var jaValidou=false;

function faltaPreencher(){
  var falta=[];
  OBRIG.forEach(function(c){
    if(c.pula&&c.pula()) return;
    var vazio = c.grupo
      ? !c.grupo.some(function(id){ return document.getElementById(id).checked; })
      : document.getElementById(c.id).value.trim()==='';
    if(!vazio) return;
    falta.push({
      rotulo:c.rotulo,
      box: c.box ? document.querySelector(c.box)
                 : document.getElementById(c.id).closest('.fld'),
      foco: document.getElementById(c.grupo?c.grupo[0]:c.id)
    });
  });
  return falta;
}

function apontaFaltas(falta,rolar){
  var marcados=document.querySelectorAll('.faltando');
  Array.prototype.forEach.call(marcados,function(e){ e.classList.remove('faltando'); });
  falta.forEach(function(f){ if(f.box) f.box.classList.add('faltando'); });
  if(rolar&&falta.length&&falta[0].box){
    try{ falta[0].box.scrollIntoView({block:'center',behavior:'smooth'}); }
    catch(e){ falta[0].box.scrollIntoView(); }
  }
}

/* Resumo curto: a lista inteira com 13 nomes não cabe e ninguém lê */
function resumoFaltas(falta){
  var n=falta.map(function(f){ return f.rotulo; });
  return n.length<=3 ? n.join(', ')
                     : n.slice(0,3).join(', ')+' e mais '+(n.length-3);
}

/* Chamado antes de abrir a câmera e antes de salvar. true = pode seguir. */
function exigePreenchimento(acao){
  var falta=faltaPreencher();
  jaValidou=true;
  apontaFaltas(falta,true);
  atualizaBotoes();
  if(!falta.length) return true;
  var st=document.getElementById('st');
  st.className='status er';
  st.textContent='Preencha '+falta.length+' campo(s) para '+acao;
  return false;
}

/* Estado ao vivo dos botões e do aviso — roda a cada tecla, via render() */
function atualizaBotoes(){
  var falta=faltaPreencher();
  ['btn-cam','btn-galeria','btn-save'].forEach(function(id){
    var b=document.getElementById(id);
    if(b) b.classList.toggle('bloqueado',falta.length>0);
  });
  var av=document.getElementById('falta-aviso');
  if(av){
    av.style.display = falta.length ? 'block' : 'none';
    av.textContent = falta.length
      ? '🔒 Faltam '+falta.length+' campo(s) para liberar a câmera: '+resumoFaltas(falta)
      : '';
  }
  if(jaValidou) apontaFaltas(falta,false);
}

/* ═══════════════════════════════════════════════════════════════════════════
   MEMÓRIA DOS CAMPOS
   ───────────────────────────────────────────────────────────────────────────
   Em campo o técnico tira dezenas de fotos da MESMA pá: parque, torre,
   cliente, modelo, N/S, dano, medidas, lado e equipe são os mesmos da primeira
   até a última foto. Esses campos ficam gravados no aparelho (localStorage) e
   voltam preenchidos no próximo acesso — inclusive no dia seguinte, e mesmo
   sem internet.

   FICA DE FORA, de propósito, só a Etapa do Processo (e o campo "Outra"):
   muda a cada etapa fotografada. Data e hora não são mais campo nenhum — vêm
   do carimbo gravado no rodapé da foto, na hora exata da captura.

   O campo gravado nasce TRAVADO. Mudar exige DOIS toques:
     1º toque no campo  → aparece o botão ✏️ Editar ao lado do rótulo;
     2º toque no botão  → o campo libera e recebe o cursor.
   Ao sair do campo ele grava e trava de novo sozinho. Campo vazio nunca
   trava: não há nada para proteger.
   ═══════════════════════════════════════════════════════════════════════════ */
var MEM_KEY='ew_fotocard_campos';

/* Um item por campo gravado. "grupo" = várias caixas de seleção tratadas como
   um campo só (Lado / Localização). O "box" é preenchido no memInit. */
var MEM=[
  {k:'parque', id:'f-parque'},
  {k:'turbina',id:'f-turbina'},
  {k:'cliente',id:'f-cliente'},
  {k:'modelo', id:'f-modelo'},
  {k:'ns',     id:'f-ns'},
  {k:'dano',   id:'f-dano'},
  {k:'z1',     id:'f-z1'},
  {k:'z2',     id:'f-z2'},
  {k:'x1',     id:'f-x1'},
  {k:'x2',     id:'f-x2'},
  {k:'lado',   grupo:['c-ps','c-ba','c-ss','c-bf','c-int','c-ext']},
  {k:'equipe', id:'f-equipe'}
];

function byId(id){ return document.getElementById(id); }
function memEls(f){ return f.grupo ? f.grupo.map(byId) : [byId(f.id)]; }
function memTemValor(f){
  return f.grupo ? f.grupo.some(function(id){ return byId(id).checked; })
                 : byId(f.id).value.trim()!=='';
}

/* Gravação adiada: digitar dispara isso a cada tecla e localStorage é síncrono */
var tMem=null;
function memGrava(){ clearTimeout(tMem); tMem=setTimeout(memGravaAgora,300); }
function memGravaAgora(){
  clearTimeout(tMem);
  var o={};
  MEM.forEach(function(f){
    o[f.k]= f.grupo ? f.grupo.map(function(id){ return !!byId(id).checked; })
                    : byId(f.id).value;
  });
  try{ localStorage.setItem(MEM_KEY,JSON.stringify(o)); }catch(e){}
}

function memLe(){
  var o=null;
  try{ o=JSON.parse(localStorage.getItem(MEM_KEY)||'null'); }catch(e){}
  return (o&&typeof o==='object')?o:null;
}

/* Campo veio da memória? É isso — e não "tem algo escrito" — que decide se ele
   nasce travado. O <select> Cliente, por exemplo, sempre tem um valor (GE),
   mas na primeira vez que o app abre ninguém escolheu nada ainda: travar ali
   seria pedir dois toques para uma escolha que nunca foi feita. */
function memGravado(f,o){
  if(!o) return false;
  var v=o[f.k];
  if(f.grupo) return Object.prototype.toString.call(v)==='[object Array]'&&v.some(Boolean);
  return typeof v==='string'&&v.trim()!=='';
}

function memRestaura(o){
  if(!o) return;
  MEM.forEach(function(f){
    var v=o[f.k];
    if(f.grupo){
      if(Object.prototype.toString.call(v)==='[object Array]')
        f.grupo.forEach(function(id,i){ byId(id).checked=!!v[i]; });
      return;
    }
    if(typeof v!=='string'||v==='') return;
    var el=byId(f.id);
    if(el.tagName==='SELECT'){
      /* a opção pode ter saído da lista numa versão nova: só aceita se existir */
      var existe=Array.prototype.some.call(el.options,function(op){ return op.value===v; });
      if(existe) el.value=v;
    } else el.value=v;
  });
}

/* ── Trava / destrava ──
   O <select> não aceita readonly, só disabled; a caixa de seleção idem. Campo
   desabilitado continua devolvendo .value / .checked para o getState(), então
   o fotocard desenhado não muda em nada. */
function memTrava(f,travar){
  if(!f.box) return;
  f.box.classList.toggle('locked',!!travar);
  if(!travar) f.box.classList.remove('armed');
  memEls(f).forEach(function(el){
    if(el.tagName==='SELECT'||el.type==='checkbox') el.disabled=!!travar;
    else el.readOnly=!!travar;
  });
}
/* 1º toque: mostra o ✏️ Editar deste campo e esconde o dos outros */
function memArma(f){
  MEM.forEach(function(o){ if(o!==f&&o.box) o.box.classList.remove('armed'); });
  if(f.box&&f.box.classList.contains('locked')) f.box.classList.add('armed');
}
/* 2º toque: libera a digitação */
function memEdita(f){
  memTrava(f,false);
  var el=memEls(f)[0];
  try{ el.focus(); }catch(e){}
  memInfo('✏️ Campo liberado — ao sair dele o valor é gravado e travado de novo');
}
/* Saiu do campo: grava o que ficou e trava de novo */
function memFecha(f){
  if(!f.box) return;
  f.box.classList.remove('armed');
  if(f.box.classList.contains('locked')||!memTemValor(f)) return;
  memGravaAgora();
  memTrava(f,true);
  memInfoPadrao();
}

/* ── Barra: liberar tudo / limpar ── */
function liberaTudo(){
  MEM.forEach(function(f){ memTrava(f,false); });
  memInfo('🔓 Todos liberados — cada campo trava de novo assim que você sair dele');
}
function limpaMemoria(){
  if(!confirm('Apagar os dados gravados neste aparelho?\n\nParque, torre, cliente, modelo, N/S, dano, medidas, lado e equipe voltam em branco.')) return;
  try{ localStorage.removeItem(MEM_KEY); }catch(e){}
  MEM.forEach(function(f){
    memTrava(f,false);
    memEls(f).forEach(function(el){
      if(el.type==='checkbox') el.checked=false;
      else if(el.tagName==='SELECT') el.selectedIndex=0;
      else el.value='';
    });
  });
  render();
  memInfo('🗑️ Campos apagados');
}

/* ── Aviso da barra ── */
var tInfo=null;
function memInfo(msg){
  var el=byId('mem-info'); if(!el) return;
  el.textContent=msg;
  clearTimeout(tInfo);
  tInfo=setTimeout(memInfoPadrao,4500);
}
function memInfoPadrao(){
  var el=byId('mem-info'); if(!el) return;
  clearTimeout(tInfo);
  var n=0; MEM.forEach(function(f){ if(f.box&&f.box.classList.contains('locked')) n++; });
  el.textContent = n
    ? '🔒 '+n+' campo(s) gravado(s) neste aparelho — toque no campo e depois em ✏️ Editar para mudar'
    : 'O que for preenchido fica gravado neste aparelho (data/hora e etapa ficam de fora)';
}

function memInit(){
  MEM.forEach(function(f){ f.box=document.querySelector('.fld[data-fld="'+f.k+'"]'); });
  var gravados=memLe();
  memRestaura(gravados);

  MEM.forEach(function(f){
    if(!f.box) return;

    /* toque em qualquer ponto do campo travado = arma */
    f.box.addEventListener('click',function(e){
      if(e.target&&e.target.classList&&e.target.classList.contains('edit-btn')) return;
      if(f.box.classList.contains('locked')) memArma(f);
    });
    var bt=f.box.querySelector('.edit-btn');
    if(bt) bt.addEventListener('click',function(e){ e.preventDefault(); e.stopPropagation(); memEdita(f); });

    memEls(f).forEach(function(el){
      el.addEventListener('input',memGrava);
      el.addEventListener('change',memGrava);
      if(el.tagName==='SELECT'){
        /* escolher no <select> já encerra a edição. Sem "blur" aqui: o select
           nunca está vazio, e travar só por passar por ele prenderia o campo
           num valor que ninguém escolheu. */
        el.addEventListener('change',function(){ memFecha(f); });
      } else if(el.type!=='checkbox'){
        el.addEventListener('blur',function(){ memFecha(f); });
      }
      /* caixa de seleção não tem "sair do campo" útil — quem fecha o grupo é o
         clique fora, tratado no listener do documento abaixo */
    });

    if(memGravado(f,gravados)) memTrava(f,true);
  });

  /* Clique em qualquer outro lugar: desarma e fecha os campos que ficaram
     abertos (inclusive o grupo de caixas de seleção). Os botões da própria
     barra ficam de fora, senão o "Liberar todos" travaria tudo de volta no
     mesmo clique que liberou. */
  document.addEventListener('click',function(e){
    if(e.target&&e.target.closest&&e.target.closest('#mem-bar')) return;
    var dentro=(e.target&&e.target.closest)?e.target.closest('.fld'):null;
    MEM.forEach(function(f){
      if(!f.box||f.box===dentro) return;
      f.box.classList.remove('armed');
      if(f.box.classList.contains('locked')) return;
      if(f.box.contains(document.activeElement)) return;   /* ainda digitando nele */
      memFecha(f);
    });
  });

  /* Rede de segurança da gravação.
     A gravação normal é adiada em 300 ms (digitar chama isso a cada tecla e
     localStorage é síncrono) e acontece na hora em que o campo trava. Mas se o
     técnico digita e SAI do app no mesmo instante — troca de aplicativo, botão
     de início, a tela apaga —, o campo nunca perde o foco e o celular pode
     congelar a página antes dos 300 ms, levando junto as últimas teclas.
     Aqui a gravação é forçada no momento em que o app sai de vista.
     "visibilitychange" é o único evento confiável no celular: "beforeunload" e
     "unload" não disparam direito no iOS. */
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='hidden') memGravaAgora();
  });
  window.addEventListener('pagehide',memGravaAgora);

  memInfoPadrao();
}

/* ═══════════════════════════════════════════════════════════════════════════
   FOTOCARD VETORIAL — Canvas 2D nativo do navegador
   ───────────────────────────────────────────────────────────────────────────
   ANTES: o card era HTML e a foto recebia um "print" dele (html2canvas,
   198 KB de biblioteca) — texto rasterizado, serrilhado ao ampliar.
   AGORA: o card é DESENHADO com primitivas do próprio navegador
   (retângulos, linhas e texto). Isso dá:
     • nitidez real — o vetor só é rasterizado no tamanho final da foto;
     • um único desenho para pré-visualização, overlay da câmera e foto,
       então o que aparece na tela é exatamente o que fica gravado;
     • zero dependência externa (offline não precisa baixar nada);
     • transparência de verdade: o FUNDO do card sai com opacidade
       FC.OPACITY (0.7) sobre a foto — dá pra ver a pá através dele —
       enquanto TEXTO e LINHAS ficam 100% opacos, sem perder leitura.
       Para deixar o card mais discreto, troque OPACITY por 0.5.

   O layout é o mesmo do card antigo em HTML: 460 px de largura, borda
   externa de 2,5 px, divisórias de 1 px, células ciano (#9fd9e5), Arial.
   As medidas verticais seguem o modelo de caixa do HTML (padding 3×5 px
   nas células, rótulo de 7 px + 1 px de margem, valor em negrito).
   ═══════════════════════════════════════════════════════════════════════════ */
var FC = (function(){

/* ── Constantes de layout ── */
/* Largura de trabalho do card. Foi de 460 para 900: com 460 o card virava um
   bloco ALTO (proporção 0.9 — mais alto que largo), porque a informação só
   tinha para onde crescer para baixo. Com 900 as células ficam largas, o
   ajuste automático de fonte sobe os valores, e o card fecha como uma FAIXA
   horizontal (proporção ~1.9) — cobre menos pá na vertical.
   As medidas proporcionais (IW/2, IW/4) acompanham sozinhas; as fixas abaixo
   (logo, data, coluna dos checkboxes, régua) foram escaladas na mão. */
var W=900, OUT=3, HAIR=1.5, IW=W-2*OUT;    /* 894 px úteis dentro da borda */
var INK='#000', PAPER=[255,255,255], CYAN=[159,217,229];   /* #9fd9e5 */
var FAM='Arial, Helvetica, sans-serif';
/* Proporções e opacidade tiradas do fotocard de referência usado em campo
   (foto CLE 5-12 / São Clemente): card com ~38% do lado MENOR da foto,
   quase encostado no canto, e fundo bem opaco para leitura no relatório. */
var OPACITY=0.85;            /* opacidade do fundo do card sobre a foto */
var FRAC0=0.50;              /* padrão: card = 50% do lado menor da foto.
                                Era 38% quando o card era um bloco alto. Como
                                agora ele é faixa (900x530), 50% dá texto MAIOR
                                que o card antigo e ainda cobre 25% menos altura
                                da pá. O slider na câmera segue mandando. */
var FRAC=FRAC0;              /* em uso — o slider da câmera ajusta (0,20 a 0,70) */
var fracManual=false;        /* true quando o tamanho foi escolhido à mão */
var MARGIN=0.01;             /* folga até o canto = 1% do lado menor */
var MINW=760;                /* Piso de legibilidade. O card é desenhado como
                                FRAÇÃO da foto, então em foto de baixa
                                resolução ele encolhe junto — e como os rótulos
                                do card têm 7 px no tamanho de projeto (460 px
                                de largura), abaixo disso eles saem com menos
                                de 7 px e viram borrão.
                                Com 520 o card nunca é rasterizado abaixo do
                                tamanho de projeto: os rótulos ficam em 7,9 px
                                e os valores em 12,4 px, que é o mínimo que
                                aguenta zoom no relatório. Era 400, que dava
                                6,1 px de rótulo em 720p — a causa do card
                                "mal renderizado".
                                Só vale no automático: se a pessoa escolheu o
                                tamanho à mão, a escolha dela manda. */
var PX=9, PY=5;              /* padding das células de dado (era 3px 5px) */
var LBL=19, LBLH=22, LBLM=2; /* rótulo: 13px NEGRITO, caixa 15px, margem 1px.
                                Ficava em 8px enquanto o valor ia a 26/36 — de
                                longe, na foto, o título sumia e sobrava só o
                                número solto, sem dizer do que era. */
var A=1;                     /* opacidade em uso no desenho corrente */

/* ── Utilitários ── */
function rgba(c,a){ return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
function fnt(px,bold){ return (bold?'bold ':'')+px+'px '+FAM; }
function lhx(px,f){ return px*(f||1.15); }   /* altura da caixa de linha */
function str(v){ return v==null?'':String(v); }
function up(v){ return str(v).toUpperCase(); }

/* Canvas auxiliar, só para medir texto (nunca é exibido) */
var mc=document.createElement('canvas').getContext('2d');

/* Logo em base64: carrega uma vez e redesenha o card quando ficar pronta */
var logo=new Image(), logoOk=false;
logo.onload=function(){ logoOk=true; if(typeof render==='function') render(); };
logo.src=LOGO;
function logoH(){ return logoOk ? 164*(logo.naturalHeight/logo.naturalWidth) : 78; }

/* ── Primitivas de desenho ── */
function fill(ctx,x,y,w,h,c){ ctx.fillStyle=c; ctx.fillRect(x,y,w,h); }

/* Fundos (papel / ciano) respeitam a opacidade. O clearRect antes do preenchimento
   evita que duas camadas translúcidas se somem — sem ele o ciano sobre o papel
   ficaria mais opaco que o resto do card. */
function bg(ctx,x,y,w,h,c){ if(A<1) ctx.clearRect(x,y,w,h); fill(ctx,x,y,w,h,rgba(c,A)); }

/* Uma linha de texto. y = topo da CAIXA DE LINHA (lh); o texto é centralizado
   nessa caixa, do mesmo jeito que o HTML faz com line-height. */
function line(ctx,s,x,y,size,bold,align,lh,ls){
  s=str(s); if(!s) return;
  ctx.font=fnt(size,bold); ctx.fillStyle=INK; ctx.textBaseline='top';
  var top=y+((lh||lhx(size))-lhx(size))/2;
  if(ls){ lsLine(ctx,s,x,top,ls,align); return; }
  ctx.textAlign=align||'left';
  ctx.fillText(s,x,top);
  ctx.textAlign='left';
}

/* letter-spacing feito à mão (caractere por caractere): não depende de
   ctx.letterSpacing, que só existe em navegadores recentes. */
function lsLine(ctx,s,x,y,ls,align){
  var i, w=-ls;
  for(i=0;i<s.length;i++) w+=ctx.measureText(s.charAt(i)).width+ls;
  var cx = align==='center' ? x-w/2 : (align==='right' ? x-w : x);
  ctx.textAlign='left';
  for(i=0;i<s.length;i++){
    ctx.fillText(s.charAt(i),cx,y);
    cx+=ctx.measureText(s.charAt(i)).width+ls;
  }
}

/* Quebra o texto em linhas que caibam em maxW — respeita o \n do textarea
   (Equipe) e corta palavras maiores que a célula. */
function wrap(s,maxW,font,ls){
  mc.font=font;
  function wd(t){ return mc.measureText(t).width + (ls?ls*t.length:0); }
  var out=[];
  str(s).split('\n').forEach(function(par){
    var buf='';
    par.split(' ').forEach(function(word){
      while(wd(word)>maxW && word.length>1){          /* palavra gigante */
        var cut=word.length;
        while(cut>1 && wd(word.slice(0,cut))>maxW) cut--;
        if(buf){ out.push(buf); buf=''; }
        out.push(word.slice(0,cut));
        word=word.slice(cut);
      }
      var t=buf?buf+' '+word:word;
      if(buf && wd(t)>maxW){ out.push(buf); buf=word; }
      else buf=t;
    });
    out.push(buf);
  });
  return out;
}

/* Célula "rótulo + valor" (o antigo .fc-cell com .fc-lbl e .fc-val).
   x/w = borda esquerda e largura ÚTEIS da célula (já sem a divisória). */
/* ─── Ajuste do valor à célula ───
   O card tinha muito branco: campo curto ("GE", "244", "Trinca") era escrito
   em 11px dentro de uma célula larga e sobrava metade do espaço. Agora o valor
   cresce até "max" enquanto couber numa linha só — quem tem espaço, usa. Nunca
   fica menor que o tamanho base, e texto longo continua quebrando como antes. */
/* Data do dia, DD/MM/AAAA. Chamada no momento em que o card é desenhado —
   ver o comentário do bloco 1 do layout. */
function dataDeHoje(){
  var d=new Date(), p=function(n){ return n<10 ? '0'+n : ''+n; };
  return p(d.getDate())+'/'+p(d.getMonth()+1)+'/'+d.getFullYear();
}

function medeTexto(t,f){ mc.font=f; return mc.measureText(t).width; }

/* Mesma ideia para o texto centralizado (Parque e Detalhes), que ainda leva
   espaçamento entre letras — por isso a largura entra na conta com o ls. */
function tamanhoCentral(txt,larg,base,max,ls){
  var t=str(txt); if(!t) return base;
  var tam=max;
  while(tam>base && (medeTexto(t,fnt(tam,true)) + ls*(t.length-1)) > larg) tam--;
  return tam;
}

function tamanhoValor(val,larg,base,max){
  var t=str(val);
  if(!t || !max || max<=base) return base;
  var tam=max;
  while(tam>base && medeTexto(t,fnt(tam,true))>larg) tam--;
  return tam;
}

function cellLV(ctx,x,y,w,lbl,val,size,o){
  o=o||{};
  var padX=o.padX||PX, padY=o.padY||PY, mb=(o.mb==null?LBLM:o.mb);
  size = tamanhoValor(o.upper?up(val):val, w-2*padX, size, o.max);
  var tx=x+padX, ty=y+padY, lh=lhx(size,o.lhf);
  line(ctx,lbl,tx,ty,LBL,true,'left',LBLH);
  ty+=LBLH+mb;
  wrap(o.upper?up(val):val,w-2*padX,fnt(size,true),0).forEach(function(t){
    line(ctx,t,tx,ty,size,true,'left',lh);
    ty+=lh;
  });
}
/* Altura de conteúdo da mesma célula (para dimensionar a linha) */
function cellLVh(w,val,size,o){
  o=o||{};
  var padX=o.padX||PX, padY=o.padY||PY, mb=(o.mb==null?LBLM:o.mb);
  size = tamanhoValor(o.upper?up(val):val, w-2*padX, size, o.max);
  var n=wrap(o.upper?up(val):val,w-2*padX,fnt(size,true),0).length;
  return padY+LBLH+mb+n*lhx(size,o.lhf)+padY;
}

/* Caixa de seleção 11×11. O ✓ é um traço vetorial (não depende de o
   dispositivo ter o glifo "✓" na fonte). */
function checkbox(ctx,x,y,on,tam){
  var s=tam||11;
  if(on){
    fill(ctx,x,y,s,s,INK);
    ctx.save();
    ctx.strokeStyle='#fff'; ctx.lineWidth=s*0.164; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.beginPath();
    ctx.moveTo(x+s*0.22,y+s*0.54); ctx.lineTo(x+s*0.41,y+s*0.74); ctx.lineTo(x+s*0.79,y+s*0.30);
    ctx.stroke(); ctx.restore();
  } else {
    /* só a moldura de 1,5px — o interior é o próprio papel do card */
    var b=Math.max(1.5,s*0.14);
    fill(ctx,x,y,s,b,INK); fill(ctx,x,y+s-b,s,b,INK);
    fill(ctx,x,y,b,s,INK); fill(ctx,x+s-b,y,b,s,INK);
  }
}

/* Régua de 15 cm — mesma geometria do SVG antigo */
function ruler(ctx,x,y,w){
  var n=15, px=w/n, i, j;
  for(i=0;i<=n;i++){
    var cx=x+i*px, big=(i%5===0), lw=big?1:0.5;
    fill(ctx,cx-lw*0.9,y,lw*1.8,big?18:11,INK);
    line(ctx,String(i),cx,y+21,13,true,'center',lhx(13));
    if(i<n) for(j=1;j<=4;j++) fill(ctx,cx+j*px/5-0.3,y,0.6,6,INK);
  }
  line(ctx,'cm',x+w+14,y+8,14,true,'left',lhx(14));
}

/* ═══ LAYOUT ═══
   Monta a lista de blocos (as linhas do card) já com a altura resolvida:
   cada bloco cresce se o texto quebrar em mais linhas, igual ao HTML. */
function layout(s){
  var B=[];
  var dataCard=str(s.data)||dataDeHoje();

  /* ═══ FAIXA HORIZONTAL ═══
     O card era um bloco alto: 9 linhas empilhadas, uma para cada campo, e a
     largura sobrando à direita de quase todas. Cobria pá demais na vertical.

     Agora a largura é a que trabalha: os campos curtos entram lado a lado na
     mesma faixa, e o card fecha em ~7 linhas em vez de 9. A altura que sobra
     virou tamanho de fonte — cada valor cresce até encostar na célula.
     O par de cada eixo continua na vertical (Zf embaixo de Zi, Xf embaixo de
     Xi), como na ficha de papel. */

  /* 1 ─ Logo | Data | Modelo | Cliente | N/S */
  var lgW=168, dtW=196, clW=150, nsW=136, moW=IW-lgW-dtW-clW-nsW, lgH=logoH();
  B.push({
    h:Math.max(56, lgH+12+HAIR,
                   cellLVh(dtW-HAIR,dataCard,12,{max:32})+HAIR,
                   cellLVh(moW-HAIR,s.modelo,11,{max:34})+HAIR,
                   cellLVh(clW-HAIR,s.cliente,11,{max:32})+HAIR,
                   cellLVh(nsW,s.ns,11,{max:32})+HAIR),
    draw:function(ctx,y,h){
      var ch=h-HAIR, x2=OUT+lgW, x3=x2+dtW, x4=x3+moW, x5=x4+clW;
      bg(ctx,x3,y,moW,ch,CYAN);                    /* Modelo destacado */
      bg(ctx,x5,y,nsW,ch,CYAN);                    /* N/S destacado */
      [x2,x3,x4,x5].forEach(function(x){ fill(ctx,x-HAIR,y,HAIR,ch,INK); });
      if(logoOk) ctx.drawImage(logo,OUT+(lgW-HAIR-152)/2,y+(ch-lgH)/2,152,lgH);
      cellLV(ctx,x2,y,dtW-HAIR,'Data',dataCard,12,{max:32});
      cellLV(ctx,x3,y,moW-HAIR,'Modelo',s.modelo,11,{max:34});
      cellLV(ctx,x4,y,clW-HAIR,'Cliente',s.cliente,11,{max:32});
      cellLV(ctx,x5,y,nsW,'N/S',s.ns,11,{max:32});
    }
  });

  /* 2 ─ Parque eólico: a identificação principal, sozinha na faixa */
  var pqTxt=up(s.parque)||'—';
  var pqTam=tamanhoCentral(pqTxt,IW-20,15,54,2.5);
  var pqL=wrap(pqTxt,IW-20,fnt(pqTam,true),2.5), pqLH=lhx(pqTam,1.25);
  B.push({
    h:3+LBLH+LBLM+Math.max(24,pqL.length*pqLH)+5+HAIR,
    draw:function(ctx,y){
      line(ctx,'Parque eólico (Local)',OUT+10,y+3,LBL,true,'left',LBLH);
      var ty=y+3+LBLH+LBLM;
      pqL.forEach(function(t){ line(ctx,t,W/2,ty,pqTam,true,'center',pqLH,2.5); ty+=pqLH; });
    }
  });

  /* 3 ─ Torre | Detalhes (a etapa do processo) */
  var toW=Math.round(IW*0.32), etW=IW-toW;
  var etTxt=up(s.etapa)||'—';
  var etTam=tamanhoCentral(etTxt,etW-20,13,42,1);
  var etL=wrap(etTxt,etW-20,fnt(etTam,true),1), etLH=lhx(etTam,1.25);
  B.push({
    h:Math.max(56, cellLVh(toW-HAIR,s.turbina,11,{max:36})+HAIR,
                   3+LBLH+LBLM+etL.length*etLH+5+HAIR),
    draw:function(ctx,y,h){
      var ch=h-HAIR, x2=OUT+toW;
      fill(ctx,x2-HAIR,y,HAIR,ch,INK);
      cellLV(ctx,OUT,y,toW-HAIR,'Torre',s.turbina,11,{max:36});
      line(ctx,'Detalhes',x2+10,y+3,LBL,true,'left',LBLH);
      var ty=y+3+LBLH+LBLM, cx=x2+etW/2;
      etL.forEach(function(t){ line(ctx,t,cx,ty,etTam,true,'center',etLH,1); ty+=etLH; });
    }
  });

  /* 4 e 5 ─ Coordenadas em 2 colunas (Zf embaixo de Zi, Xf embaixo de Xi)
     e o Dano ocupando a terça parte da direita nas duas faixas. */
  var cdW=Math.round(IW*0.66), coW=cdW/2, dnW=IW-cdW;
  var dano={lhf:1.25,max:30};
  var hCoord=Math.max(52, cellLVh(coW-HAIR,s.z1,12,{max:36})+HAIR,
                          cellLVh(coW-HAIR,s.x1,12,{max:36})+HAIR,
                          cellLVh(coW-HAIR,s.z2,12,{max:36})+HAIR,
                          cellLVh(coW-HAIR,s.x2,12,{max:36})+HAIR);
  var hDano=cellLVh(dnW,s.dano,11,dano)+HAIR;
  var hBloco=Math.max(hCoord*2, hDano);
  B.push({
    h:hBloco,
    draw:function(ctx,y,h){
      var meia=h/2, x2=OUT+coW, x3=OUT+cdW;
      bg(ctx,x2,y,coW,meia,CYAN);                       /* coluna X no topo */
      fill(ctx,x2-HAIR,y,HAIR,h-HAIR,INK);              /* divisória Z | X */
      fill(ctx,x3-HAIR,y,HAIR,h-HAIR,INK);              /* divisória | Dano */
      fill(ctx,OUT,y+meia-HAIR,cdW-HAIR,HAIR,INK);      /* meia-linha só nas coordenadas */
      cellLV(ctx,OUT,y,coW-HAIR,'Zi (mm)',s.z1,12,{max:36});
      cellLV(ctx,x2,y,coW-HAIR,'Xi (mm)',s.x1,12,{max:36});
      cellLV(ctx,OUT,y+meia,coW-HAIR,'Zf (mm)',s.z2,12,{max:36});
      cellLV(ctx,x2,y+meia,coW-HAIR,'Xf (mm)',s.x2,12,{max:36});
      cellLV(ctx,x3,y,dnW,'Dano',s.dano,11,dano);
    }
  });

  /* 6 ─ Lado/Localização | Equipe | Régua, tudo na mesma faixa */
  var cbW=Math.round(IW*0.30), rgW=Math.round(IW*0.34), eqW=IW-cbW-rgW;
  var eqO={padX:10,padY:5,mb:2,lhf:1.5,upper:true,max:22};
  var CB=[['PS/UP',s.ps],['BA/LE',s.ba],['SS/Down',s.ss],
          ['BF/TE',s.bf],['Interno',s.int],['Externo',s.ext]];
  var CBTAM=20, CBFONTE=17, CBPASSO=26;
  var gridH=3*CBTAM+2*(CBPASSO-CBTAM);
  B.push({
    h:Math.max(92, gridH+14+HAIR, cellLVh(eqW,s.equipe,9,eqO)+HAIR), noline:true,
    draw:function(ctx,y,h){
      var ch=h-HAIR, x2=OUT+cbW, x3=x2+eqW;
      fill(ctx,x2-HAIR,y,HAIR,ch,INK);
      fill(ctx,x3-HAIR,y,HAIR,ch,INK);
      var colW=(cbW-HAIR-20-6)/2, gy=y+(ch-gridH)/2;
      CB.forEach(function(it,i){
        var cx=OUT+10+(i%2)*(colW+6), cy=gy+Math.floor(i/2)*CBPASSO;
        checkbox(ctx,cx,cy,!!it[1],CBTAM);
        line(ctx,it[0],cx+CBTAM+6,cy,CBFONTE,true,'left',CBTAM);
      });
      cellLV(ctx,x2,y,eqW,'Equipe',s.equipe,9,eqO);
      ruler(ctx,x3+12,y+(ch-42)/2+6,rgW-40);
    }
  });

  var H=OUT*2; B.forEach(function(b){ H+=b.h; });

  return {w:W,h:H,blocks:B};
}

/* ═══ DESENHO ═══
   Escreve o card inteiro no contexto recebido — o canvas é todo do card
   (a foto recebe o resultado por drawImage, nunca o desenho direto, senão
   o clearRect das células ciano apagaria pedaços da imagem). */
function paintLayout(ctx,L,scale,alpha){
  A=(alpha==null?1:alpha);
  ctx.save();
  ctx.setTransform(scale,0,0,scale,0,0);
  /* O logo é o único elemento bitmap do card: reamostragem de alta
     qualidade evita serrilhado nas escalas intermediárias. */
  ctx.imageSmoothingEnabled=true;
  if('imageSmoothingQuality' in ctx) ctx.imageSmoothingQuality='high';
  ctx.clearRect(0,0,L.w,L.h);
  fill(ctx,0,0,L.w,L.h,rgba(PAPER,A));               /* papel do card */
  var y=OUT;
  L.blocks.forEach(function(b){
    b.draw(ctx,y,b.h);
    if(!b.noline) fill(ctx,OUT,y+b.h-HAIR,IW,HAIR,INK);   /* divisória da linha */
    y+=b.h;
  });
  ctx.strokeStyle=INK; ctx.lineWidth=OUT;                 /* borda externa 2,5px */
  ctx.strokeRect(OUT/2,OUT/2,L.w-OUT,L.h-OUT);
  ctx.restore();
  A=1;
  return L;
}

return {
  W:W,
  OPACITY:OPACITY,
  MARGIN:MARGIN,
  FRAC0:FRAC0,
  /* Tamanho do card na foto — o slider da câmera mexe aqui */
  frac:function(){ return FRAC; },
  setFrac:function(f,manual){
    f=parseFloat(f);
    if(isFinite(f)) FRAC=Math.min(0.70,Math.max(0.20,f));
    fracManual=!!manual;      /* false devolve o piso MINW (modo automático) */
    return FRAC;
  },
  /* Largura (px) que o card terá numa foto cujo lado MENOR é "lado" */
  larguraNaFoto:function(lado){
    var w=lado*FRAC;
    if(!fracManual) w=Math.max(MINW,w);
    return Math.round(Math.min(lado*0.9,w));
  },
  /* Só as medidas ({w,h}) — usado para escalar a pré-visualização */
  measure:function(s){ return layout(s); },
  /* Dimensiona o <canvas> da tela e desenha nele.
     ss = supersampling (2 = texto nítido também em tela retina) */
  fit:function(cv,s,ss,alpha){
    var L=layout(s);
    cv.width=Math.ceil(L.w*ss); cv.height=Math.ceil(L.h*ss);
    cv.style.width=L.w+'px'; cv.style.height=L.h+'px';
    paintLayout(cv.getContext('2d'),L,ss,alpha);
    return L;
  },
  /* Card pronto num canvas novo, na escala e opacidade pedidas.
     scale = pixels finais / 460 — o vetor é rasterizado direto no tamanho
     de destino, então nunca há reamostragem. */
  toCanvas:function(s,scale,alpha){
    var L=layout(s), cv=document.createElement('canvas');
    cv.width=Math.max(1,Math.ceil(L.w*scale));
    cv.height=Math.max(1,Math.ceil(L.h*scale));
    paintLayout(cv.getContext('2d'),L,scale,alpha);
    return cv;
  }
};
})();

/* ─── Render: pré-visualização + overlay da câmera ─── */
var CARD_W=FC.W;   /* largura "nativa" do card (mesma do módulo FC) */

/* Supersampling dos canvas exibidos na tela: acompanha a densidade do
   aparelho (2× em tela comum, 3× em retina) para o card não ficar borrado.
   No desktop o zoom da página muda o devicePixelRatio — por isso o listener
   de resize redesenha quando ele muda. */
function ssTela(){ return Math.min(3,Math.max(2,Math.round(window.devicePixelRatio||1))); }
var SS=ssTela(), lastDPR=window.devicePixelRatio||1;

/* Desenha o card translúcido do overlay da câmera */
function paintCamCard(){
  var cam=document.getElementById('fc-cam');
  if(cam) FC.fit(cam,curState,SS,FC.OPACITY);
}

function render(){
  curState=getState();
  var h=0;
  var prev=document.getElementById('fc-preview');
  /* Preview opaco (é o card "no papel") */
  if(prev) h=FC.fit(prev,curState,SS,1).h;
  /* O overlay translúcido só é redesenhado com a câmera aberta — evita
     desenho jogado fora a cada tecla digitada no formulário. */
  if(document.getElementById('cam-view').classList.contains('on')) paintCamCard();
  updateScale(h);
  atualizaBotoes();     /* libera ou trava a câmera conforme o que falta */
}

function updateScale(h){
  var avail=Math.min(window.innerWidth-28,520);
  var scale=avail/CARD_W;
  var inner=document.getElementById('prev-inner');
  var outer=document.getElementById('prev-outer');
  if(!h) h=FC.measure(curState).h;
  inner.style.transform='scale('+scale+')';
  inner.style.transformOrigin='top left';
  inner.style.width=CARD_W+'px';
  outer.style.height=(h*scale)+'px';
  outer.style.width=(CARD_W*scale)+'px';
}

/* Ângulo de giro da tela: 0 (em pé), 90/270 (deitado), 180 (de cabeça pra baixo).
   É o que permite o card acompanhar o sentido físico da câmera. */
function anguloOrientacao(){
  try{
    if(window.screen&&screen.orientation&&typeof screen.orientation.angle==='number')
      return ((screen.orientation.angle%360)+360)%360;
    if(typeof window.orientation==='number')
      return ((window.orientation%360)+360)%360;
  }catch(e){}
  return window.innerWidth>window.innerHeight ? 90 : 0;  // fallback
}

/* Tamanho do overlay ao vivo = o tamanho REAL que o card vai ter na foto,
   convertido para pixels de tela pela escala do object-fit:cover do vídeo.
   É isso que faz o slider de ajuste valer: o que se vê é o que grava.
   O card também GIRA junto com o celular: quando a tela vira, ele vira no sentido
   contrário ao giro do conteúdo, ficando alinhado com a câmera (deitado se o
   celular estiver deitado). A proporção nunca muda — só a rotação. */
function scaleCamOverlay(){
  var wrap=document.getElementById('cam-overlay-wrap');
  var card=document.getElementById('fc-cam');
  if(!wrap||!card) return;

  var ladoMenor=Math.min(window.innerWidth,window.innerHeight);
  var video=document.getElementById('cam-video');
  var targetW;
  if(video&&video.videoWidth){
    var cover=Math.max(window.innerWidth/video.videoWidth, window.innerHeight/video.videoHeight);
    targetW=FC.larguraNaFoto(Math.min(video.videoWidth,video.videoHeight))*cover;
  } else {
    targetW=ladoMenor*FC.frac();          /* antes do vídeo abrir */
  }
  /* Teto: em tela estreita com vídeo deitado (webcam de PC, por exemplo) o
     recorte do cover é grande e o card ocuparia a tela toda. Aqui ele para em
     70% — o valor em pixels no rótulo continua mostrando o tamanho real. */
  targetW=Math.min(targetW, ladoMenor*0.70);
  var s=targetW/CARD_W;

  var ang=anguloOrientacao();
  var deitado=(ang===90||ang===270);

  /* Altura vem do layout do card (FC), não do DOM: vale mesmo antes de o
     overlay ficar visível, quando offsetHeight ainda seria 0. */
  var cardH=FC.measure(curState).h;
  var w=CARD_W*s, h=cardH*s;
  var bbW=deitado?h:w, bbH=deitado?w:h;   // tamanho ocupado DEPOIS de girar

  /* Posição = fração do espaço livre (posX/posY, mexidos pelo arraste).
     1 / 0 = canto superior direito, o padrão. Guarda a caixa na tela para o
     arraste saber se o dedo pegou no card. */
  var livreW=Math.max(0, window.innerWidth -2*MG_TELA-bbW);
  var livreH=Math.max(0, window.innerHeight-2*MG_TELA-bbH);
  var cx=MG_TELA+posX*livreW+bbW/2;
  var cy=MG_TELA+posY*livreH+bbH/2;
  camCardBox={x:cx-bbW/2, y:cy-bbH/2, w:bbW, h:bbH};
  wrap.style.transform='translate('+(cx-CARD_W/2)+'px,'+(cy-cardH/2)+'px) rotate('+(-ang)+'deg) scale('+s+')';
}

/* ═══ AJUSTE MANUAL DO TAMANHO DO CARD ═══
   Quem tira a foto escolhe o quanto o card ocupa, pelo slider, pelos botões
   − / + ou com dois dedos (pinça) na tela da câmera. Como o card é vetorial,
   ele é REDESENHADO no tamanho escolhido — nada de esticar bitmap, então a
   nitidez não muda: em foto de 4K, 20% dá 432 px de card e 70% dá 1512 px,
   os dois igualmente nítidos. A escolha fica guardada no aparelho. */
var CARD_FRAC_KEY='ew_card_frac';

/* Largura do card na foto atual, em pixels (0 se a câmera não abriu ainda) */
function larguraCardNaFoto(){
  var v=document.getElementById('cam-video');
  if(!v||!v.videoWidth) return 0;
  return FC.larguraNaFoto(Math.min(v.videoWidth,v.videoHeight));
}

function mostraTamanho(){
  var lbl=document.getElementById('cam-size-lbl');
  var rng=document.getElementById('cam-size-range');
  var pct=Math.round(FC.frac()*100), px=larguraCardNaFoto();
  if(rng) rng.value=pct;
  if(lbl) lbl.textContent=pct+'%'+(px?(' · '+px+' px'):'');
}

/* Posição do card, como fração do espaço livre (0 a 1 em cada eixo).
   Guardar como fração — e não em pixels — faz a mesma posição valer na tela e
   na foto, em qualquer resolução e nas duas orientações: canto na tela = canto
   na foto. Padrão 1 / 0 = canto superior direito, como sempre foi. */
var CARD_POS_KEY='ew_card_pos';
var posX=1, posY=0;
var camCardBox=null;      /* caixa do card na tela — usada para saber se o dedo pegou nele */
var MG_TELA=10;           /* folga do card até a borda da tela */

/* Gravação adiada: arrastar o card, o slider ou dar pinça dispara isso dezenas
   de vezes por segundo, e localStorage é síncrono. */
var tGrava=null;
function gravaAjustes(){
  clearTimeout(tGrava);
  tGrava=setTimeout(function(){
    try{
      localStorage.setItem(CARD_FRAC_KEY,String(FC.frac()));
      localStorage.setItem(CARD_POS_KEY,posX.toFixed(4)+','+posY.toFixed(4));
    }catch(e){}
  },400);
}

/* Tira a transição do CSS enquanto o dedo está em cima (senão o card vai
   atrás com atraso) e devolve depois. */
var tTransicao=null;
function semTransicao(){
  var wrap=document.getElementById('cam-overlay-wrap');
  if(!wrap) return;
  wrap.classList.add('sem-transicao');
  clearTimeout(tTransicao);
  tTransicao=setTimeout(function(){ wrap.classList.remove('sem-transicao'); },250);
}

/* pct = 20 a 70 (% do lado menor da foto) */
function mudaTamanho(pct){
  FC.setFrac(pct/100,true);
  gravaAjustes();
  mostraTamanho();
  semTransicao();
  scaleCamOverlay();
}
function passoTamanho(d){ mudaTamanho(Math.round(FC.frac()*100)+d); }

/* Volta ao padrão de fábrica: 38%, canto superior direito */
function restauraPadrao(){
  clearTimeout(tGrava);
  posX=1; posY=0;
  FC.setFrac(FC.FRAC0,false);            /* false = volta ao automático */
  try{ localStorage.removeItem(CARD_FRAC_KEY); localStorage.removeItem(CARD_POS_KEY); }catch(e){}
  mostraTamanho();
  semTransicao();
  scaleCamOverlay();
}

/* ─── Arrastar o card (um dedo) ───
   O técnico põe o card onde não atrapalha o dano. Só começa a arrastar se o
   dedo encostar NO card — assim segurar o celular não sai movendo nada. */
var drag=null;
function pontoNoCard(x,y){
  var b=camCardBox;
  if(!b) return false;
  return x>=b.x-10 && x<=b.x+b.w+10 && y>=b.y-10 && y<=b.y+b.h+10;
}
function iniciaArraste(x,y){
  if(!pontoNoCard(x,y)) return false;
  drag={x0:x, y0:y, px:posX, py:posY};
  var wrap=document.getElementById('cam-overlay-wrap');
  if(wrap){ wrap.classList.add('sem-transicao','arrastando'); }
  clearTimeout(tTransicao);
  return true;
}
function moveArraste(x,y){
  if(!drag||!camCardBox) return;
  var livreW=Math.max(1, window.innerWidth -2*MG_TELA-camCardBox.w);
  var livreH=Math.max(1, window.innerHeight-2*MG_TELA-camCardBox.h);
  posX=Math.min(1,Math.max(0, drag.px+(x-drag.x0)/livreW));
  posY=Math.min(1,Math.max(0, drag.py+(y-drag.y0)/livreH));
  scaleCamOverlay();
  gravaAjustes();
}
function fimArraste(){
  if(!drag) return;
  drag=null;
  var wrap=document.getElementById('cam-overlay-wrap');
  if(wrap) wrap.classList.remove('sem-transicao','arrastando');
}

/* Pinça com dois dedos: mesma coisa que o slider */
var pinchD0=0, pinchF0=0;
function distDedos(t){
  var dx=t[0].clientX-t[1].clientX, dy=t[0].clientY-t[1].clientY;
  return Math.sqrt(dx*dx+dy*dy);
}

/* ─── Gestos na tela da câmera: 1 dedo move, 2 dedos redimensionam ─── */
function ligarGestos(){
  var el=document.getElementById('cam-view');
  /* toques nos botões e no slider não são gesto do card */
  function ehControle(t){ return !!(t&&t.closest&&t.closest('#cam-controls,#cam-size')); }

  el.addEventListener('touchstart',function(e){
    if(ehControle(e.target)) return;
    if(e.touches.length>=2){ fimArraste(); pinchD0=distDedos(e.touches); pinchF0=FC.frac(); return; }
    iniciaArraste(e.touches[0].clientX,e.touches[0].clientY);
  },{passive:true});

  el.addEventListener('touchmove',function(e){
    if(ehControle(e.target)) return;
    if(e.touches.length>=2&&pinchD0>0){
      e.preventDefault();
      mudaTamanho(Math.round(pinchF0*(distDedos(e.touches)/pinchD0)*100));
      return;
    }
    if(drag&&e.touches.length===1){
      e.preventDefault();                 /* não deixa a página "puxar" */
      moveArraste(e.touches[0].clientX,e.touches[0].clientY);
    }
  },{passive:false});

  function solta(){ pinchD0=0; fimArraste(); }
  el.addEventListener('touchend',solta,{passive:true});
  el.addEventListener('touchcancel',solta,{passive:true});

  /* Mouse: o mesmo arraste no desktop, para conferir antes de ir a campo */
  el.addEventListener('mousedown',function(e){
    if(ehControle(e.target)) return;
    if(iniciaArraste(e.clientX,e.clientY)) e.preventDefault();
  });
  window.addEventListener('mousemove',function(e){ if(drag) moveArraste(e.clientX,e.clientY); });
  window.addEventListener('mouseup',fimArraste);
}

/* Dica de gesto — só enquanto a pessoa não tiver ajustado nada ainda */
function dicaGesto(){
  try{
    if(localStorage.getItem(CARD_POS_KEY)||localStorage.getItem(CARD_FRAC_KEY)) return;
  }catch(e){}
  toast('Arraste o card para mover · pinça para o tamanho',3800);
}

/* ─── Toast da câmera ─── */
function toast(msg,dur){
  var el=document.getElementById('cam-toast');
  el.textContent=msg;el.classList.add('show');
  setTimeout(function(){el.classList.remove('show')},dur||2500);
}

/* ─── Câmera ─── */
async function openCamera(){
  /* Sem o fotocard inteiro preenchido não abre: a foto é o registro, e campo
     em branco na foto não tem como ser corrigido depois. */
  if(!exigePreenchimento('abrir a câmera')) return;
  document.getElementById('cam-view').classList.add('on');
  paintCamCard();          // card do overlay, já translúcido
  mostraTamanho();
  scaleCamOverlay();
  ligaCarimboCam();        // carimbo ao vivo, com o relógio andando
  await startStream();
  ligarListenerOrientacao();
}

async function startStream(){
  stopStream();
  try{
    /* Resolução: pede o MÁXIMO que o aparelho oferecer (4K). O card é
       desenhado como fração da foto, então quanto maior a foto, mais pixels
       o fotocard recebe — é isso que faz ele aguentar zoom no relatório.
       Antes era 1280×720 fixo: o card saía com ~380 px e os rótulos com
       menos de 6 px, ilegíveis ao ampliar. Se o aparelho não tiver 4K, o
       navegador cai sozinho para a resolução mais próxima. */
    var constraints={video:{
      facingMode:facingMode,
      width:{ideal:3840}, height:{ideal:2160},
      advanced:[{focusMode:'continuous'}]
    },audio:false};
    var stream=await navigator.mediaDevices.getUserMedia(constraints);
    camStream=stream;
    var video=document.getElementById('cam-video');
    video.srcObject=stream;
    video.onloadedmetadata=function(){
      mostraResolucao(video);
      /* só agora se sabe a resolução: reposiciona o overlay no tamanho real
         que o card vai ter na foto e mostra esse tamanho em pixels */
      mostraTamanho();
      scaleCamOverlay();
      pintaCarimboCam();   /* idem para o carimbo: agora dá para usar a escala real */
      setTimeout(dicaGesto,2400);   /* depois do aviso de resolução */
    };
    if(!isOnline)document.getElementById('cam-offline-badge').classList.add('show');
  }catch(e){
    toast('Câmera não disponível. Verifique as permissões.');
  }
}

/* Avisa a resolução que a câmera realmente entregou — em campo é isso que
   diz se a foto vai aguentar zoom (1080p = ok, 4K = ótimo). */
function mostraResolucao(video){
  if(!video.videoWidth) return;
  var mp=(video.videoWidth*video.videoHeight/1e6).toFixed(1);
  toast('📷 '+video.videoWidth+'×'+video.videoHeight+' — '+mp+' MP',2200);
}

function stopStream(){
  if(camStream){camStream.getTracks().forEach(function(t){t.stop()});camStream=null}
}

function closeCamera(){
  stopStream();
  desligaCarimboCam();     /* sem câmera aberta não há relógio para atualizar */
  document.getElementById('cam-view').classList.remove('on');
  desligarListenerOrientacao();
}

/* Ao girar o celular com a câmera aberta, alguns navegadores/Android não giram
   o frame do vídeo sozinhos (fica "invertido" em relação ao que a pessoa vê) —
   reabrir o stream força a câmera a renegociar já na orientação atual. */
var orientMQ=(window.matchMedia?window.matchMedia('(orientation: landscape)'):null);
function onMudaOrientacao(){
  // O navegador leva alguns ms para atualizar o ângulo e o tamanho da tela —
  // reposiciona de novo depois, senão o card gira com as medidas antigas.
  var repoe=function(){ scaleCamOverlay(); pintaCarimboCam(); };
  repoe();
  setTimeout(repoe,120);
  setTimeout(repoe,400);
  if(document.getElementById('cam-view').classList.contains('on')&&camStream) startStream();
}
function ligarListenerOrientacao(){
  if(orientMQ&&orientMQ.addEventListener) orientMQ.addEventListener('change',onMudaOrientacao);
  // screen.orientation também pega giro de 90°→270° (deitado dos dois lados),
  // que o media query de landscape sozinho não detecta.
  if(window.screen&&screen.orientation&&screen.orientation.addEventListener)
    screen.orientation.addEventListener('change',onMudaOrientacao);
  window.addEventListener('orientationchange',onMudaOrientacao);
}
function desligarListenerOrientacao(){
  if(orientMQ&&orientMQ.removeEventListener) orientMQ.removeEventListener('change',onMudaOrientacao);
  if(window.screen&&screen.orientation&&screen.orientation.removeEventListener)
    screen.orientation.removeEventListener('change',onMudaOrientacao);
  window.removeEventListener('orientationchange',onMudaOrientacao);
}

async function flipCamera(){
  facingMode=facingMode==='environment'?'user':'environment';
  await startStream();
}

/* ─── Nome de arquivo ───
   Junta os pedaços com "_", trocando o que não for letra/número por "_" e
   descartando os pedaços vazios — assim um campo em branco não deixa "__" no
   meio do nome. O Worker do Dropbox sobe com autorename, então dois arquivos
   de mesmo nome não se sobrescrevem. */
function partesNome(vs){
  return vs.map(function(v){
    /* Acento vira a letra sem acento em vez de "_": "São Clemente" saía como
       "S_o_Clemente" e ficava ruim de achar na galeria e no Dropbox. */
    var t=(v||'');
    try{ t=t.normalize('NFD').replace(/[̀-ͯ]/g,''); }catch(e){}
    return t.replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_+|_+$/g,'').substring(0,16)
            .replace(/_+$/,'');
  }).filter(Boolean).join('_') || 'sem_dados';
}

/* ─── Carimbo que torna cada arquivo único ───
   Sem isto, duas fotos da mesma pá e mesma etapa saem com o MESMO nome. O
   Android então abre aquela caixa perguntando se quer substituir ou salvar
   como "nome (1)", e o Dropbox cria cópia numerada. Data-hora resolve e ainda
   deixa os arquivos em ordem de captura na pasta. O contador só entra se duas
   fotos caírem no mesmo segundo. */
var ultimoCarimbo='', repeticaoCarimbo=0;
function carimboArquivo(){
  var d=new Date(), p=function(n){ return String(n).length<2 ? '0'+n : ''+n; };
  var base = d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '-'
           + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds());
  if(base===ultimoCarimbo){ repeticaoCarimbo++; return base+'-'+repeticaoCarimbo; }
  ultimoCarimbo=base; repeticaoCarimbo=0;
  return base;
}

/* ─── Carimbo de data e hora no rodapé da foto ───
   O mesmo carimbo que as câmeras de campo gravam: canto inferior direito, em
   branco com contorno escuro — lê tanto sobre céu claro quanto sobre pá escura,
   sem precisar de tarja de fundo.

   É a ÚNICA marcação de tempo do fotocard: o campo "Data / Hora" saiu do card
   e do formulário. Ele era preenchido quando o app abria e, num dia inteiro de
   pá, ficava horas atrasado — este aqui é a hora exata em que o obturador
   disparou, com segundos, e ninguém precisa preencher.

   Gira junto com o celular, pelo mesmo ângulo do card, para nunca sair deitado
   numa foto tirada com o aparelho na horizontal.

   Aparece TAMBÉM ao vivo na tela da câmera (pintaCarimboCam, mais abaixo), no
   mesmo canto e no mesmo tamanho que vai ter na foto — o técnico confere a
   hora antes de disparar, não depois. */
var MES_ABREV=['jan.','fev.','mar.','abr.','mai.','jun.','jul.','ago.','set.','out.','nov.','dez.'];
var CARIMBO_FAM='Arial, Helvetica, sans-serif';

function textoCarimbo(d){
  d=d||new Date();
  var p=function(n){ return String(n).padStart(2,'0'); };
  return d.getDate()+' de '+MES_ABREV[d.getMonth()]+' de '+d.getFullYear()+
         ' '+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds());
}

/* Corpo da fonte e folga, proporcionais ao lado MENOR da foto — como o card:
   mesma presença em foto em pé ou deitada, e o texto cresce junto com a
   resolução (em 4K sai com ~82 px, aguenta zoom no relatório). O piso de
   16 px salva aparelho antigo. */
function corpoCarimbo(lado){ return Math.max(16, Math.round(lado*0.038)); }
function margemCarimbo(lado){ return Math.round(lado*0.02); }

/* Medida do bloco de texto para um dado corpo de fonte */
function medeCarimbo(ctx,size,txt){
  ctx.font='bold '+size+'px '+CARIMBO_FAM;
  return {w:ctx.measureText(txt).width, h:size*1.25};
}

/* Escreve o carimbo com o CENTRO do texto na origem (0,0) do contexto.
   Contorno primeiro, preenchimento por cima: o traço escuro fica só na borda
   das letras e não engrossa o branco. */
function escreveCarimbo(ctx,size,txt){
  ctx.font='bold '+size+'px '+CARIMBO_FAM;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineJoin='round'; ctx.lineWidth=Math.max(2, size*0.17);
  ctx.strokeStyle='rgba(0,0,0,.7)';
  ctx.strokeText(txt,0,0);
  ctx.fillStyle='#fff';
  ctx.fillText(txt,0,0);
}

/* Grava o carimbo na foto, no canto inferior direito */
function desenhaCarimbo(ctx,vw,vh,ang,data){
  var lado=Math.min(vw,vh);
  /* "data" só vem na foto importada da galeria: ali o carimbo tem de mostrar
     quando a foto foi TIRADA, não a hora em que ela foi carregada no app. */
  var size=corpoCarimbo(lado), mg=margemCarimbo(lado), txt=textoCarimbo(data);
  ctx.save();
  var m=medeCarimbo(ctx,size,txt);
  var deitado=(ang===90||ang===270);
  var bbW=deitado?m.h:m.w, bbH=deitado?m.w:m.h;   /* ocupado DEPOIS de girar */
  ctx.translate(vw-mg-bbW/2, vh-mg-bbH/2);
  ctx.rotate(-ang*Math.PI/180);
  escreveCarimbo(ctx,size,txt);
  ctx.restore();
}

/* ─── Carimbo ao vivo na tela da câmera ───
   Mesmo canto, mesmo tamanho e mesmo giro que ele vai ter na foto: o tamanho
   em pixels da foto é convertido para pixels de tela pela escala do
   object-fit:cover do vídeo — a mesma conta do overlay do card. Assim o que
   se vê é o que grava.

   Fica ACIMA da barra dos botões (z-index) porque o degradê escuro dela
   apagaria o texto branco; e ocupa só a faixa de ~28 px do rodapé, abaixo do
   botão de virar a câmera, então não cobre nenhum lugar de toque. */
var tCarimboCam=null;

function pintaCarimboCam(){
  var wrap=document.getElementById('cam-stamp');
  var cv=document.getElementById('fc-stamp');
  if(!wrap||!cv) return;

  var video=document.getElementById('cam-video');
  var size, mg;
  if(video&&video.videoWidth){
    var cover=Math.max(window.innerWidth/video.videoWidth, window.innerHeight/video.videoHeight);
    var lado=Math.min(video.videoWidth,video.videoHeight);
    size=corpoCarimbo(lado)*cover;
    mg=margemCarimbo(lado)*cover;
  } else {
    /* antes de o vídeo abrir: estima pela tela */
    var ladoTela=Math.min(window.innerWidth,window.innerHeight);
    size=corpoCarimbo(ladoTela); mg=margemCarimbo(ladoTela);
  }

  var txt=textoCarimbo();
  var ctx=cv.getContext('2d');
  var m=medeCarimbo(ctx,size,txt);

  var ang=anguloOrientacao();
  var deitado=(ang===90||ang===270);

  /* Teto de tela. Ao girar o celular, alguns aparelhos demoram para a câmera
     renegociar a orientação — nesse intervalo o vídeo ainda vem em pé, a
     escala do cover dispara e o texto girado sairia mais comprido que a tela.
     O encolhimento vale SÓ para a pré-visualização: na foto o carimbo é
     gravado no tamanho cheio, onde sempre cabe (o texto mede ~50% do lado
     menor e é deitado ao longo do lado maior). Mesma ideia do teto de 70% que
     o overlay do card já usa. */
  var cabe=(deitado?window.innerHeight:window.innerWidth)-2*mg;
  if(m.w>cabe && cabe>0){
    size*=cabe/m.w;
    m=medeCarimbo(ctx,size,txt);
  }

  /* folga em volta para o contorno das letras não ser cortado pela borda do
     canvas — é simétrica, então o centro do canvas segue sendo o do texto */
  var pad=Math.ceil(size*0.4);
  var w=Math.ceil(m.w)+2*pad, h=Math.ceil(m.h)+2*pad;

  cv.width=Math.ceil(w*SS); cv.height=Math.ceil(h*SS);
  cv.style.width=w+'px'; cv.style.height=h+'px';
  ctx.setTransform(SS,0,0,SS,0,0);
  ctx.clearRect(0,0,w,h);
  ctx.translate(w/2,h/2);
  escreveCarimbo(ctx,size,txt);
  ctx.setTransform(1,0,0,1,0,0);

  /* Posição pelo bloco de TEXTO (sem a folga), senão o carimbo sairia do canto
     deslocado do tanto do pad. O giro é em torno do centro do elemento, que
     coincide com o centro do texto. */
  var bbW=deitado?m.h:m.w, bbH=deitado?m.w:m.h;
  var cx=window.innerWidth -mg-bbW/2;
  var cy=window.innerHeight-mg-bbH/2;
  wrap.style.transform='translate('+(cx-w/2)+'px,'+(cy-h/2)+'px) rotate('+(-ang)+'deg)';
}

/* O relógio anda: repinta a cada segundo enquanto a câmera estiver aberta */
function ligaCarimboCam(){
  pintaCarimboCam();
  clearInterval(tCarimboCam);
  tCarimboCam=setInterval(pintaCarimboCam,1000);
}
function desligaCarimboCam(){ clearInterval(tCarimboCam); tCarimboCam=null; }

/* ─── Captura foto + overlay ─── */
async function capturePhoto(){
  var video=document.getElementById('cam-video');
  if(!video.videoWidth){toast('Câmera não iniciada');return}

  // Flash visual
  var flash=document.getElementById('cam-flash');
  flash.style.opacity='1';
  setTimeout(function(){flash.style.opacity='0'},150);

  // Canvas com frame da câmera
  var vw=video.videoWidth, vh=video.videoHeight;
  var main=document.createElement('canvas');
  main.width=vw; main.height=vh;
  var ctx=main.getContext('2d');
  if(facingMode==='user'){ctx.save();ctx.scale(-1,1);ctx.drawImage(video,-vw,0,vw,vh);ctx.restore()}
  else{ctx.drawImage(video,0,0,vw,vh)}

  // Card VETORIZADO direto no tamanho final: o texto é rasterizado só agora,
  // já com os pixels da foto, então sai nítido em qualquer resolução.
  // Dimensões do fotocard de referência de campo: 38% do lado MENOR da foto
  // (fica com a mesma presença em foto em pé ou deitada) e 1% de folga até o
  // canto. Opacidade FC.OPACITY (0,85).
  try{
    var lado=Math.min(vw,vh);
    var mg=Math.round(lado*FC.MARGIN);
    var cw=FC.larguraNaFoto(lado);
    var cardCv=FC.toCanvas(curState, cw/FC.W, FC.OPACITY);
    cw=cardCv.width;
    var ch=cardCv.height;

    // Posição: a mesma fração do espaço livre que o técnico deixou na tela
    // (posX/posY) — canto na tela = canto na foto. O card sai GIRADO junto com
    // o celular, no mesmo ângulo que aparece no overlay da câmera.
    var angCard=anguloOrientacao();
    var cardDeitado=(angCard===90||angCard===270);
    var bbW=cardDeitado?ch:cw, bbH=cardDeitado?cw:ch;
    var livreW=Math.max(0, vw-2*mg-bbW), livreH=Math.max(0, vh-2*mg-bbH);
    ctx.save();
    ctx.translate(mg+posX*livreW+bbW/2, mg+posY*livreH+bbH/2);  // centro do card já girado
    ctx.rotate(-angCard*Math.PI/180);
    ctx.drawImage(cardCv, -cw/2, -ch/2, cw, ch);
    ctx.restore();

    // Carimbo de data/hora no rodapé, como nas câmeras de campo
    desenhaCarimbo(ctx, vw, vh, angCard);

    // Nome do arquivo. Com o Pitch fora, quem identifica a pá é o N/S — que é
    // o número da própria pá, não da posição no rotor. Pedaço vazio some do
    // nome (nada de "EW_Parque__Etapa.jpg").
    var s=curState;
    var fname='EW_'+partesNome([s.parque,s.turbina,s.ns,s.etapa])+'_'+carimboArquivo()+'.jpg';

    /* Nada é gravado nem enviado aqui: a foto vai para a tela de revisão e só
       segue depois do "Usar esta foto". Antes ela ia direto, e foto tremida ou
       com o card em cima do dano só era descoberta no relatório. */
    main.toBlob(function(blob){
      if(!blob){toast('Erro ao gerar imagem');return}
      revisarFoto(blob, fname, s, 'camera');
    },'image/jpeg',0.92);   /* 0,92 em 4K = arquivo ~3× menor que 1,0, sem
                               diferença visível nem no texto do card */

  }catch(e){
    toast('Erro: '+e.message);
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   REVISÃO — a foto é conferida antes de virar arquivo
   ───────────────────────────────────────────────────────────────────────────
   Nada é gravado no celular nem enviado ao Dropbox enquanto o técnico não
   aprovar. Antes a foto ia direto: tremida, desenquadrada ou com o card em
   cima do dano, o problema só aparecia no relatório, com a equipe já fora da
   pá. Agora dá para refazer na hora.
   ═══════════════════════════════════════════════════════════════════════════ */
var revBlob=null, revNome='', revEstado=null, revOrigem='camera', revUrl='';

function revisarFoto(blob, fname, estado, origem){
  revBlob=blob; revNome=fname; revEstado=estado; revOrigem=origem||'camera';
  if(revUrl) URL.revokeObjectURL(revUrl);
  revUrl=URL.createObjectURL(blob);

  document.getElementById('rev-img').src=revUrl;
  var kb=Math.round(blob.size/1024);
  document.getElementById('rev-info').textContent =
    (origem==='galeria' ? 'Foto da galeria · ' : 'Foto tirada agora · ')
    + (kb>1024 ? (kb/1024).toFixed(1)+' MB' : kb+' KB');
  document.getElementById('rev-btn-refaz').textContent =
    (origem==='galeria' ? '↺  Escolher outra' : '↺  Refazer');
  habilitaRevisao(true);
  document.getElementById('rev-view').classList.add('on');
}

function habilitaRevisao(ok){
  document.getElementById('rev-btn-usa').disabled=!ok;
  document.getElementById('rev-btn-refaz').disabled=!ok;
}

function fechaRevisao(){
  document.getElementById('rev-view').classList.remove('on');
  if(revUrl){ URL.revokeObjectURL(revUrl); revUrl=''; }
  document.getElementById('rev-img').removeAttribute('src');
  revBlob=null; revEstado=null;
}

/* Descarta e volta para onde a foto veio */
function refazerFoto(){
  var origem=revOrigem;
  fechaRevisao();
  if(origem==='galeria'){ abrirGaleria(); }
  else if(!document.getElementById('cam-view').classList.contains('on')){ openCamera(); }
  /* vindo da câmera, ela continua aberta atrás — é só voltar a mirar */
}

/* Só aqui a foto vira arquivo no celular e entra na fila do Dropbox */
function aprovarFoto(){
  if(!revBlob) return;
  var blob=revBlob, fname=revNome, est=revEstado;
  habilitaRevisao(false);
  dicaGaleria();
  salvarBlob(blob,fname,'image/jpeg',function(ok,via){
    toast(ok ? (via==='galeria' ? '✓ Foto salva na galeria' : '✓ Foto salva em Downloads')
             : '⚠ FOTO NÃO SALVA — toque em Usar de novo', ok?2500:5000);
  });
  enviarDropbox(blob,fname,est);
  fechaRevisao();
}

/* ═══ CARREGAR FOTO DA GALERIA ═══
   Para a foto que já foi tirada pela câmera do celular: recebe o mesmo card e
   o mesmo carimbo, e segue pelo mesmo caminho de revisão e envio.
   O carimbo e a Data do card usam o RELÓGIO DO CELULAR no instante em que a
   foto é escolhida — não a data de criação do arquivo. */
function abrirGaleria(){
  if(!exigePreenchimento('carregar uma foto')) return;
  var inp=document.getElementById('f-galeria');
  inp.value='';           /* permite escolher o mesmo arquivo de novo */
  inp.click();
}

async function importarDaGaleria(input){
  var file=input.files && input.files[0];
  if(!file) return;
  var st=document.getElementById('st');
  st.textContent='Montando a foto...'; st.className='status';

  try{
    /* imageOrientation from-image: respeita o EXIF, senão foto em pé vem deitada */
    var bmp;
    try{ bmp=await createImageBitmap(file,{imageOrientation:'from-image'}); }
    catch(e){ bmp=await createImageBitmap(file); }

    var vw=bmp.width, vh=bmp.height;
    var main=document.createElement('canvas');
    main.width=vw; main.height=vh;
    var ctx=main.getContext('2d');
    ctx.drawImage(bmp,0,0,vw,vh);

    /* Data e hora do RELÓGIO DO CELULAR, no momento em que a foto é escolhida.
       Não é a data do arquivo nem hora de servidor: é exatamente o que o
       aparelho está marcando agora — o mesmo new Date() que a câmera do app já
       usa, então foto tirada no app e foto trazida da galeria carimbam do mesmo
       jeito. Vale para o carimbo do rodapé e para a Data do card. */
    var d=new Date();
    var p2=function(n){ return n<10?'0'+n:''+n; };
    var estado=Object.assign({},curState,{data:p2(d.getDate())+'/'+p2(d.getMonth()+1)+'/'+d.getFullYear()});

    /* Card sem giro: a foto já vem na orientação final, não há tela girando */
    var lado=Math.min(vw,vh);
    var mg=Math.round(lado*FC.MARGIN);
    var cw=FC.larguraNaFoto(lado);
    var cardCv=FC.toCanvas(estado, cw/FC.W, FC.OPACITY);
    cw=cardCv.width;
    var ch=cardCv.height;
    var livreW=Math.max(0,vw-2*mg-cw), livreH=Math.max(0,vh-2*mg-ch);
    ctx.drawImage(cardCv, mg+posX*livreW, mg+posY*livreH, cw, ch);

    desenhaCarimbo(ctx, vw, vh, 0, d);

    var fname='EW_'+partesNome([estado.parque,estado.turbina,estado.ns,estado.etapa])
             +'_'+carimboArquivo()+'.jpg';
    main.toBlob(function(blob){
      st.textContent=''; st.className='status';
      if(!blob){ toast('Não consegui montar a foto'); return; }
      revisarFoto(blob, fname, estado, 'galeria');
    },'image/jpeg',0.92);

  }catch(e){
    st.textContent='Erro ao ler a foto: '+e.message; st.className='status er';
  }
}

/* ─── Salvar card sem câmera ───
   Aqui o card é o próprio arquivo (não vai sobre foto nenhuma), então sai
   OPACO em 4× — vetor rasterizado a 1840 px de largura, aguenta zoom e
   impressão. A opacidade de 0,85 vale só para o card sobre a foto. */
function saveCardOnly(){
  if(!exigePreenchimento('salvar o fotocard')) return;
  var st=document.getElementById('st');
  st.textContent='Gerando...';st.className='status';
  try{
    var canvas=FC.toCanvas(curState,4,1);
    var s=curState;
    var fname='EW_card_'+partesNome([s.parque,s.turbina,s.ns])+'_'+carimboArquivo()+'.png';
    canvas.toBlob(function(blob){
      salvarBlob(blob,fname,'image/png',function(ok,via){
        st.textContent = ok ? (via==='galeria' ? '✓ Salvo na galeria' : '✓ Salvo em Downloads')
                            : '⚠ Não salvou — tente de novo';
        st.className = 'status ' + (ok ? 'ok' : 'er');
      });
      enviarDropbox(blob,fname,s);
    },'image/png');
  }catch(e){
    st.textContent='Erro: '+e.message;st.className='status er';
  }
}

/* ═══ SALVAR NO PRÓPRIO CELULAR ═══
   Regra de campo: TODA foto tem de ficar gravada no aparelho — mesmo se o
   Dropbox falhar, mesmo sem internet.

   Antes o app abria a folha de compartilhamento e só baixava se ela falhasse.
   Isso tinha um buraco: quem apertava "cancelar" na folha ficava SEM cópia
   nenhuma — a foto sumia. Agora a gravação vem primeiro e sempre acontece.

   Android: o download cai direto na pasta Downloads, sem perguntar, e a
   galeria indexa essa pasta. iPhone: o download vai para o app Arquivos, e por
   isso lá a folha de compartilhamento continua sendo oferecida — é o
   "Salvar Imagem" dela que põe a foto no rolo da câmera. */
function podeCompartilharArquivo(blob,fname,type){
  try{
    if(!navigator.canShare || !navigator.share) return null;
    var file = new File([blob],fname,{type:type});
    return navigator.canShare({files:[file]}) ? file : null;
  }catch(e){ return null; }
}

/* Onde a foto vai parar — o que dá e o que NÃO dá para fazer aqui:

   Um site não consegue gravar direto em DCIM/Camera. Não existe API para isso
   em navegador nenhum, por segurança. Os dois caminhos possíveis são:

     • folha de compartilhamento → você toca em "Fotos"/"Galeria" e é o próprio
       app do sistema que grava a imagem JUNTO com as fotos da câmera. É o
       único jeito de a foto cair no rolo. O Android LEMBRA do app escolhido,
       então da segunda vez é um toque no mesmo ícone.
     • download → cai na pasta Downloads. Aparece na galeria, mas num álbum
       separado ("Pastas do dispositivo → Download").

   Por isso a folha vem primeiro. Se for cancelada, o download entra como rede
   de proteção: assim nunca se perde uma foto — que era o furo da versão
   anterior, onde cancelar deixava o registro sem cópia nenhuma. */
function salvarBlob(blob,fname,type,cb){
  var file = podeCompartilharArquivo(blob,fname,type);

  if(file){
    /* Só o arquivo, sem título nem texto: assim o Android oferece os apps de
       imagem no topo (Fotos, Galeria) em vez dos de mensagem. */
    navigator.share({files:[file]})
      .then(function(){ if(cb) cb(true,'galeria'); })
      .catch(function(){
        var g = downloadBlob(blob,fname);      /* cancelou: garante a cópia */
        if(cb) cb(g, g ? 'download' : 'falhou');
      });
    return;
  }
  var g = downloadBlob(blob,fname);
  if(cb) cb(g, g ? 'download' : 'falhou');
}

/* Dica mostrada só na primeira foto do aparelho: é o que ensina a escolher
   "Fotos" para a imagem ficar junto com as da câmera. */
function dicaGaleria(){
  try{
    if(localStorage.getItem('ew_dica_galeria')) return;
    localStorage.setItem('ew_dica_galeria','1');
  }catch(e){}
  setTimeout(function(){
    toast('Escolha "Fotos" para a imagem ficar junto com as da câmera — o celular lembra da escolha', 5000);
  }, 2600);
}

/* true se conseguiu disparar a gravação no aparelho */
function downloadBlob(blob,fname){
  try{
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download=fname; a.rel='noopener';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(url)},1500);
    return true;
  }catch(e){
    return false;
  }
}

/* ═══ DROPBOX (via Cloudflare Worker) ═══
   NÃO existe segredo aqui, e não existe nada para configurar no aparelho.

   Por que não dá para "embutir o token de forma que não seja identificado":
   este arquivo é servido para o navegador e está público no GitHub Pages.
   Qualquer chave escrita aqui aparece em "ver código-fonte", no DevTools, na
   aba Network, no cache do Service Worker e no próprio repositório. Ofuscar
   (base64, XOR, string picada) só esconde de quem olha de passagem.

   A solução foi tirar a necessidade do segredo: o Worker aceita chamada
   somente da origem do app (checagem de Origin no servidor), só escreve, e é
   ele que guarda as credenciais do Dropbox. Assim não há chave para roubar —
   nem no código, nem no aparelho.

   O endereço abaixo não é segredo: é um endpoint público de escrita. */
var DBX_API='https://ew-dropbox-proxy.ew-fotos.workers.dev';

/* ─────────────────────────────────────────────────────────────────────────
   TOKEN — deixe VAZIO se você já atualizou o Worker (ew-dropbox-proxy/worker.js).
   Nesse caso não existe segredo nenhum: quem autoriza é a origem da requisição.
   ESTA É A OPÇÃO RECOMENDADA.

   Se preferir NÃO mexer no Worker agora, cole aqui o APP_TOKEN que hoje é
   digitado na tela. O app passa a funcionar na hora, e ninguém em campo
   configura nada — mas entenda o que muda:

     • este arquivo é público no GitHub Pages, então o token colado aqui fica
       visível em "ver código-fonte", no DevTools e no histórico do Git;
     • o Worker também confere a origem da chamada, então um navegador de
       terceiro continua barrado; um curl com Origin forjado, não;
     • o pior caso é alguém subir arquivo na pasta de fotos. Não dá para ler,
       listar nem apagar, e não se chega à conta do Dropbox.

   Ou seja: colar o token aqui é uma decisão de conveniência com risco
   limitado — não é "esconder" o token, é publicá-lo assumindo esse risco. */
var DBX_TOKEN='';
/* ───────────────────────────────────────────────────────────────────────── */

function dbxAtivo(){ return !!DBX_API; }

/* Limpa resquício das versões antigas: até a v16 a URL e o APP_TOKEN ficavam
   em localStorage, em texto puro, num origin (usuario.github.io) compartilhado
   por todos os projetos GitHub Pages da conta. Sai do aparelho agora. */
function initDbx(){
  try{ localStorage.removeItem('ew_dbx_url'); localStorage.removeItem('ew_dbx_token'); }catch(e){}
  atualizaFilaBadge();
}

function limpaSeg(v,max){
  return (v||'').trim()
    .replace(/[\\/:*?"<>|]+/g,'-')      /* proibidos no Dropbox */
    .replace(/[\x00-\x1f\x7f]/g,'')     /* caracteres de controle */
    .replace(/\s+/g,' ')
    .replace(/^\.+$/,'')                /* "." e ".." não viram pasta */
    .substring(0,max||60);
}
function dbxPath(state,fname){
  var partes=[limpaSeg(state.cliente),limpaSeg(state.parque),limpaSeg(state.turbina)].filter(Boolean);
  return '/'+(partes.length?partes.join('/')+'/':'')+limpaSeg(fname,80);
}
function notify(msg,tipo){
  var cam=document.getElementById('cam-view');
  if(cam&&cam.classList.contains('on')){ toast(msg); }
  else { var st=document.getElementById('st'); if(st){ st.textContent=msg; st.className='status'+(tipo?' '+tipo:''); } }
}
/* ── Fila offline (IndexedDB): guarda a foto e envia quando houver internet ── */
var DBX_DB='ew_dbx_fila', DBX_STORE='fila';
function idb(){
  return new Promise(function(res,rej){
    var r=indexedDB.open(DBX_DB,1);
    r.onupgradeneeded=function(){ if(!r.result.objectStoreNames.contains(DBX_STORE)) r.result.createObjectStore(DBX_STORE,{keyPath:'id'}); };
    r.onsuccess=function(){res(r.result)}; r.onerror=function(){rej(r.error)};
  });
}
function filaAdd(item){ return idb().then(function(db){ return new Promise(function(res,rej){
  var tx=db.transaction(DBX_STORE,'readwrite'); tx.objectStore(DBX_STORE).put(item);
  tx.oncomplete=function(){res()}; tx.onerror=function(){rej(tx.error)}; }); }); }
function filaAll(){ return idb().then(function(db){ return new Promise(function(res,rej){
  var out=[]; var tx=db.transaction(DBX_STORE,'readonly'); var cur=tx.objectStore(DBX_STORE).openCursor();
  cur.onsuccess=function(e){ var c=e.target.result; if(c){ out.push(c.value); c.continue(); } else res(out); };
  cur.onerror=function(){rej(cur.error)}; }); }); }
function filaDel(id){ return idb().then(function(db){ return new Promise(function(res){
  var tx=db.transaction(DBX_STORE,'readwrite'); tx.objectStore(DBX_STORE).delete(id);
  tx.oncomplete=function(){res()}; tx.onerror=function(){res()}; }); }); }
function filaCount(){ return filaAll().then(function(a){return a.length;}).catch(function(){return 0;}); }

function atualizaFilaBadge(){
  var s=document.getElementById('dbx-state'); if(!s) return;
  if(!dbxAtivo()){ s.textContent='☁️ Dropbox desligado'; return; }
  filaCount().then(function(n){
    s.textContent = n>0 ? ('☁️ '+n+' foto(s) na fila para o Dropbox') : '☁️ Dropbox ligado';
  });
}

/* Chamado a cada foto salva: PERSISTE primeiro (nada se perde), depois tenta enviar. */
function enviarDropbox(blob,fname,state){
  if(!dbxAtivo()) return;
  var item={ id:(Date.now()+'-'+Math.round(Math.random()*1e9)), path:dbxPath(state,fname),
    fname:fname, type:(blob&&blob.type)||'application/octet-stream', blob:blob, ts:Date.now() };
  filaAdd(item)
    .then(function(){ atualizaFilaBadge();
      if(navigator.onLine){ notify('☁️ Enviando ao Dropbox...',''); flushFila(); }
      else notify('☁️ Sem internet — na fila, envia depois',''); })
    .catch(function(){ /* IndexedDB indisponível: tenta envio direto */ uploadUm(item)
      .then(function(res){ notify(res.ok?('☁️✓ Salva: '+res.path):('☁️✗ Falha no envio ('+res.motivo+')'), res.ok?'ok':'er'); }); });
}

function uploadUm(it){
  /* Sem DBX_TOKEN, quem autoriza é o Worker pela origem da requisição.
     Com DBX_TOKEN preenchido, funciona também com o Worker antigo. */
  var h={'X-EW-Path':encodeURIComponent(it.path),'Content-Type':'application/octet-stream'};
  if(DBX_TOKEN) h['X-EW-Token']=DBX_TOKEN;
  return fetch(DBX_API+'/upload',{ method:'POST', headers:h, body:it.blob })
    .then(function(r){
      return r.json().catch(function(){return{};}).then(function(j){
        if(r.ok) return {ok:true, path:j.path_display};
        /* Diagnóstico útil em campo: 401/403 quase sempre é Worker
           desatualizado (ainda exigindo token) ou origem fora da lista. */
        if(r.status===401||r.status===403){
          return {ok:false, motivo:'Worker recusou — atualize o worker.js ou preencha DBX_TOKEN'};
        }
        return {ok:false, motivo:'HTTP '+r.status+(j.error?(' — '+j.error):'')};
      });
    })
    .catch(function(e){ return {ok:false, motivo:(navigator.onLine?('erro de rede: '+e.message):'sem internet')}; });
}

var flushing=false;
function flushFila(){
  if(flushing || !dbxAtivo() || !navigator.onLine){ atualizaFilaBadge(); return; }
  flushing=true;
  filaAll().then(function(items){
    var seq=Promise.resolve(), enviados=0, ultimoErro=null, ultimoPath=null;
    items.forEach(function(it){
      seq=seq.then(function(){ return uploadUm(it).then(function(res){
        if(res.ok){ enviados++; ultimoPath=res.path; return filaDel(it.id); }
        ultimoErro=res.motivo; throw new Error('parar'); /* falhou: para e mantém o resto na fila */
      }); });
    });
    return seq.then(function(){ return {enviados:enviados, erro:null, path:ultimoPath}; })
      .catch(function(){ return {enviados:enviados, erro:ultimoErro||'falha desconhecida'}; });
  })
  .then(function(res){
    flushing=false; atualizaFilaBadge();
    if(res.enviados>0) notify('☁️✓ '+res.enviados+' foto(s) no Dropbox'+(res.path?(' — '+res.path):''),'ok');
    else if(res.erro) notify('☁️✗ Falha no envio ('+res.erro+') — foto na fila','er');
  })
  .catch(function(e){ flushing=false; atualizaFilaBadge(); notify('☁️✗ Falha no envio ('+e.message+') — foto na fila','er'); });
}
/* Reenvia sozinho quando a internet volta */
window.addEventListener('online', flushFila);

/* ─── Init ─── */
/* Recupera tamanho e posição de card escolhidos antes neste aparelho */
(function(){
  try{
    var f=parseFloat(localStorage.getItem(CARD_FRAC_KEY));
    if(isFinite(f)) FC.setFrac(f,true);
    var p=(localStorage.getItem(CARD_POS_KEY)||'').split(',');
    var x=parseFloat(p[0]), y=parseFloat(p[1]);
    if(isFinite(x)&&isFinite(y)){
      posX=Math.min(1,Math.max(0,x));
      posY=Math.min(1,Math.max(0,y));
    }
  }catch(e){}
  mostraTamanho();
  ligarGestos();
})();
/* Antes do render: repõe os campos gravados e trava os que vieram preenchidos,
   senão o card sairia em branco na primeira pintura. */
memInit();
render();
initDbx();
flushFila();
window.addEventListener('resize',function(){
  /* Zoom da página muda o devicePixelRatio: redesenha o card na nova
     densidade em vez de só reescalar o bitmap antigo (que ficaria borrado). */
  var dpr=window.devicePixelRatio||1;
  if(dpr!==lastDPR){ lastDPR=dpr; SS=ssTela(); render(); }
  else updateScale();
  if(document.getElementById('cam-view').classList.contains('on')){
    scaleCamOverlay();
    pintaCarimboCam();
  }
});
</script>
</body>
