  table{width:100%;border-collapse:collapse;font-size:14px;min-width:420px}
  th{background:#F2F4F3;border:1px solid var(--linha);padding:7px;text-align:left;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-2)}
  td{border:1px solid var(--linha);padding:0}
  td input{width:100%;border:0;padding:9px 7px;background:transparent}

  td.acao{width:38px;text-align:center}

  .rodape{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--linha);
    padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:center}
  .enviar{background:var(--aco);color:#fff;border:1px solid var(--aco);border-radius:2px;
    padding:13px 22px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;flex:1;max-width:420px}

  .enviar:disabled{opacity:.6}
  .msg{max-width:720px;margin:0 auto 12px;padding:11px 13px;border-radius:2px;font-size:14px;display:none}
  .msg.mostrar{display:block}
  .msg.ruim{background:#FFF1EC;border:1px solid #F3C4AF;color:#7C2D12}
  .msg.bom{background:#EDF7F2;border:1px solid #A8D5C2;color:#0F6E4F}
  .msg.aviso{background:#FFF8ED;border:1px solid #F0D9B5;color:#7A4A0B}
  .pessoa-cx{position:relative}
  .pessoa-linha{display:flex;gap:8px}
  .pessoa-linha .nome{flex:1}
  .pessoa-linha .mat{flex:0 0 110px;background:#F2F4F3;text-align:center;font-family:var(--mono);font-size:14px}
  .sugestoes{position:absolute;left:0;right:0;top:100%;z-index:20;background:#fff;border:1px solid var(--linha);
    border-top:0;border-radius:0 0 2px 2px;max-height:230px;overflow:auto;display:none}
  .sugestoes.aberta{display:block}
  .sugestoes button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--linha);
    background:#fff;padding:11px 10px;font-size:15px}
  .sugestoes button:hover,.sugestoes button:focus{background:#EDF3F8}
  .sugestoes .mt{font-family:var(--mono);font-size:11px;color:var(--tinta-2);margin-left:6px}
  .sugestoes .nada{padding:11px 10px;font-size:14px;color:var(--tinta-2)}
  .correcao{background:#FFF8ED;border:1px solid #F0D9B5;border-radius:2px;padding:12px;margin-bottom:12px;font-size:14px}
  .correcao-linha{display:flex;gap:8px;margin-top:9px}
  .correcao-linha input{flex:1;padding:10px;border:1px solid var(--linha);border-radius:2px;
    font-family:var(--mono);text-transform:uppercase}
  .rascunho{background:#EDF3F8;border:1px solid #B9D2E6;border-radius:2px;padding:12px;margin-bottom:12px;font-size:14px}
  .rascunho-bts{display:flex;gap:8px;margin-top:10px}
  .rascunho-bts .btn{flex:1}
  .fim{background:#fff;border:1px solid var(--linha);border-radius:2px;padding:30px 20px;text-align:center}
  .fim-selo{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    background:#0F6E4F;color:#fff;padding:5px 12px;border-radius:2px;margin-bottom:14px}
  .fim h2{margin:0 0 6px;font-size:18px}
  .fim p{margin:0 0 6px;color:var(--tinta-2);font-size:14px}
  .fim-prot{font-family:var(--mono);font-size:12px;margin-bottom:18px !important}
  .fim-lista{border:1px solid var(--linha);border-radius:2px;margin:14px 0;text-align:left}
  .fim-item{display:flex;justify-content:space-between;gap:12px;padding:9px 11px;border-bottom:1px solid var(--linha);font-size:14px}
  .fim-item:last-child{border-bottom:0}
  .fim-item span{color:var(--tinta-2);font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
    text-transform:uppercase;align-self:center}
  .fim-item b{text-align:right}
  .lupa{position:fixed;inset:0;background:rgba(26,35,41,.9);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
  .lupa.aberta{display:flex}
  .lupa img{max-width:100%;max-height:100%}
  .escolha{position:fixed;inset:0;background:rgba(26,35,41,.55);display:none;z-index:60;
    align-items:flex-end;justify-content:center}
  .escolha.aberta{display:flex}

  .escolha-bt:hover{border-color:var(--aco);color:var(--aco)}
  .escolha-bt.cancelar{margin-bottom:0;color:var(--tinta-2);border-style:dashed}

  .fcaj{position:fixed;inset:0;z-index:70;background:#0d1117;color:#fff;display:none;flex-direction:column;align-items:center}

  .fcaj-palco{position:relative;flex:0 0 auto;touch-action:none;margin:4px 0;overflow:hidden}

  .fcaj-bts{display:flex;gap:8px;width:100%;max-width:560px;margin-top:auto;

  .fcaj-bt{flex:1;padding:13px 4px;border:1px solid #3a4652;background:#161b22;color:#fff;border-radius:2px;

  #fcAjVideo{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:fill;display:none;background:#000}

  .fcaj.cam #fcAjFoto,.fcaj.cam [data-fc="usar"],.fcaj:not(.cam) [data-fc="capturar"]{display:none}
  .fcaj-flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
  .fcaj-flash.on{opacity:.8;transition:none}
</style>

/* Decodifica a foto SEM transformar o arquivo inteiro numa string base64.
   Uma foto de 12 MP vira ~5,5 MB de texto no readAsDataURL e mais ~48 MB de
   bitmap preso no objeto Image — era isso que estourava a memoria do celular
   depois de algumas fotos. createImageBitmap devolve um bitmap que o navegador
   guarda fora do JS e que a gente fecha na hora; o objectURL e revogado. */
async function decodificar(file){
  if(typeof createImageBitmap === 'function'){
    try{
      return {img: await createImageBitmap(file, {imageOrientation:'from-image'}), bitmap:true};
    }catch(e){ /* cai para o modo antigo */ }
  }
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((ok, err)=>{
      const im = new Image();
      im.onload = ()=> ok(im);
      im.onerror = ()=> err(new Error('imagem invalida'));
      im.src = url;
    });
    return {img: img, bitmap:false, url: url};
  }catch(e){ URL.revokeObjectURL(url); throw e; }
}

function comprimir(file, maxLado, qual){
  return new Promise((ok, err)=>{
    decodificar(file).then(function(d){
      const img = d.img;
      try{
        let w = img.width, h = img.height;
        const f = Math.min(1, maxLado/Math.max(w,h));
        w = Math.round(w*f); h = Math.round(h*f);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const cx = c.getContext('2d');
        cx.fillStyle = '#fff'; cx.fillRect(0,0,w,h);
        cx.drawImage(img,0,0,w,h);
        // Miniatura pequena para a grade: sem isso o navegador decodifica a
        // imagem inteira só para mostrar num quadrado de 96 px.
        const fm = Math.min(1, 240/Math.max(w,h));
        const cm = document.createElement('canvas');
        cm.width = Math.round(w*fm); cm.height = Math.round(h*fm);
        const cxm = cm.getContext('2d');
        cxm.fillStyle = '#fff'; cxm.fillRect(0,0,cm.width,cm.height);
        cxm.drawImage(img, 0, 0, cm.width, cm.height);
        const mini = cm.toDataURL('image/jpeg', 0.6);
        // Blob em vez de dataURL: não vira string gigante presa na memória.
        c.toBlob(function(blob){
          c.width = c.height = 1;      // libera o canvas grande na hora
          cm.width = cm.height = 1;
          if(d.bitmap) img.close();    // devolve a memoria do bitmap agora
          else URL.revokeObjectURL(d.url);
          if(!blob) return err(new Error('falha ao comprimir'));
          ok({blob: blob, w: w, h: h, mini: mini});
        }, 'image/jpeg', qual);
      }catch(e){
        if(d.bitmap) img.close(); else URL.revokeObjectURL(d.url);
        err(e);
      }
    }).catch(err);
  });
}

const cxEscolha = $('#escolha');

function abrirEscolha(inpCam, inpGal, aoVivo){
  destinoEscolha = {cam: inpCam, gal: inpGal, aoVivo: aoVivo};
  cxEscolha.classList.add('aberta');

function fecharEscolha(){
  cxEscolha.classList.remove('aberta');
  destinoEscolha = null;
}
cxEscolha.addEventListener('click', function(ev){
  if(ev.target === cxEscolha){ fecharEscolha(); return; }

  if(!op) return;
  const alvo = destinoEscolha;
  fecharEscolha();
  if(!alvo || op === 'cancelar') return;
  if(op === 'aovivo'){ if(alvo.aoVivo) alvo.aoVivo(); return; }
  (op === 'camera' ? alvo.cam : alvo.gal).click();
});

/* ---------------- rascunho automático ----------------
   Se a aba for descartada por falta de memória, recarregada ou fechada sem querer,
   nada do que já foi preenchido se perde. Vale principalmente para as fotos. */
const CHAVE = 'rascunho:' + (SCHEMA.titulo || 'form');
let bancoOk = true;

function comBanco(fn){
  return new Promise(function(ok){
    if(!bancoOk || !window.indexedDB) return ok(null);
    let req;
    try{ req = indexedDB.open('formularios_ew', 2); }
    catch(e){ bancoOk = false; return ok(null); }
    req.onupgradeneeded = function(){
      if(!req.result.objectStoreNames.contains('estado')) req.result.createObjectStore('estado');
      if(!req.result.objectStoreNames.contains('fotos')) req.result.createObjectStore('fotos');
    };
    req.onerror = function(){ bancoOk = false; ok(null); };
    req.onsuccess = function(){
      try{ fn(req.result, ok); }
      catch(e){ bancoOk = false; ok(null); }
    };
  });
}

function salvarRascunho(){
  const estado = {quando: Date.now(), campos: {}};
  SCHEMA.campos.forEach(function(c, i){
    const v = ler(c, i);
    if(!vazioValor(v)) estado.campos[i] = v;
  });
  if(!Object.keys(estado.campos).length) return limparRascunho();
  return comBanco(function(bd, ok){
    const t = bd.transaction('estado', 'readwrite');
    t.objectStore('estado').put(estado, CHAVE);
    t.oncomplete = function(){ ok(true); };
    t.onerror = function(){ ok(null); };
  });
}

function lerRascunho(){
  return comBanco(function(bd, ok){
    const r = bd.transaction('estado', 'readonly').objectStore('estado').get(CHAVE);
    r.onsuccess = function(){ ok(r.result || null); };
    r.onerror = function(){ ok(null); };
  });
}

function limparRascunho(){
  return comBanco(function(bd, ok){
    const t = bd.transaction('estado', 'readwrite');
    t.objectStore('estado').delete(CHAVE);
    t.oncomplete = function(){ ok(true); };
    t.onerror = function(){ ok(null); };
  });
}

/* As fotos NÃO ficam na memória. Vão para o banco assim que são tiradas e
   só voltam, uma de cada vez, na hora de montar o PDF. */
function guardarBlob(chave, blob){
  return comBanco(function(bd, ok){
    const t = bd.transaction('fotos', 'readwrite');
    t.objectStore('fotos').put(blob, chave);
    t.oncomplete = function(){ ok(true); };
    t.onerror = function(){ ok(null); };
  });
}

function lerBlob(chave){
  return comBanco(function(bd, ok){
    const r = bd.transaction('fotos', 'readonly').objectStore('fotos').get(chave);
    r.onsuccess = function(){ ok(r.result || null); };
    r.onerror = function(){ ok(null); };
  });
}

function apagarBlobs(chaves){
  if(!chaves || !chaves.length) return Promise.resolve(null);
  return comBanco(function(bd, ok){
    const t = bd.transaction('fotos', 'readwrite');
    const st = t.objectStore('fotos');
    chaves.forEach(function(k){ if(k) st.delete(k); });
    t.oncomplete = function(){ ok(true); };
    t.onerror = function(){ ok(null); };
  });
}

function chavesDasFotos(){
  const l = [];
  Object.keys(fotos).forEach(function(i){
    (fotos[i] || []).forEach(function(f){ if(f && f.id) l.push(f.id); });
  });
  return l;
}

function blobParaDataURL(blob){
  return new Promise(function(ok, err){
    const fr = new FileReader();
    fr.onload = function(){ ok(fr.result); };
    fr.onerror = function(){ err(new Error('não consegui reabrir uma das fotos')); };
    fr.readAsDataURL(blob);
  });
}

async function dadosDaFoto(f){
  if(f.blob) return await blobParaDataURL(f.blob);
  const b = await lerBlob(f.id);
  if(!b) return null;
  return await blobParaDataURL(b);
}

function aplicarRascunho(estado){
  Object.keys(estado.campos || {}).forEach(function(k){
    const i = Number(k), c = SCHEMA.campos[i], v = estado.campos[k];
    if(!c) return;
    const n = document.getElementById('c' + i);
    if(!n) return;
    if(['texto','textao','numero','data','hora','select'].indexOf(c.tipo) >= 0){
      /* cliente e parque só entram se ainda estão na aba SUPERVISORES */
      if(c.tipo === 'select' && v && String(c.uid) !== '2' && String(c.uid) !== '51' &&
         !Array.prototype.some.call(n.options, function(o){ return o.value === v; })){
        n.appendChild(el('option', {value:v}, v));
      }
      n.value = v;
      if(String(c.uid) === '2' && window.ehsPreencherParques) window.ehsPreencherParques();
    }else if(c.tipo === 'radio' || c.tipo === 'checkbox'){
      const alvos = Array.isArray(v) ? v.map(String) : [String(v)];
      Array.prototype.forEach.call(n.querySelectorAll('input'), function(x){
        x.checked = alvos.indexOf(x.value) >= 0;
      });
    }else if(c.tipo === 'foto'){
      fotos[i] = v || [];
      const grade = n.querySelector('.fotos');
      if(grade) desenharFotos(i, grade);
    }else if(c.tipo === 'pessoa'){
      pessoas[i] = v;
      const cp = camposPessoa.filter(function(x){ return x.i === i; })[0];
      if(cp && v){ cp.inp.value = v.nome; cp.mat.value = v.matricula; }
    }else if(c.tipo === 'assinatura'){
      assinaturas[i] = v;
      const cv = n.querySelector('canvas');
      if(cv && v && v.d){
        const img = new Image();
        img.onload = function(){
          const cx = cv.getContext('2d');
          cx.setTransform(1,0,0,1,0,0);
          cx.drawImage(img, 0, 0, cv.width, cv.height);
        };
        img.src = v.d;
      }
    }else if(c.tipo === 'tabela'){
      const tb = n.querySelector('tbody');
      if(!tb) return;
      tb.innerHTML = '';
      (v || []).forEach(function(linha){
        novaLinha(tb, c);
        const inputs = tb.lastChild.querySelectorAll('input');
        linha.forEach(function(cel, k){ if(inputs[k]) inputs[k].value = cel; });
      });
      if(!(v || []).length) novaLinha(tb, c);
    }
  });
  atualizarCondicoes();
}

lerRascunho().then(function(estado){
  if(!estado || !estado.campos || !Object.keys(estado.campos).length) return;
  const min = Math.round((Date.now() - estado.quando) / 60000);
  const quando = min < 1 ? 'agora há pouco' : (min < 60 ? 'há ' + min + ' min' : 'há ' + Math.round(min/60) + ' h');
  const barra = el('div', {class:'rascunho'});
  barra.appendChild(el('span', null, 'Encontrei um preenchimento não enviado (' + quando + ').'));
  const btSim = el('button', {type:'button', class:'btn'}, 'Continuar');
  const btNao = el('button', {type:'button', class:'btn'}, 'Começar do zero');
  btSim.addEventListener('click', function(){
    aplicarRascunho(estado);
    if(window.ehsReaplicarProjeto) window.ehsReaplicarProjeto();   // projeto de hoje vale mais que o rascunho
    barra.remove();
  });
  btNao.addEventListener('click', function(){
    const antigas = [];
    Object.keys(estado.campos || {}).forEach(function(k){
      const v = estado.campos[k];
      if(Array.isArray(v)) v.forEach(function(f){ if(f && f.id) antigas.push(f.id); });
    });
    limparRascunho();
    apagarBlobs(antigas);
    barra.remove();
  });
  const linha = el('div', {class:'rascunho-bts'});
  linha.appendChild(btSim); linha.appendChild(btNao);
  barra.appendChild(linha);
  document.querySelector('.folha').insertBefore(barra, msg);
});

/* GET no backend do RDO; se o navegador barrar a leitura (CORS), vai por JSONP */
function ehsJsonp(url){
  return new Promise(function(ok){
    const cb = '__ehsCb' + Date.now() + Math.floor(Math.random()*1000);
    let pronto = false;
    window[cb] = function(j){ pronto = true; ok(j); try{ delete window[cb]; }catch(e){ window[cb] = null; } };
    const sc = document.createElement('script');
    sc.src = url + '&callback=' + cb;
    sc.onerror = function(){ if(!pronto) ok(null); };
    document.head.appendChild(sc);
    setTimeout(function(){ if(!pronto) ok(null); }, 20000);
  });
}
async function ehsGet(params){
  const base = (SCHEMA.destino || {}).url;
  if(!base) return null;
  const qs = Object.keys(params).map(function(k){ return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); }).join('&');
  const url = base + (base.indexOf('?') >= 0 ? '&' : '?') + qs;
  try{
    const r = await fetch(url, {method:'GET'});
    return JSON.parse(await r.text());
  }catch(e){
    return await ehsJsonp(url);
  }
}
function ehsSessao(){

async function carregarTecnicos(){
  if(!camposPessoa.length) return;
  const guardado = await lerEstado('tecnicos');

  const url = (SCHEMA.destino || {}).url;
  if(!url) return;
  const fresco = guardado && (Date.now() - guardado.quando) < 10*60*1000;
  if(fresco) return;

  try{
    // Backend do RDO: a lista sai da MINI MASTER, no formato {nome, mat}.
    const j = await ehsGet({lista:'tecnicos'});
    if(j && j.tecnicos) j.tecnicos = j.tecnicos.map(function(t){ return {n: t.nome, m: String(t.mat || '')}; })
      .filter(function(t){ return t.n && t.m; });
    const r = {status: j ? 200 : 0};
    if(j && j.ok && j.tecnicos && j.tecnicos.length){
      aplicarTecnicos(j.tecnicos);
      await guardarEstado('tecnicos', {quando: Date.now(), lista: j.tecnicos});
    }else if(!TECNICOS.length){

      let motivo;
      if(!j) motivo = 'Sem resposta do servidor (sem internet ou Apps Script fora do ar).';
      else if(j.erro) motivo = j.erro;
      else if(!j.tecnicos) motivo = 'O Apps Script publicado é de uma versão antiga e ainda não sabe listar técnicos. '
                                  + 'Publique uma nova versão do Codigo.gs.';
      else motivo = 'A planilha MINI MASTER abriu, mas não retornou nenhum técnico.';
      avisarListaVazia(motivo);

  }catch(e){
    console.error('lista de técnicos:', e);
    if(!TECNICOS.length) avisarListaVazia('Não consegui falar com o servidor (' + e.message + ').');
  }
}

    const inpGal = el('input', {type:'file', accept:'image/*', style:'display:none'});

    async function receber(inp){
      const arquivos = Array.from(inp.files || []);
      inp.value = '';
      for(const f of arquivos){
        try{
          // Fotocard + carimbo: a foto passa pela tela de ajuste antes de entrar.
          const montada = await EHSFC.montar(f, EHSFC.etapaDe(c));
          if(!montada) continue;               // cancelou na tela de ajuste
          await guardarFoto(montada);
        }catch(e){
          console.error(e);
          alerta('ruim', 'Não foi possível ler uma das imagens.');

      atualizarCondicoes();
      agendarRascunho();

    // Câmera ao vivo: as fotos já saem dela com o card e o carimbo gravados.
    async function aoVivo(){
      const blobs = await EHSFC.camera(EHSFC.etapaDe(c), !!c.varias);
      for(const b of blobs){

        catch(e){ console.error(e); alerta('ruim', 'Não foi possível guardar uma das fotos.'); }
      }
      atualizarCondicoes();

      const chave = 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
      const guardou = await guardarBlob(chave, r.blob);
      // Se o banco não estiver disponível, o blob fica em memória — ainda é
      // bem mais leve que a dataURL, mas aí o rascunho não protege.
      fotos[i].push({id: chave, w: r.w, h: r.h, mini: r.mini, blob: guardou ? null : r.blob,
                     fc: EHSFC.assinatura()});

    inpCam.addEventListener('change', ()=> receber(inpCam));

    const bt = el('button', {type:'button', class:'btn'}, 'Adicionar foto');

    w.appendChild(inpCam); w.appendChild(inpGal); w.appendChild(bt); w.appendChild(grade);

      inp.value = t.n; mat.value = t.m;
      fechar(); atualizarCondicoes(); agendarRascunho();
    }

    function filtrar(){
      // Qualquer digitação desfaz a escolha: matrícula só existe se veio da lista.
      pessoas[i] = null; mat.value = '';
      const termo = normalizar(inp.value);
      if(termo.length < 2){ fechar(); return; }
      const achados = TECNICOS.filter(function(t){
        return normalizar(t.n).indexOf(termo) >= 0 || String(t.m).indexOf(termo) >= 0;
      }).slice(0, 30);
      cxSug.innerHTML = '';
      if(!TECNICOS.length){

      }else if(!achados.length){

          cxSug.appendChild(b);

      }
      cxSug.classList.add('aberta');
    }

    inp.addEventListener('input', filtrar);
    inp.addEventListener('focus', function(){ if(inp.value) filtrar(); });
    inp.addEventListener('blur', function(){
      setTimeout(function(){
        fechar();
        if(!pessoas[i]) inp.value = '';   // não sobra nome solto sem matrícula
      }, 180);
    });
    camposPessoa.push({i: i, inp: inp, mat: mat});

  if(c.tipo === 'assinatura'){
    const w = el('div', {id});

    w.appendChild(bt);
    setTimeout(()=> prepararAssinatura(cv, bt, i), 0);
    return w;
  }
  if(c.tipo === 'tabela'){
    const w = el('div', {id});
    const cx = el('div', {class:'tab-caixa'});
    const t = el('table');
    const thead = el('thead'), tr = el('tr');
    (c.colunas||[]).forEach(col=> tr.appendChild(el('th', null, col.rotulo)));
    tr.appendChild(el('th', {class:'acao'}, ''));

/* ---------- lógica condicional ---------- */
const porUid = {};
SCHEMA.campos.forEach(function(c, i){ if(c.uid != null) porUid[String(c.uid)] = i; });

function condicaoAtendida(i, pilha){
  const c = SCHEMA.campos[i];
  if(!c.cond || c.cond.uid == null) return true;
  const j = porUid[String(c.cond.uid)];
  if(j == null || j === i) return true;
  pilha = pilha || {};
  if(pilha[i]) return true;
  pilha[i] = 1;
  if(!condicaoAtendida(j, pilha)) return false;

  const v = ler(SCHEMA.campos[j], j);
  const lista = Array.isArray(v) ? v.map(String) : [String(v)];
  const alvo = String(c.cond.valor == null ? '' : c.cond.valor);
  const op = c.cond.op || 'igual';
  if(op === 'preenchido') return !vazioValor(v);
  if(op === 'vazio') return vazioValor(v);
  if(op === 'diferente') return lista.indexOf(alvo) < 0;
  return lista.indexOf(alvo) >= 0;
}

function atualizarCondicoes(){
  SCHEMA.campos.forEach(function(c, i){
    const b = document.querySelector('[data-bloco="' + i + '"]');

function prepararAssinatura(cv, bt, i){
  const escala = window.devicePixelRatio || 1;
  const r = cv.getBoundingClientRect();
  cv.width = Math.round(r.width * escala);
  cv.height = Math.round(r.height * escala);
  const cx = cv.getContext('2d');
  cx.scale(escala, escala);
  cx.fillStyle = '#fff'; cx.fillRect(0,0,r.width,r.height);
  cx.lineWidth = 2; cx.lineCap = 'round'; cx.lineJoin = 'round'; cx.strokeStyle = '#1A2329';
  let desenhando = false, vazio = true;
  const ponto = ev=>{
    const b = cv.getBoundingClientRect();
    return {x: ev.clientX - b.left, y: ev.clientY - b.top};
  };
  cv.addEventListener('pointerdown', ev=>{
    desenhando = true; vazio = false; cv.setPointerCapture(ev.pointerId);
    const p = ponto(ev); cx.beginPath(); cx.moveTo(p.x, p.y);
  });
  cv.addEventListener('pointermove', ev=>{
    if(!desenhando) return;
    const p = ponto(ev); cx.lineTo(p.x, p.y); cx.stroke();
  });
  const parar = ()=>{
    desenhando = false;
    assinaturas[i] = vazio ? null : {d: cv.toDataURL('image/png'), w: cv.width, h: cv.height};
    agendarRascunho();
  };
  cv.addEventListener('pointerup', parar);
  cv.addEventListener('pointercancel', parar);
  cv.addEventListener('pointerleave', parar);
  bt.addEventListener('click', ()=>{
    const b = cv.getBoundingClientRect();
    cx.fillStyle = '#fff'; cx.fillRect(0,0,b.width,b.height);
    vazio = true; assinaturas[i] = null;
    atualizarCondicoes();
  });
  assinaturas[i] = null;
}

function ler(c, i){
  const id = 'c'+i, n = document.getElementById(id);
  if(['texto','textao','numero','data','hora','select'].indexOf(c.tipo) >= 0) return (n.value||'').trim();
  if(c.tipo === 'radio'){ const m = n.querySelector('input:checked'); return m ? m.value : ''; }
  if(c.tipo === 'checkbox') return Array.from(n.querySelectorAll('input:checked')).map(x=> x.value);
  if(c.tipo === 'pessoa') return pessoas[i] || '';
  if(c.tipo === 'foto') return fotos[i] || [];
  if(c.tipo === 'assinatura') return assinaturas[i] || '';
  if(c.tipo === 'tabela'){
    const linhas = [];
    n.querySelectorAll('tbody tr').forEach(tr=>{
      const vals = Array.from(tr.querySelectorAll('input')).map(x=> (x.value||'').trim());
      if(vals.some(v=> v !== '')) linhas.push(vals);
    });
    return linhas;
  }
  return '';
}

function vazioValor(v){
  if(Array.isArray(v)) return v.length === 0;
  return !v;
}

}

document.getElementById('btPdf').addEventListener('click', async function(){
  const bt = this;
  document.querySelectorAll('.bloco').forEach(b=> b.classList.remove('erro'));
  const dados = [];
  let faltando = null;
  SCHEMA.campos.forEach((c, i)=>{
    if(estaOculto(i)) return;          // campo escondido por condição não é exigido nem entra no PDF
    const v = ler(c, i);
    if(c.obrigatorio && vazioValor(v)){
      document.querySelector('[data-bloco="'+i+'"]').classList.add('erro');
      if(faltando === null) faltando = c.rotulo;
    }
    dados.push({campo:c, valor:v});
  });
  if(faltando !== null){
    if(camposPessoa.length && !TECNICOS.length){
      alerta('ruim', 'A lista de técnicos não carregou, então os campos de nome não podem ser preenchidos. '
                   + 'Use "Tentar de novo" no aviso do topo antes de continuar.');
    }else{
      alerta('ruim', 'Preencha os campos marcados. O primeiro é: ' + faltando);
    }
    return;
  }
  if(!window.jspdf){
    alerta('ruim', 'A biblioteca de PDF não carregou. Conecte à internet e recarregue a página.');
    return;
  }
  const D = SCHEMA.destino || {};
  bt.disabled = true; bt.textContent = 'Gerando PDF...';
  let doc, nomeLocal, pdfBlob;
  try{
    doc = await montarPDF(dados);
    idEnvioAtual = '';   // PDF novo = envio novo (o reenvio do mesmo PDF reaproveita o id)
    nomeLocal = resolver(D.arquivo, dados).replace(/\{ID\}/g,'').replace(/[_-]+$/,'') || 'formulario';
    // blob em vez de doc.save(): evita uma segunda cópia do PDF inteiro em base64
    pdfBlob = doc.output('blob');
    pdfPendente = {blob: pdfBlob, nome: (nomeLocal || 'formulario') + '.pdf'};   // só vira download depois da confirmação
  }catch(e){
    console.error(e);
    alerta('ruim', 'Falha ao gerar o PDF: ' + e.message);
    bt.disabled = false; bt.textContent = rotuloBotao();
    return;
  }

  if(!D.url){
    guardarPDF(pdfBlob, nomeLocal); baixarPDF();
    alerta('bom', 'PDF gerado. Verifique os downloads do aparelho.');
    bt.disabled = false; bt.textContent = rotuloBotao();
    return;
  }

  bt.textContent = 'Enviando...';
  alerta('aviso', 'Enviando para o Dropbox — não feche nem saia desta tela. O PDF fica disponível para baixar quando aparecer a tela de confirmação.');
  try{
    const r = await enviar(pdfBlob, dados, D);
    if(r && r.ok){
      const usadas = chavesDasFotos();
      await limparRascunho();
      await apagarBlobs(usadas);
      guardarPDF(pdfBlob, nomeLocal);   // libera o compartilhamento: o Dropbox confirmou
      sucesso(r, identificadores(dados, D));
    }else if(r && r.sessao === false){
      alerta('ruim', (r.erro || 'Sessão expirada.') + ' O preenchimento ficou salvo — entre de novo pelo menu e reenvie.');
      bt.disabled = false; bt.textContent = rotuloBotao();
    }else{
      alerta('ruim', 'O servidor recusou o envio: ' + ((r && r.erro) || 'motivo não informado') +
                     '. O PDF não foi liberado — corrija e envie de novo.');
      bt.disabled = false; bt.textContent = rotuloBotao();
    }
  }catch(e){
    console.error(e);
    let dica = '';
    if(ultimoTamanhoMB >= 7){
      dica = ' O envio tem ' + ultimoTamanhoMB + ' MB, o que é grande demais para a conexão ou para o limite do '
           + 'Apps Script. Anexe menos imagens ou tente com sinal melhor.';
    }else if(ultimoTamanhoMB > 0){
      dica = ' Tamanho do envio: ' + ultimoTamanhoMB + ' MB.';
    }
    alerta('ruim', 'O envio falhou: ' + (e.message || 'erro de rede') + '.' + dica +
                   ' O preenchimento ficou guardado (o PDF só é liberado depois da confirmação) — ' +
                   'use "Reenviar" quando tiver sinal, sem preencher tudo de novo.');
    mostrarReenviar(pdfBlob, dados, D);
    bt.disabled = false; bt.textContent = rotuloBotao();
  }
});

function mostrarReenviar(pdfBlob, dados, D){
  if(document.getElementById('btReenviar')) return;
  const bt = el('button', {type:'button', class:'btn', id:'btReenviar', style:'margin-top:10px'},
                'Reenviar sem refazer o PDF');
  bt.addEventListener('click', async function(){
    bt.disabled = true; bt.textContent = 'Enviando...';
    try{
      const r = await enviar(pdfBlob, dados, D);
      if(r && r.ok){
        const usadas = chavesDasFotos();
        await limparRascunho();
        await apagarBlobs(usadas);
        pdfPronto = pdfPendente;   // confirmado: libera o download
        sucesso(r, identificadores(dados, D));
        return;
      }
      alerta('ruim', 'O servidor recusou: ' + ((r && r.erro) || 'motivo não informado'));
    }catch(e){
      alerta('ruim', 'Ainda não consegui enviar: ' + (e.message || 'erro de rede'));
    }
    bt.disabled = false; bt.textContent = 'Reenviar sem refazer o PDF';
  });
  msg.appendChild(bt);
}

function limpar(t){
  return String(t == null ? '' : t)
    .replace(/[\\\/:*?"<>|]/g, '-')
    .replace(/\s+/g, ' ')
    .trim();
}

function resolver(padrao, dados){
  const d = new Date(), p = n=> String(n).padStart(2,'0');
  const mapa = {
    '{AAAA}': String(d.getFullYear()),
    '{MM}': p(d.getMonth()+1),
    '{DD}': p(d.getDate()),
    '{MM-AAAA}': p(d.getMonth()+1) + '-' + d.getFullYear(),
    '{HH}': p(d.getHours()),
    '{mm}': p(d.getMinutes())
  };
  return String(padrao || '')
    .replace(/\{(AAAA|MM-AAAA|MM|DD|HH|mm)\}/g, m=> mapa[m])
    .replace(/\{campo:([^}]+)\}/g, function(m, rot){
      const alvo = rot.trim();
      for(const item of dados){
        if((item.campo.rotulo||'').trim() === alvo){
          const v = item.valor;
          if(v && typeof v === 'object' && v.nome) return limpar(v.nome);
          return limpar(Array.isArray(v) ? v.join('-') : v);
        }
      }
      return '';
    });
}

function paraTexto(item){
  const c = item.campo, v = item.valor;
  if(c.tipo === 'pessoa') return v ? (v.nome + ' — ' + v.matricula) : '';
  if(c.tipo === 'tabela') return v.map(l=> l.join(' | ')).join(' ;; ');
  if(c.tipo === 'checkbox') return v.join(', ');
  if(c.tipo === 'foto') return v.length + ' foto(s)';
  if(c.tipo === 'assinatura') return v ? 'assinado' : 'em branco';
  return String(v);
}

let ultimoTamanhoMB = 0;

/* id do envio: o mesmo PDF reenviado (sem resposta no 4G) não grava duas vezes */
let idEnvioAtual = '';

function valorDoUid(dados, uid){
  for(const item of dados){ if(String(item.campo.uid) === String(uid)) return item.valor; }
  return '';
}

/* Fotos que também sobem SOLTAS, além de dentro do PDF, para a pasta do dia
   no Dropbox (W<nn>/<DD-MM-AAAA>/). Rótulo exato do campo de foto acima.
   O nome do arquivo e a lista definitiva ficam no ReportEHS.gs
   (EHS_FOTOS_PASTA): campo que estiver só aqui é ignorado pelo servidor. */
const FOTOS_PASTA = [
  'FOTO DA EQUIPE EM DDS',
  'SINALIZAÇÃO DE SEGURANÇA EXTERNO EM CAMPO',
  'REGISTRO DO LOTO - GROUND',
  'REGISTRO DO LOTO - ROTOR HUB',
  'REGISTRO DO LOTO - BULLON',
  'PERMISSÃO DE TRABALHO EM ALTURA (PTA)',
  'FOTO DA PET - PERMISSÃO DE ENTRADA DE TRABALHO'
];

/* -> [{rotulo, dados:<base64 sem prefixo>}] na ordem em que foram anexadas.
   As fotos já estão comprimidas (mesmo JPEG que vai no PDF): só são relidas
   do banco do aparelho, uma de cada vez. */
async function fotosParaPasta(dados){
  const saida = [];
  for(const item of dados){
    if(item.campo.tipo !== 'foto' || FOTOS_PASTA.indexOf(item.campo.rotulo) === -1) continue;
    for(const f of (item.valor || [])){
      const d = await dadosDaFoto(f);
      if(d) saida.push({rotulo: item.campo.rotulo, dados: String(d).split(',')[1]});
    }
  }
  return saida;
}

async function enviar(pdfBlob, dados, D){
  const sess = ehsSessao();
  if(!sess){
    throw new Error('sua sessão expirou — volte ao menu e entre de novo (o preenchimento fica salvo)');
  }
  const b64 = (await blobParaDataURL(pdfBlob)).split(',')[1];
  const fotos = await fotosParaPasta(dados);
  if(!idEnvioAtual) idEnvioAtual = 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const corpo = {
    acao: 'reportEhs',
    token: sess.token,
    idEnvio: idEnvioAtual,
    data: valorDoUid(dados, 4),
    cliente: valorDoUid(dados, 2),
    parque: valorDoUid(dados, 51),
    supervisor: valorDoUid(dados, 9),
    pdf: b64,
    fotos: fotos,
    campos: (function(){
      const saida = [];
      dados.forEach(function(item){
        saida.push({rotulo: item.campo.rotulo || '', valor: paraTexto(item)});
        // matrícula ganha coluna própria na planilha
        if(item.campo.tipo === 'pessoa'){
          saida.push({rotulo: (item.campo.rotulo || 'Técnico') + ' (matrícula)',
                      valor: item.valor ? item.valor.matricula : ''});
        }
      });
      return saida;
    })()
  };
  const texto = JSON.stringify(corpo);
  // tamanho real do envio: PDF + fotos soltas
  ultimoTamanhoMB = Math.round(texto.length / 1024 / 1024 * 10) / 10;
  let resp = null, falha = null;
  // Uma segunda tentativa cobre queda momentânea de sinal, que é comum em parque.
  for(let tentativa = 1; tentativa <= 2; tentativa++){
    try{
      resp = await fetch(D.url, {
        method: 'POST',
        body: texto,
        redirect: 'follow'
      });
      falha = null;
      break;
    }catch(e){
      falha = e;
      resp = null;
      if(tentativa === 1) await new Promise(function(r){ setTimeout(r, 2500); });
    }
  }
  if(!resp){
    const err = new Error((falha && falha.message ? falha.message : 'falha de rede')
      + ' — o envio tinha ' + ultimoTamanhoMB + ' MB');
    err.tamanho = ultimoTamanhoMB;
    throw err;
  }
  const bruto = await resp.text();
  try{
    return JSON.parse(bruto);
  }catch(e){
    // Quase sempre é a tela de login do Google: implantação não está como "Qualquer pessoa".
    return {ok:false, erro:'resposta ' + resp.status + ' fora do formato esperado — verifique se a implantação está como "Qualquer pessoa". Início: ' + bruto.substring(0,100)};
  }
}

/* O que identifica o relatório são justamente os campos usados no caminho e no
   nome do arquivo — mais a data, se o formulário tiver uma. */
function identificadores(dados, D){
  const nomes = [], re = /\{campo:([^}]+)\}/g;
  const fonte = String((D.sub || '') + ' ' + (D.arquivo || ''));
  let m;
  while((m = re.exec(fonte)) !== null){
    const n = m[1].trim();
    if(nomes.indexOf(n) < 0) nomes.push(n);
  }
  const saida = [];
  nomes.forEach(function(n){
    dados.forEach(function(item){
      if((item.campo.rotulo || '').trim() === n){
        const txt = paraTexto(item);
        if(txt) saida.push({rotulo: n, valor: txt});
      }
    });
  });
  dados.forEach(function(item){
    if(item.campo.tipo === 'data' && item.valor){
      const ja = saida.some(function(x){ return x.rotulo === item.campo.rotulo; });
      if(!ja) saida.push({rotulo: item.campo.rotulo, valor: formatarData(item.valor)});
    }
  });
  return saida.slice(0, 4);
}

function formatarData(v){
  const p = String(v).split('-');
  return p.length === 3 ? (p[2] + '/' + p[1] + '/' + p[0]) : String(v);
}

async function montarPDF(dados){
  const doc = new window.jspdf.jsPDF({unit:'mm', format:'a4'});
  const M = 15, LARG = 210, UTIL = LARG - M*2, FIM = 297 - M;
  let y = M;

  function espaco(h){ if(y + h > FIM){ doc.addPage(); y = M; fotosPag = 0; } }
  let fotosPag = 0;   // máximo 4 fotos por página (zoom do analista)
  function texto(t, tam, estilo){
    doc.setFont('helvetica', estilo || 'normal');
    doc.setFontSize(tam);
    doc.setTextColor(26, 35, 41);
    const linhas = doc.splitTextToSize(String(t), UTIL);
    linhas.forEach(l=>{ espaco(tam*0.45); doc.text(l, M, y); y += tam*0.45 + 1.2; });
  }

  doc.setFillColor(26,35,41); doc.rect(0,0,LARG,22,'F');
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(14);
  doc.text(String(SCHEMA.titulo || 'Formulário').substring(0,60), M, 11);
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
  doc.text(String(SCHEMA.subtitulo || ''), M, 17);
  doc.text('Emitido em ' + dataHoje(), LARG - M, 17, {align:'right'});
  y = 32;

  for(const d of dados){
    const c = d.campo, v = d.valor;
    espaco(14);
    doc.setDrawColor(214,219,216); doc.setLineWidth(0.2);
    doc.line(M, y-3.5, LARG-M, y-3.5);
    doc.setTextColor(92,106,115); doc.setFont('helvetica','bold'); doc.setFontSize(8);
    const rl = doc.splitTextToSize(String(c.rotulo||'').toUpperCase(), UTIL);
    rl.forEach(l=>{ espaco(5); doc.text(l, M, y); y += 4; });
    y += 0.5;

    if(c.tipo === 'assinatura'){
      if(v && v.d){
        const e = Math.min(70 / v.w, 28 / v.h);
        const lg = v.w * e, al = v.h * e;
        espaco(al + 3);
        doc.addImage(v.d, 'PNG', M, y, lg, al);
        y += al + 3;
      } else { texto('(sem assinatura)', 10, 'italic'); }
    }
    else if(c.tipo === 'foto'){
      if(!v.length){ texto('(sem fotos)', 10, 'italic'); }
      else {
        // Foto única ocupa a largura toda; a partir de duas, vão lado a lado.
        // Em nenhum caso a imagem é deformada: a escala é a mesma nos dois eixos.
        const porLinha = v.length === 1 ? 1 : 2;
        const caixaL = porLinha === 1 ? UTIL : (UTIL - 4) / 2;
        const caixaA = porLinha === 1 ? 120 : 112;
        for(let k=0; k<v.length; k+=porLinha){
          const grupo = v.slice(k, k + porLinha).map(function(f){
            const e = Math.min(caixaL / f.w, caixaA / f.h);
            return {ref: f, lg: f.w * e, al: f.h * e};
          });
          let alturaLinha = 0;
          grupo.forEach(function(g){ if(g.al > alturaLinha) alturaLinha = g.al; });
          if(fotosPag + grupo.length > 4){ doc.addPage(); y = M; fotosPag = 0; }
          espaco(alturaLinha + 4);
          for(let idx=0; idx<grupo.length; idx++){
            const g = grupo[idx];
            // Só agora a imagem cheia entra na memória — e sai logo em seguida.
            let dado = await dadosDaFoto(g.ref);
            if(dado){
              const x = M + idx * (caixaL + 4) + (caixaL - g.lg) / 2;   // centraliza na coluna
              doc.addImage(dado, 'JPEG', x, y, g.lg, g.al);
              dado = null;
            }
          }
          y += alturaLinha + 4;
          fotosPag += grupo.length;
        }
      }
    }
    else if(c.tipo === 'tabela'){
      const cols = c.colunas || [];
      const lc = UTIL / Math.max(cols.length, 1);
      espaco(9);
      doc.setFillColor(242,244,243); doc.rect(M, y-3.5, UTIL, 6, 'F');
      doc.setFontSize(7.5); doc.setTextColor(92,106,115);
      cols.forEach((col, k)=> doc.text(String(col.rotulo).substring(0,22), M + k*lc + 1.5, y));
      y += 4;
      doc.setTextColor(26,35,41); doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
      if(!v.length){ y += 1; texto('(nenhuma linha preenchida)', 9, 'italic'); }
      v.forEach(linha=>{
        espaco(7);
        linha.forEach((cel, k)=>{
          const t = doc.splitTextToSize(String(cel), lc - 3)[0] || '';
          doc.text(t, M + k*lc + 1.5, y + 1);
        });
        y += 5;
        doc.setDrawColor(230,233,231); doc.line(M, y-2, LARG-M, y-2);
      });
      y += 2;
    }
    else {
      let t;
      if(c.tipo === 'pessoa') t = v ? (v.nome + '   ·   matrícula ' + v.matricula) : '';
      else t = Array.isArray(v) ? v.join(' • ') : v;
      texto(t || '—', 10.5, 'normal');
      y += 1.5;
    }
    y += 3;
  }

  const tot = doc.internal.getNumberOfPages();
  for(let p=1; p<=tot; p++){
    doc.setPage(p);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(140,150,156);
    doc.text('Página ' + p + ' de ' + tot, LARG - M, 292, {align:'right'});
  }

  return doc;
}

/* ================= FOTOCARD + CARIMBO NAS FOTOS =================
   O mesmo card e o mesmo carimbo de data/hora do app Fotocard, montados aqui
   dentro do report. As etapas fixas (cliente, parque, WTG, data, supervisor e
   técnicos) são preenchidas uma vez no formulário e valem para todas as fotos
   até o envio (ficam no rascunho); a "Etapa do Processo" de cada foto é a
   própria pergunta (HOUVE DDS? -> FOTO DA EQUIPE EM DDS, e assim por diante).
   Câmera ou galeria: toda foto passa pela tela de ajuste — arrastar card e
   carimbo — e só então entra no report, já com os dois gravados na imagem. */
const EHSFC = (function(){
  const FIXOS = [2, 51, 3, 4, 9, 6, 7, 8];   // cliente, parque, WTG, data, supervisor, técnicos 01-03

  function iDe(uid){ return porUid[String(uid)]; }
  function valor(uid){
    const i = iDe(uid);
    if(i == null) return '';
    const v = ler(SCHEMA.campos[i], i);
    if(v && typeof v === 'object') return v.nome || '';
    return String(v || '').trim();
  }
  function brData(v){
    const p = String(v || '').split('-');
    return p.length === 3 ? (p[2] + '/' + p[1] + '/' + p[0]) : String(v || '');
  }
  function estado(etapa){
    return {
      cliente: valor(2), parque: valor(51), wtg: valor(3), data: brData(valor(4)),
      supervisor: valor(9),
      equipe: [6, 7, 8].map(valor).filter(Boolean).join('\n'),
      etapa: etapa || ''
    };
  }
  /* "impressão digital" dos dados fixos: a foto guarda a do momento em que foi
     tirada, e a prévia avisa se algum dado mudou depois */
  function assinatura(){
    const s = estado('');
    return [s.cliente, s.parque, s.wtg, s.data, s.supervisor, s.equipe].join('|');
  }
  /* rótulo da pergunta -> etapa do card (sem a explicação entre parênteses) */
  function etapaDe(c){
    return String(c.rotulo || '').replace(/\s+—.*$/, '').replace(/\s*\([^)]{13,}\)/g, '').trim();
  }
  function faltando(){
    const fora = [];
    FIXOS.forEach(function(uid){
      const i = iDe(uid);
      if(i == null) return;
      const c = SCHEMA.campos[i];
      if(c.obrigatorio && !estaOculto(i) && vazioValor(ler(c, i))) fora.push(i);
    });
    return fora;
  }
  function liberado(){
    const fora = faltando();
    if(!fora.length) return true;
    fora.forEach(function(i){
      const b = document.querySelector('[data-bloco="' + i + '"]');
      if(b) b.classList.add('erro');
    });
    alerta('ruim', 'Antes das fotos, preencha os dados do fotocard: ' +
                   fora.map(function(i){ return SCHEMA.campos[i].rotulo; }).join(', ') + '.');
    const b0 = document.querySelector('[data-bloco="' + fora[0] + '"]');
    if(b0) setTimeout(function(){ b0.scrollIntoView({behavior:'smooth', block:'center'}); }, 350);
    return false;
  }

  /* ── Card: mesmas primitivas, cores e medidas do módulo FC do Fotocard ── */
  const W = 900, OUT = 3, HAIR = 1.5, IW = W - 2*OUT;
  const INK = '#000', PAPER = [255,255,255], CYAN = [159,217,229];
  const FAM = 'Arial, Helvetica, sans-serif', OPACITY = 0.85;
  const PX = 9, PY = 5, LBL = 19, LBLH = 22, LBLM = 2;
  let A = 1;

  function rgba(c, a){ return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + a + ')'; }
  function fnt(px, bold){ return (bold ? 'bold ' : '') + px + 'px ' + FAM; }
  function lhx(px, f){ return px*(f || 1.15); }
  function str(v){ return v == null ? '' : String(v); }
  function up(v){ return str(v).toUpperCase(); }
  const mc = document.createElement('canvas').getContext('2d');

  const logo = new Image();
  let logoOk = false;
  logo.onload = function(){ logoOk = true; previa(); };
  logo.src = '../../logo-ew.png';
  function logoH(){ return logoOk ? 152*(logo.naturalHeight/logo.naturalWidth) : 70; }

  function fill(ctx, x, y, w, h, c){ ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
  function bg(ctx, x, y, w, h, c){ if(A < 1) ctx.clearRect(x, y, w, h); fill(ctx, x, y, w, h, rgba(c, A)); }
  function line(ctx, s, x, y, size, bold, align, lh, ls){
    s = str(s); if(!s) return;
    ctx.font = fnt(size, bold); ctx.fillStyle = INK; ctx.textBaseline = 'top';
    const top = y + ((lh || lhx(size)) - lhx(size))/2;
    if(ls){ lsLine(ctx, s, x, top, ls, align); return; }
    ctx.textAlign = align || 'left';
    ctx.fillText(s, x, top);
    ctx.textAlign = 'left';
  }
  function lsLine(ctx, s, x, y, ls, align){
    let i, w = -ls;
    for(i = 0; i < s.length; i++) w += ctx.measureText(s.charAt(i)).width + ls;
    let cx = align === 'center' ? x - w/2 : (align === 'right' ? x - w : x);
    ctx.textAlign = 'left';
    for(i = 0; i < s.length; i++){ ctx.fillText(s.charAt(i), cx, y); cx += ctx.measureText(s.charAt(i)).width + ls; }
  }
  function wrap(s, maxW, font, ls){
    mc.font = font;
    function wd(t){ return mc.measureText(t).width + (ls ? ls*t.length : 0); }
    const out = [];
    str(s).split('\n').forEach(function(par){
      let buf = '';
      par.split(' ').forEach(function(word){
        while(wd(word) > maxW && word.length > 1){
          let cut = word.length;
          while(cut > 1 && wd(word.slice(0, cut)) > maxW) cut--;
          if(buf){ out.push(buf); buf = ''; }
          out.push(word.slice(0, cut));
          word = word.slice(cut);
        }
        const t = buf ? buf + ' ' + word : word;
        if(buf && wd(t) > maxW){ out.push(buf); buf = word; }
        else buf = t;
      });
      out.push(buf);
    });
    return out;
  }
  function medeTexto(t, f){ mc.font = f; return mc.measureText(t).width; }
  function tamanhoCentral(txt, larg, base, max, ls){
    const t = str(txt); if(!t) return base;
    let tam = max;
    while(tam > base && (medeTexto(t, fnt(tam, true)) + ls*(t.length - 1)) > larg) tam--;
    return tam;
  }
  /* valor cresce até "max" enquanto a linha mais comprida couber */
  function tamanhoValor(val, larg, base, max){
    const t = str(val);
    if(!t || !max || max <= base) return base;
    const linhas = t.split('\n');
    let tam = max;
    while(tam > base && linhas.some(function(l){ return medeTexto(l, fnt(tam, true)) > larg; })) tam--;
    return tam;
  }
  function cellLV(ctx, x, y, w, lbl, val, size, o){
    o = o || {};
    const padX = o.padX || PX, padY = o.padY || PY, mb = (o.mb == null ? LBLM : o.mb);
    const v = o.upper ? up(val) : val;
    size = tamanhoValor(v, w - 2*padX, size, o.max);
    let tx = x + padX, ty = y + padY;
    const lh = lhx(size, o.lhf);
    line(ctx, lbl, tx, ty, LBL, true, 'left', LBLH);
    ty += LBLH + mb;
    wrap(v || '—', w - 2*padX, fnt(size, true), 0).forEach(function(t){
      line(ctx, t, tx, ty, size, true, 'left', lh);
      ty += lh;
    });
  }
  function cellLVh(w, val, size, o){
    o = o || {};
    const padX = o.padX || PX, padY = o.padY || PY, mb = (o.mb == null ? LBLM : o.mb);
    const v = o.upper ? up(val) : val;
    size = tamanhoValor(v, w - 2*padX, size, o.max);
    const n = wrap(v || '—', w - 2*padX, fnt(size, true), 0).length;
    return padY + LBLH + mb + n*lhx(size, o.lhf) + padY;
  }
  function centrado(txt, larg, base, max, ls){
    const t = up(txt) || '—';
    const tam = tamanhoCentral(t, larg, base, max, ls);
    return {tam: tam, linhas: wrap(t, larg, fnt(tam, true), ls), lh: lhx(tam, 1.25)};
  }

  /* Layout do card EHS (faixa horizontal, como o Fotocard):
       Logo | Data | Cliente | WTG
       Parque eólico (Local)
       Etapa do Processo  (a pergunta da foto)
       Supervisor | Equipe */
  function layout(s){
    const B = [];
    const lgW = 168, dtW = 196, wtW = 170, clW = IW - lgW - dtW - wtW, lgH = logoH();
    const oDt = {max:32}, oCl = {max:34, upper:true}, oWt = {max:36, upper:true};
    B.push({
      h: Math.max(56, lgH + 12 + HAIR,
                  cellLVh(dtW - HAIR, s.data, 12, oDt) + HAIR,
                  cellLVh(clW - HAIR, s.cliente, 11, oCl) + HAIR,
                  cellLVh(wtW, s.wtg, 11, oWt) + HAIR),
      draw: function(ctx, y, h){
        const ch = h - HAIR, x2 = OUT + lgW, x3 = x2 + dtW, x4 = x3 + clW;
        bg(ctx, x4, y, wtW, ch, CYAN);                          /* WTG destacada */
        [x2, x3, x4].forEach(function(x){ fill(ctx, x - HAIR, y, HAIR, ch, INK); });
        if(logoOk) ctx.drawImage(logo, OUT + (lgW - HAIR - 152)/2, y + (ch - lgH)/2, 152, lgH);
        cellLV(ctx, x2, y, dtW - HAIR, 'Data', s.data, 12, oDt);
        cellLV(ctx, x3, y, clW - HAIR, 'Cliente', s.cliente, 11, oCl);
        cellLV(ctx, x4, y, wtW, 'WTG', s.wtg, 11, oWt);
      }
    });

    const pq = centrado(s.parque, IW - 20, 15, 54, 2.5);
    B.push({
      h: 3 + LBLH + LBLM + Math.max(24, pq.linhas.length*pq.lh) + 5 + HAIR,
      draw: function(ctx, y){
        line(ctx, 'Parque eólico (Local)', OUT + 10, y + 3, LBL, true, 'left', LBLH);
        let ty = y + 3 + LBLH + LBLM;
        pq.linhas.forEach(function(t){ line(ctx, t, W/2, ty, pq.tam, true, 'center', pq.lh, 2.5); ty += pq.lh; });
      }
    });

    const et = centrado(s.etapa, IW - 20, 13, 40, 1);
    B.push({
      h: 3 + LBLH + LBLM + Math.max(24, et.linhas.length*et.lh) + 5 + HAIR,
      draw: function(ctx, y, h){
        bg(ctx, OUT, y, IW, h - HAIR, CYAN);                    /* etapa destacada */
        line(ctx, 'Etapa do Processo', OUT + 10, y + 3, LBL, true, 'left', LBLH);
        let ty = y + 3 + LBLH + LBLM;
        et.linhas.forEach(function(t){ line(ctx, t, W/2, ty, et.tam, true, 'center', et.lh, 1); ty += et.lh; });
      }
    });

    const svW = Math.round(IW*0.40), eqW = IW - svW;
    const oSv = {max:28, upper:true, lhf:1.25}, oEq = {max:24, upper:true, lhf:1.3};
    B.push({
      h: Math.max(56, cellLVh(svW - HAIR, s.supervisor, 11, oSv) + HAIR, cellLVh(eqW, s.equipe, 10, oEq) + HAIR),
      noline: true,
      draw: function(ctx, y, h){
        fill(ctx, OUT + svW - HAIR, y, HAIR, h - HAIR, INK);
        cellLV(ctx, OUT, y, svW - HAIR, 'Supervisor', s.supervisor, 11, oSv);
        cellLV(ctx, OUT + svW, y, eqW, 'Equipe', s.equipe, 10, oEq);
      }
    });

    let H = OUT*2;
    B.forEach(function(b){ H += b.h; });
    return {w: W, h: H, blocks: B};
  }
  function paintLayout(ctx, L, scale, alpha){
    A = (alpha == null ? 1 : alpha);
    ctx.save();
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.imageSmoothingEnabled = true;
    if('imageSmoothingQuality' in ctx) ctx.imageSmoothingQuality = 'high';
    ctx.clearRect(0, 0, L.w, L.h);
    fill(ctx, 0, 0, L.w, L.h, rgba(PAPER, A));
    let y = OUT;
    L.blocks.forEach(function(b){
      b.draw(ctx, y, b.h);
      if(!b.noline) fill(ctx, OUT, y + b.h - HAIR, IW, HAIR, INK);
      y += b.h;
    });
    ctx.strokeStyle = INK; ctx.lineWidth = OUT;
    ctx.strokeRect(OUT/2, OUT/2, L.w - OUT, L.h - OUT);
    ctx.restore();
    A = 1;
  }

  /* ── Carimbo de data e hora: o do Fotocard (3 linhas, branco com contorno) ──
       16/10/2026 9:50 a.m.
       PE.PARQUE
       WTG: 54 */
  const CARIMBO_MAX = 34;
  function corta(t){ return t.length > CARIMBO_MAX ? t.slice(0, CARIMBO_MAX - 1).trim() + '…' : t; }
  function textoCarimbo(d, s){
    const p = function(n){ return String(n).padStart(2, '0'); };
    const h = d.getHours(), h12 = h % 12 || 12;
    const linhas = [p(d.getDate()) + '/' + p(d.getMonth()+1) + '/' + d.getFullYear() + ' ' +
                    h12 + ':' + p(d.getMinutes()) + ' ' + (h < 12 ? 'a.m.' : 'p.m.')];
    const pq = up(s.parque).trim(), wtg = up(s.wtg).trim().replace(/^WTG[\s:.\-]*/, '');
    if(pq) linhas.push(corta(/^PE[\s.]/.test(pq) ? pq : 'PE.' + pq));
    if(wtg) linhas.push(corta('WTG: ' + wtg));
    return linhas.join('\n');
  }
  function corpoCarimbo(lado){ return Math.max(16, Math.round(lado*0.038)); }
  function margemCarimbo(lado){ return Math.round(lado*0.02); }
  function medeCarimbo(ctx, size, txt){
    ctx.font = 'bold ' + size + 'px ' + FAM;
    const linhas = String(txt).split('\n');
    let w = 0;
    linhas.forEach(function(l){ w = Math.max(w, ctx.measureText(l).width); });
    return {w: w, h: size*1.25*linhas.length};
  }
  function escreveCarimbo(ctx, size, txt){
    ctx.font = 'bold ' + size + 'px ' + FAM;
    const linhas = String(txt).split('\n'), lh = size*1.25, n = linhas.length;
    let w = 0;
    linhas.forEach(function(l){ w = Math.max(w, ctx.measureText(l).width); });
    ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(2, size*0.17);
    ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.fillStyle = '#fff';
    linhas.forEach(function(l, i){
      const y = (i - (n - 1)/2)*lh;
      ctx.strokeText(l, w/2, y);
      ctx.fillText(l, w/2, y);
    });
  }
  /* centro de um bloco de "bb" px num lado de "dim" px, na fração f do espaço livre */
  function centroNoLivre(dim, mg, bb, f){
    const livre = dim - 2*mg - bb;
    return livre <= 0 ? dim/2 : mg + f*livre + bb/2;
  }
  function fracDoCentro(dim, mg, bb, c){
    const livre = dim - 2*mg - bb;
    return livre <= 0 ? 0.5 : Math.min(1, Math.max(0, (c - mg - bb/2)/livre));
  }

  /* posição (fração do espaço livre) e tamanho do card — lembrados no aparelho.
     Padrão do Fotocard: card no canto superior direito, carimbo no inferior direito. */
  const POS_KEY = 'ehs_fotocard_pos';
  const P = {cx:1, cy:0, sx:1, sy:1, fr:0.55};
  try{
    const g = JSON.parse(localStorage.getItem(POS_KEY) || 'null');
    if(g) ['cx','cy','sx','sy','fr'].forEach(function(k){ if(isFinite(g[k])) P[k] = Number(g[k]); });
  }catch(e){}
  function guardarPos(){ try{ localStorage.setItem(POS_KEY, JSON.stringify(P)); }catch(e){} }
  function larguraCard(vw, vh){ return Math.min(Math.min(vw, vh)*P.fr, vw*0.96); }

  /* ── Tela de ajuste ── */
  const aj = $('#fcAj'), palco = $('#fcAjPalco');
  const cvFoto = $('#fcAjFoto'), cvCard = $('#fcAjCard'), cvStamp = $('#fcAjStamp');
  let AJ = null, arr = null;

  function medidas(){
    const lado = Math.min(AJ.vw, AJ.vh), k = AJ.k;
    const L = layout(AJ.est);
    const cw = larguraCard(AJ.vw, AJ.vh)*k, ch = cw*L.h/L.w, mg = Math.round(lado*0.01)*k;
    const size = corpoCarimbo(lado)*k, mgS = margemCarimbo(lado)*k, txt = textoCarimbo(AJ.d, AJ.est);
    const m = medeCarimbo(mc, size, txt);
    return {
      L: L,
      card: {w: cw, h: ch, mg: mg, cx: centroNoLivre(AJ.sw, mg, cw, P.cx), cy: centroNoLivre(AJ.sh, mg, ch, P.cy)},
      stamp: {w: m.w, h: m.h, mg: mgS, size: size, txt: txt,
              cx: centroNoLivre(AJ.sw, mgS, m.w, P.sx), cy: centroNoLivre(AJ.sh, mgS, m.h, P.sy)}
    };
  }
  /* tudo: true = redesenha card e carimbo; 'carimbo' = só o carimbo (relógio da câmera) */
  function pintarPalco(tudo){
    const M = medidas(), dpr = Math.min(3, window.devicePixelRatio || 1);
    if(tudo === true){
      cvCard.width = Math.ceil(M.card.w*dpr); cvCard.height = Math.ceil(M.card.h*dpr);
      paintLayout(cvCard.getContext('2d'), M.L, M.card.w*dpr/W, OPACITY);
    }
    cvCard.style.width = M.card.w + 'px'; cvCard.style.height = M.card.h + 'px';
    cvCard.style.transform = 'translate(' + (M.card.cx - M.card.w/2) + 'px,' + (M.card.cy - M.card.h/2) + 'px)';
    const pad = Math.ceil(M.stamp.size*0.4), sw = M.stamp.w + 2*pad, sh = M.stamp.h + 2*pad;
    if(tudo){
      cvStamp.width = Math.ceil(sw*dpr); cvStamp.height = Math.ceil(sh*dpr);
      const x = cvStamp.getContext('2d');
      x.setTransform(dpr, 0, 0, dpr, 0, 0);
      x.clearRect(0, 0, sw, sh);
      x.translate(sw/2, sh/2);
      escreveCarimbo(x, M.stamp.size, M.stamp.txt);
    }
    cvStamp.style.width = sw + 'px'; cvStamp.style.height = sh + 'px';
    cvStamp.style.transform = 'translate(' + (M.stamp.cx - sw/2) + 'px,' + (M.stamp.cy - sh/2) + 'px)';
  }
  function dimensionar(){
    const topo = aj.querySelector('.fcaj-topo').offsetHeight, bts = aj.querySelector('.fcaj-bts').offsetHeight;
    const aw = Math.min(window.innerWidth - 16, 1100), ah = Math.max(120, window.innerHeight - topo - bts - 16);
    AJ.k = Math.min(aw/AJ.vw, ah/AJ.vh);
    AJ.sw = Math.round(AJ.vw*AJ.k); AJ.sh = Math.round(AJ.vh*AJ.k);
    palco.style.width = AJ.sw + 'px'; palco.style.height = AJ.sh + 'px';
    if(AJ.modo !== 'cam'){     // na câmera ao vivo o fundo é o próprio <video>
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      cvFoto.width = Math.round(AJ.sw*dpr); cvFoto.height = Math.round(AJ.sh*dpr);
      cvFoto.style.width = AJ.sw + 'px'; cvFoto.style.height = AJ.sh + 'px';
      cvFoto.getContext('2d').drawImage(AJ.base, 0, 0, cvFoto.width, cvFoto.height);
    }
    pintarPalco(true);
  }
  window.addEventListener('resize', function(){ if(AJ) dimensionar(); });

  function pontoNoPalco(ev){
    const r = palco.getBoundingClientRect();
    return {x: ev.clientX - r.left, y: ev.clientY - r.top};
  }
  palco.addEventListener('pointerdown', function(ev){
    if(!AJ) return;
    const p = pontoNoPalco(ev), M = medidas();
    const dentro = function(o, folga){ return Math.abs(p.x - o.cx) <= o.w/2 + folga && Math.abs(p.y - o.cy) <= o.h/2 + folga; };
    const alvo = dentro(M.stamp, 14) ? 'stamp' : (dentro(M.card, 0) ? 'card' : null);
    if(!alvo) return;
    const o = M[alvo];
    arr = {alvo: alvo, x0: p.x, y0: p.y, cx: o.cx, cy: o.cy, w: o.w, h: o.h, mg: o.mg};
    try{ palco.setPointerCapture(ev.pointerId); }catch(e){}
    ev.preventDefault();
  });
  palco.addEventListener('pointermove', function(ev){
    if(!arr) return;
    const p = pontoNoPalco(ev);
    const nx = fracDoCentro(AJ.sw, arr.mg, arr.w, arr.cx + p.x - arr.x0);
    const ny = fracDoCentro(AJ.sh, arr.mg, arr.h, arr.cy + p.y - arr.y0);
    if(arr.alvo === 'card'){ P.cx = nx; P.cy = ny; } else { P.sx = nx; P.sy = ny; }
    pintarPalco(false);
  });
  function soltar(){ if(arr){ arr = null; guardarPos(); } }
  palco.addEventListener('pointerup', soltar);
  palco.addEventListener('pointercancel', soltar);

  function botoes(on){
    Array.prototype.forEach.call(aj.querySelectorAll('.fcaj-bt'), function(b){ b.disabled = !on; });
  }
  function rotuloCancelar(){
    const n = AJ && AJ.fotos ? AJ.fotos.length : 0;
    aj.querySelector('[data-fc="cancelar"]').textContent = n ? 'Concluir (' + n + ')' : 'Cancelar';
  }
  /* foto (tela de ajuste) devolve o blob; câmera ao vivo devolve a lista de fotos tiradas */
  function fechar(blob){
    const A0 = AJ, fim = A0.resolve;
    if(A0.base) A0.base.width = A0.base.height = 1;
    if(A0.relogio) clearInterval(A0.relogio);
    if(A0.stream) A0.stream.getTracks().forEach(function(t){ t.stop(); });
    if(A0.video){ A0.video.onresize = null; A0.video.srcObject = null; }
    AJ = null; arr = null;
    aj.classList.remove('aberta', 'cam');
    document.body.style.overflow = '';
    fim(A0.modo === 'cam' ? A0.fotos : blob);
  }
  /* foto final: card e carimbo desenhados (vetor) direto na resolução da foto */
  function montarFinal(){
    const vw = AJ.vw, vh = AJ.vh, lado = Math.min(vw, vh);
    const c = document.createElement('canvas');
    c.width = vw; c.height = vh;
    const x = c.getContext('2d');
    x.drawImage(AJ.base, 0, 0);
    const L = layout(AJ.est), esc = larguraCard(vw, vh)/W;
    const cc = document.createElement('canvas');
    cc.width = Math.max(1, Math.ceil(L.w*esc)); cc.height = Math.max(1, Math.ceil(L.h*esc));
    paintLayout(cc.getContext('2d'), L, esc, OPACITY);
    const mg = Math.round(lado*0.01);
    x.drawImage(cc, centroNoLivre(vw, mg, cc.width, P.cx) - cc.width/2, centroNoLivre(vh, mg, cc.height, P.cy) - cc.height/2);
    const size = corpoCarimbo(lado), mgS = margemCarimbo(lado), txt = textoCarimbo(AJ.d, AJ.est);
    const m = medeCarimbo(x, size, txt);
    x.save();
    x.translate(centroNoLivre(vw, mgS, m.w, P.sx), centroNoLivre(vh, mgS, m.h, P.sy));
    escreveCarimbo(x, size, txt);
    x.restore();
    return new Promise(function(ok){
      c.toBlob(function(b){ c.width = c.height = 1; cc.width = cc.height = 1; ok(b); }, 'image/jpeg', 0.92);
    });
  }
  aj.addEventListener('click', async function(ev){
    const op = ev.target.getAttribute && ev.target.getAttribute('data-fc');
    if(!op || !AJ) return;
    if(op === 'cancelar'){ fechar(null); return; }
    if(op === 'menos' || op === 'mais'){
      P.fr = Math.min(0.90, Math.max(0.30, Math.round((P.fr + (op === 'mais' ? 0.05 : -0.05))*100)/100));
      guardarPos(); pintarPalco(true);
      return;
    }
    if(op === 'usar'){
      botoes(false);
      try{ fechar(await montarFinal()); }
      catch(e){ console.error(e); botoes(true); alerta('ruim', 'Não consegui montar a foto com o fotocard.'); }
    }
    if(op === 'capturar') capturar();
  });

  /* ── Câmera ao vivo ──
     Como no app Fotocard: o vídeo da câmera na tela, com o card e o carimbo
     (relógio andando) por cima, arrastáveis antes de disparar. A foto sai com
     os dois gravados exatamente onde estavam na tela. Pergunta que aceita
     várias fotos deixa a câmera aberta até "Concluir". */
  function medirVideo(){
    const w = AJ.video.videoWidth || 1280, h = AJ.video.videoHeight || 720;
    const f = Math.min(1, QUAL[0]/Math.max(w, h));
    const vw = Math.round(w*f), vh = Math.round(h*f);
    const mudou = vw !== AJ.vw || vh !== AJ.vh;
    AJ.vw = vw; AJ.vh = vh;
    return mudou;
  }
  async function capturar(){
    if(!AJ || AJ.modo !== 'cam' || !AJ.video.videoWidth) return;
    botoes(false);
    try{
      medirVideo();
      const base = document.createElement('canvas');
      base.width = AJ.vw; base.height = AJ.vh;
      base.getContext('2d').drawImage(AJ.video, 0, 0, AJ.vw, AJ.vh);
      AJ.base = base;
      AJ.d = new Date();                // hora exata do disparo
      const fl = $('#fcAjFlash');
      fl.classList.add('on'); setTimeout(function(){ fl.classList.remove('on'); }, 60);
      const b = await montarFinal();
      base.width = base.height = 1; AJ.base = null;
      if(b) AJ.fotos.push(b);
      if(!AJ.varias){ fechar(); return; }
      rotuloCancelar();
    }catch(e){
      console.error(e);
      alerta('ruim', 'Não consegui gravar a foto da câmera.');
    }
    if(AJ) botoes(true);
  }
  async function camera(etapa, varias){
    if(!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
      alerta('ruim', 'Este aparelho/navegador não liberou a câmera ao vivo. Use "Câmera do celular".');
      return [];
    }
    let stream;
    try{
      stream = await navigator.mediaDevices.getUserMedia({audio: false,
        video: {facingMode: {ideal: 'environment'}, width: {ideal: 1920}, height: {ideal: 1080}}});
    }catch(e){
      alerta('ruim', 'Não consegui abrir a câmera ao vivo (' +
        (e && e.name === 'NotAllowedError' ? 'permissão negada' : (e && e.message || 'erro')) +
        '). Use "Câmera do celular".');
      return [];
    }
    const v = $('#fcAjVideo');
    v.srcObject = stream;
    try{ await v.play(); }catch(e){}
    if(!v.videoWidth) await new Promise(function(ok){ v.onloadedmetadata = function(){ ok(); }; setTimeout(ok, 3000); });
    return new Promise(function(ok){
      AJ = {modo: 'cam', stream: stream, video: v, est: estado(etapa), d: new Date(),
            resolve: ok, varias: varias, fotos: [], base: null};
      medirVideo();
      $('#fcAjEtapa').textContent = etapa;
      aj.classList.add('aberta', 'cam');
      document.body.style.overflow = 'hidden';
      botoes(true); rotuloCancelar();
      dimensionar();
      AJ.relogio = setInterval(function(){
        if(AJ && AJ.modo === 'cam' && !arr){ AJ.d = new Date(); pintarPalco('carimbo'); }
      }, 1000);
      /* celular girou: o vídeo muda de proporção e o palco acompanha */
      v.onresize = function(){ if(AJ && AJ.modo === 'cam' && medirVideo()) dimensionar(); };
    });
  }

  async function abrirImagem(file){
    if(typeof createImageBitmap === 'function'){
      try{
        const b = await createImageBitmap(file, {imageOrientation:'from-image'});
        return {img: b, w: b.width, h: b.height, fim: function(){ b.close(); }};
      }catch(e){ /* cai para o modo antigo */ }
    }
    const url = URL.createObjectURL(file);
    const im = await new Promise(function(ok, err){
      const i = new Image();
      i.onload = function(){ ok(i); };
      i.onerror = function(){ URL.revokeObjectURL(url); err(new Error('imagem invalida')); };
      i.src = url;
    });
    return {img: im, w: im.naturalWidth, h: im.naturalHeight, fim: function(){ URL.revokeObjectURL(url); }};
  }

  /* -> Promise<Blob com card + carimbo> ou null (cancelado).
     A foto já é reduzida aqui para o tamanho do report: o card é desenhado
     direto nessa resolução, sem passar por reamostragem depois. */
  async function montar(file, etapa){
    const d = new Date();   // relógio do aparelho na hora em que a foto chega — como no Fotocard
    const im = await abrirImagem(file);
    const base = document.createElement('canvas');
    try{
      const f = Math.min(1, QUAL[0]/Math.max(im.w, im.h));
      base.width = Math.round(im.w*f); base.height = Math.round(im.h*f);
      const x = base.getContext('2d');
      x.fillStyle = '#fff'; x.fillRect(0, 0, base.width, base.height);
      x.drawImage(im.img, 0, 0, base.width, base.height);
    }finally{ im.fim(); }
    return new Promise(function(ok){
      AJ = {base: base, vw: base.width, vh: base.height, est: estado(etapa), d: d, resolve: ok};
      $('#fcAjEtapa').textContent = etapa;
      aj.classList.add('aberta');
      document.body.style.overflow = 'hidden';
      botoes(true); rotuloCancelar();
      dimensionar();
    });
  }

  /* ── Prévia no formulário, logo abaixo dos técnicos ── */
  let cvPrevia = null, avisoPrevia = null, rafPrevia = 0;
  (function(){
    const i = iDe(8);
    const ref = document.querySelector('[data-bloco="' + i + '"]');
    if(!ref) return;
    const b = el('div', {class:'bloco'});
    b.appendChild(el('label', {class:'rot'}, 'FOTOCARD DAS FOTOS'));
    b.appendChild(el('p', {class:'ajuda'}, 'Os dados acima entram no fotocard e no carimbo de data e hora de todas as ' +
      'fotos deste report — preencha uma vez, antes das fotos. A etapa de cada foto é a própria pergunta.'));
    cvPrevia = el('canvas', {style:'width:100%;max-width:600px;height:auto;display:block;border:1px solid var(--linha)'});
    b.appendChild(cvPrevia);
    avisoPrevia = el('p', {class:'ajuda', style:'color:var(--sinal);margin:8px 0 0;display:none'});
    b.appendChild(avisoPrevia);
    ref.parentNode.insertBefore(b, ref.nextSibling);
  })();
  function previa(){
    if(!cvPrevia || rafPrevia) return;
    rafPrevia = requestAnimationFrame(function(){
      rafPrevia = 0;
      const L = layout(estado('(PERGUNTA DA FOTO)'));
      const esc = 600/W*Math.min(2, window.devicePixelRatio || 1);
      cvPrevia.width = Math.ceil(L.w*esc); cvPrevia.height = Math.ceil(L.h*esc);
      paintLayout(cvPrevia.getContext('2d'), L, esc, 1);
      const sig = assinatura();
      let velhas = 0;
      Object.keys(fotos).forEach(function(k){
        if(estaOculto(Number(k))) return;
        (fotos[k] || []).forEach(function(f){ if(f && f.fc && f.fc !== sig) velhas++; });
      });
      avisoPrevia.style.display = velhas ? '' : 'none';
      avisoPrevia.textContent = velhas ? (velhas + ' foto(s) já anexada(s) saíram com dados diferentes dos de cima. ' +
        'Se algum dado mudou, apague essas fotos e tire de novo.') : '';
    });
  }
  window.ehsfcPrevia = previa;
  setTimeout(previa, 0);

  return {montar: montar, camera: camera, etapaDe: etapaDe, liberado: liberado, assinatura: assinatura, previa: previa};
})();

/* ================= EHS: projeto (aba SUPERVISORES) + último report =================
   1) Projeto da matrícula de quem logou (backend do RDO, ação 'projeto'):
      CLIENTE, PARQUE/LOCAL e Supervisor vêm preenchidos e TRAVADOS. Os técnicos
      vêm preenchidos (TÉCNICO 01 = quem logou, depois a equipe do projeto) e
      travados, com "Editar" ao lado — alguém da equipe pode estar de folga.
   2) Sem projeto: listas dos projetos em andamento para escolher, e os campos
      do último report enviado voltam preenchidos (como antes).
   O último projeto recebido fica guardado no aparelho para abrir sem sinal. */
(function(){
  var UID_CLI = 2, UID_PQ = 51, UID_WTG = 3, UID_SUP = 9, UID_TEC = [6, 7, 8];
  var CHAVE_ULT = 'ehs_ultimo_v1';
  var sess = ehsSessao();
  var CHAVE_PROJ = 'ehs_projeto_' + (sess ? sess.mat : 'x');
  /* listas de reserva: só entram se a aba SUPERVISORES não respondeu nunca */
  /* cliente, parque e supervisor: SÓ da aba SUPERVISORES (sem lista reserva).
     Sem sinal, vale a última lista guardada no aparelho. */
  var RESERVA = {clientes:[], supervisores:[]};
  var PROJ = null, OPC = {clientes:[], parques:{}, supervisores:[]};

  function indiceDe(uid){
    for(var i = 0; i < SCHEMA.campos.length; i++){
      if(String(SCHEMA.campos[i].uid) === String(uid)) return i;
    }
    return -1;
  }
  function campo(uid){ var i = indiceDe(uid); return i < 0 ? null : document.getElementById('c' + i); }

  /* forcar=true só para o valor que veio do projeto (já é da aba) */
  function preencherSelect(sel, lista, valor, forcar){
    if(!sel) return;
    var v = valor != null ? valor : sel.value;
    sel.innerHTML = '';
    sel.appendChild(el('option', {value:''}, 'Selecione...'));
    lista.forEach(function(o){ sel.appendChild(el('option', {value:o}, o)); });
    if(v && lista.indexOf(v) < 0 && forcar) sel.appendChild(el('option', {value:v}, v));
    sel.value = (v && (forcar || lista.indexOf(v) >= 0)) ? v : '';
  }
  function preencherParques(valor){
    var c = campo(UID_CLI), p = campo(UID_PQ);
    if(!p) return;
    var lista = (c && c.value && OPC.parques[c.value]) || [];
    preencherSelect(p, lista, valor != null ? valor : (lista.indexOf(p.value) >= 0 ? p.value : ''));
    if(!lista.length && p.options[0]) p.options[0].textContent = c && c.value ? 'Sem parque em andamento' : 'Escolha o cliente primeiro';
  }
  window.ehsPreencherParques = preencherParques;
  function aplicarListas(){
    var cli = OPC.clientes.length ? OPC.clientes : RESERVA.clientes;
    var sup = OPC.supervisores.length ? OPC.supervisores : RESERVA.supervisores;
    preencherSelect(campo(UID_CLI), cli);
    preencherSelect(campo(UID_SUP), sup);
    preencherParques();
  }
  (function(){
    var c = campo(UID_CLI);
    if(c) c.addEventListener('change', function(){ preencherParques(); });
  })();

  function travar(uid, travado){
    var i = indiceDe(uid);
    if(i < 0) return;
    var n = document.getElementById('c' + i);
    if(!n) return;
    if(SCHEMA.campos[i].tipo === 'pessoa'){
      var nome = n.querySelector('.nome');
      if(nome) nome.disabled = !!travado;
      return;
    }
    n.disabled = !!travado;
  }
  function botaoEditar(uid){
    var i = indiceDe(uid);
    var bloco = document.querySelector('[data-bloco="' + i + '"]');
    if(!bloco || bloco.querySelector('.ehs-edit')) return;
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn ehs-edit';
    b.style.cssText = 'margin-top:8px;font-size:12px;padding:4px 12px';
    b.textContent = 'Editar';
    b.onclick = function(){ travar(uid, false); b.remove(); };
    bloco.appendChild(b);
  }
  function tirarEditar(uid){
    var bloco = document.querySelector('[data-bloco="' + indiceDe(uid) + '"]');
    var b = bloco && bloco.querySelector('.ehs-edit');
    if(b) b.remove();
  }
  function porPessoa(uid, t){
    var i = indiceDe(uid);
    var cx = i < 0 ? null : document.getElementById('c' + i);
    if(!cx) return;
    pessoas[i] = {nome: t.nome, matricula: String(t.mat)};
    var nome = cx.querySelector('.nome'), mat = cx.querySelector('.mat');
    if(nome) nome.value = t.nome;
    if(mat) mat.value = String(t.mat);
  }
  function pessoaVazia(uid){
    var i = indiceDe(uid);
    return i >= 0 && !pessoas[i];
  }

  var avisos = [];
  function avisar(t){
    if(avisos.indexOf(t) >= 0) return;
    avisos.push(t);
    var cx = document.getElementById('ehsAvisoProjeto');
    if(!cx){
      cx = el('div', {id:'ehsAvisoProjeto', class:'msg aviso mostrar'});
      var folha = document.querySelector('.folha');
      if(folha) folha.insertBefore(cx, folha.firstChild);
    }
    cx.textContent = avisos.join(' ');
  }

  /* comTecnicos=false: só cliente/parque/supervisor (depois de um rascunho) */
  function aplicarProjeto(comTecnicos){
    if(!PROJ) return false;
    var c = campo(UID_CLI), p = campo(UID_PQ), s = campo(UID_SUP);
    if(c){ preencherSelect(c, OPC.clientes.length ? OPC.clientes : RESERVA.clientes, PROJ.cliente, true); }
    if(p){ preencherSelect(p, (OPC.parques[PROJ.cliente] || []), PROJ.parque || '', true); }
    if(s){ preencherSelect(s, OPC.supervisores.length ? OPC.supervisores : RESERVA.supervisores, PROJ.supervisor, true); }
    [UID_CLI, UID_PQ, UID_SUP].forEach(function(u){ tirarEditar(u); travar(u, true); });

    if(comTecnicos){
      var equipe = [];
      if(sess) equipe.push({nome: sess.nome, mat: sess.mat});
      var semNome = [];
      (PROJ.equipe || []).forEach(function(t){
        if(sess && String(t.mat) === String(sess.mat)) return;
        if(!t.nome){ semNome.push(t.mat); return; }
        equipe.push(t);
      });
      UID_TEC.forEach(function(u, k){
        if(!equipe[k]) return;
        porPessoa(u, equipe[k]);
        travar(u, true);
        botaoEditar(u);
      });
      if(semNome.length) avisar('Matrícula(s) ' + semNome.join(', ') + ' do projeto não estão no cadastro (mini master) e ficaram de fora.');
      if(equipe.length > UID_TEC.length) avisar('O projeto tem ' + equipe.length + ' técnicos e o report tem ' + UID_TEC.length + ' campos — confira quem está na frente de trabalho.');
    }
    if(PROJ.outros && PROJ.outros.length){
      avisar('Você aparece em mais de um projeto em andamento. Usando ' + PROJ.cliente + ' / ' + PROJ.parque
        + ' (início mais recente). Os outros: ' + PROJ.outros.join('; ') + '. Se estiver errado, avise o supervisor.');
    }
    try{ atualizarCondicoes(); }catch(e){}
    return true;
  }
  window.ehsReaplicarProjeto = function(){ aplicarProjeto(false); };

  function lerGuardado(){
    try{ return JSON.parse(localStorage.getItem(CHAVE_ULT) || '{}'); }
    catch(e){ return {}; }
  }

  /* chamado pela tela de sucesso, depois do envio confirmado */
  window.ehsGravarUltimo = function(){
    var guardar = {};
    [UID_CLI, UID_PQ, UID_WTG].concat(UID_TEC).forEach(function(uid){
      var i = indiceDe(uid);
      if(i < 0) return;
      if(SCHEMA.campos[i].tipo === 'pessoa'){
        if(pessoas[i]) guardar[uid] = {nome: pessoas[i].nome, matricula: pessoas[i].matricula};
      }else{
        var n = document.getElementById('c' + i);
        if(n && n.value) guardar[uid] = n.value;
      }
    });
    try{ localStorage.setItem(CHAVE_ULT, JSON.stringify(guardar)); }catch(e){}
  };

  /* último report: com projeto, só a WTG; sem projeto, tudo como antes */
  function aplicarUltimo(){
    var g = lerGuardado();
    var uids = PROJ ? [UID_WTG] : [UID_CLI, UID_PQ, UID_WTG].concat(UID_TEC);
    var algum = false;
    uids.forEach(function(uid){
      if(!(uid in g)) return;
      var i = indiceDe(uid);
      if(i < 0) return;
      var c = SCHEMA.campos[i], v = g[uid];
      if(c.tipo === 'pessoa'){
        if(!pessoaVazia(uid)) return;
        porPessoa(uid, {nome: v.nome, mat: v.matricula});
      }else{
        var n = document.getElementById('c' + i);
        if(!n || n.value) return;
        if(c.tipo === 'select'){
          var ops = Array.prototype.slice.call(n.options).map(function(o){ return o.value; }).filter(Boolean);
          if(ops.indexOf(v) < 0) return;          /* cliente/parque sem projeto em andamento: não repõe */
          n.value = v;
        }
        else n.value = v;
        if(uid === UID_CLI) preencherParques();
      }
      travar(uid, true);
      botaoEditar(uid);
      algum = true;
    });
    if(algum){ try{ atualizarCondicoes(); }catch(e){} }
  }

  function guardarProjeto(r){
    try{ localStorage.setItem(CHAVE_PROJ, JSON.stringify({quando: Date.now(), projeto: r.projeto, opcoes: r.opcoes})); }catch(e){}
  }
  function projetoGuardado(){
    try{ return JSON.parse(localStorage.getItem(CHAVE_PROJ) || 'null'); }catch(e){ return null; }
  }

  async function iniciar(){
    var g = projetoGuardado();
    if(g){ PROJ = g.projeto || null; OPC = g.opcoes || OPC; }
    aplicarListas();

    var r = sess ? await ehsGet({acao:'projeto', token: sess.token}) : null;
    if(r && r.ok){
      PROJ = r.projeto || null;
      OPC = r.opcoes || OPC;
      guardarProjeto(r);
      aplicarListas();
    }else if(r && r.sessao === false){
      avisar('Sua sessão expirou: volte ao menu e entre de novo para preencher o projeto automaticamente.');
    }else if(!g){
      avisar('Não consegui buscar o seu projeto (sem internet?). Preencha cliente, parque e supervisor.');
    }

    if(!aplicarProjeto(true) && sess && r && r.ok){
      avisar('Sua matrícula não está em nenhum projeto em andamento na aba SUPERVISORES — preencha cliente, parque e supervisor.');
    }
    aplicarUltimo();
  }

  /* espera o rascunho (se houver) e a lista de técnicos */
  setTimeout(iniciar, 400);
})();

</script>
