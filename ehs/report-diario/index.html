<!DOCTYPE html>
<html lang="pt-BR">
<head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>

  body{margin:0;background:var(--papel);color:var(--tinta);font-size:16px;line-height:1.5;

  .opc input{width:19px;height:19px;accent-color:var(--aco);flex:0 0 auto}

    font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase}

  .btn-linha{display:flex;gap:8px;flex-wrap:wrap}
  .btn-linha .btn{flex:1;min-width:130px}
  .fotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:9px}
  .miniat{position:relative;border:1px solid var(--linha);border-radius:2px;overflow:hidden;aspect-ratio:4/3;background:#fff}
  .miniat img{width:100%;height:100%;object-fit:cover;display:block}

    background:rgba(26,35,41,.82);color:#fff;line-height:1;padding:0}
  .assin{border:1px solid var(--linha);border-radius:2px;background:#fff;touch-action:none;width:100%;height:170px;display:block}
  .tab-caixa{overflow-x:auto;margin-top:8px}
  table{width:100%;border-collapse:collapse;font-size:14px;min-width:420px}
  th{background:#F2F4F3;border:1px solid var(--linha);padding:7px;text-align:left;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-2)}
  td{border:1px solid var(--linha);padding:0}
  td input{width:100%;border:0;padding:9px 7px;background:transparent}
  td input:focus-visible{outline:2px solid var(--aco);outline-offset:-2px}
  td.acao{width:38px;text-align:center}
  td.acao button{border:0;background:transparent;color:var(--tinta-2);width:100%;padding:8px}
  .rodape{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--linha);
    padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:center}
  .enviar{background:var(--aco);color:#fff;border:1px solid var(--aco);border-radius:2px;
    padding:13px 22px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;flex:1;max-width:420px}
  .enviar:hover{background:#175a86}
  .enviar:disabled{opacity:.6}
  .msg{max-width:720px;margin:0 auto 12px;padding:11px 13px;border-radius:2px;font-size:14px;display:none}
  .msg.mostrar{display:block}
  .msg.ruim{background:#FFF1EC;border:1px solid #F3C4AF;color:#7C2D12}
  .msg.bom{background:#EDF7F2;border:1px solid #A8D5C2;color:#0F6E4F}
  .msg.aviso{background:#FFF8ED;border:1px solid #F0D9B5;color:#7A4A0B}
  .pessoa-cx{position:relative}
  .pessoa-linha{display:flex;gap:8px}
  .pessoa-linha .nome{flex:1}
  .pessoa-linha .mat{flex:0 0 110px;background:#F2F4F3;text-align:center;font-family:var(--mono);font-size:14px}
  .sugestoes{position:absolute;left:0;right:0;top:100%;z-index:20;background:#fff;border:1px solid var(--linha);
    border-top:0;border-radius:0 0 2px 2px;max-height:230px;overflow:auto;display:none}
  .sugestoes.aberta{display:block}
  .sugestoes button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--linha);
    background:#fff;padding:11px 10px;font-size:15px}
  .sugestoes button:hover,.sugestoes button:focus{background:#EDF3F8}
  .sugestoes .mt{font-family:var(--mono);font-size:11px;color:var(--tinta-2);margin-left:6px}
  .sugestoes .nada{padding:11px 10px;font-size:14px;color:var(--tinta-2)}

  .correcao-linha{display:flex;gap:8px;margin-top:9px}
  .correcao-linha input{flex:1;padding:10px;border:1px solid var(--linha);border-radius:2px;
    font-family:var(--mono);text-transform:uppercase}
  .rascunho{background:#EDF3F8;border:1px solid #B9D2E6;border-radius:2px;padding:12px;margin-bottom:12px;font-size:14px}
  .rascunho-bts{display:flex;gap:8px;margin-top:10px}
  .rascunho-bts .btn{flex:1}
  .fim{background:#fff;border:1px solid var(--linha);border-radius:2px;padding:30px 20px;text-align:center}
  .fim-selo{display:inline-block;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
    background:#0F6E4F;color:#fff;padding:5px 12px;border-radius:2px;margin-bottom:14px}
  .fim h2{margin:0 0 6px;font-size:18px}
  .fim p{margin:0 0 6px;color:var(--tinta-2);font-size:14px}
  .fim-prot{font-family:var(--mono);font-size:12px;margin-bottom:18px !important}
  .fim-lista{border:1px solid var(--linha);border-radius:2px;margin:14px 0;text-align:left}
  .fim-item{display:flex;justify-content:space-between;gap:12px;padding:9px 11px;border-bottom:1px solid var(--linha);font-size:14px}
  .fim-item:last-child{border-bottom:0}
  .fim-item span{color:var(--tinta-2);font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;
    text-transform:uppercase;align-self:center}
  .fim-item b{text-align:right}
  .lupa{position:fixed;inset:0;background:rgba(26,35,41,.9);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
  .lupa.aberta{display:flex}
  .lupa img{max-width:100%;max-height:100%}
  .escolha{position:fixed;inset:0;background:rgba(26,35,41,.55);display:none;z-index:60;
    align-items:flex-end;justify-content:center}
  .escolha.aberta{display:flex}
  .escolha-cx{background:#fff;width:100%;max-width:520px;border-radius:2px 2px 0 0;padding:14px}
  .escolha-tit{margin:0 0 10px;font-family:var(--mono);font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--tinta-2);text-align:center}
  .escolha-bt{display:block;width:100%;margin-bottom:8px;padding:15px;border:1px solid var(--linha);
    background:#fff;border-radius:2px;font-size:16px;color:var(--tinta)}
  .escolha-bt:hover{border-color:var(--aco);color:var(--aco)}
  .escolha-bt.cancelar{margin-bottom:0;color:var(--tinta-2);border-style:dashed}
</style>
</head>

<div class="topo"><h1 id="tTitulo"></h1><p id="tSub"></p></div>
<div class="folha">

  <form id="form" novalidate></form>
</div>
<div class="rodape">
  <button type="button" class="btn" id="btCorrigir" style="display:none;flex:0 0 auto">Corrigir</button>

</div>
<div class="lupa" id="lupa"><img id="lupaImg" alt=""></div>
<div class="escolha" id="escolha">

</div>

/* Decodifica a foto SEM transformar o arquivo inteiro numa string base64.
   Uma foto de 12 MP vira ~5,5 MB de texto no readAsDataURL e mais ~48 MB de
   bitmap preso no objeto Image — era isso que estourava a memoria do celular
   depois de algumas fotos. createImageBitmap devolve um bitmap que o navegador
   guarda fora do JS e que a gente fecha na hora; o objectURL e revogado. */
async function decodificar(file){
  if(typeof createImageBitmap === 'function'){
    try{
      return {img: await createImageBitmap(file, {imageOrientation:'from-image'}), bitmap:true};
    }catch(e){ /* cai para o modo antigo */ }
  }
  const url = URL.createObjectURL(file);
  try{
    const img = await new Promise((ok, err)=>{
      const im = new Image();
      im.onload = ()=> ok(im);
      im.onerror = ()=> err(new Error('imagem invalida'));
      im.src = url;
    });
    return {img: img, bitmap:false, url: url};
  }catch(e){ URL.revokeObjectURL(url); throw e; }
}

function comprimir(file, maxLado, qual){
  return new Promise((ok, err)=>{
    decodificar(file).then(function(d){
      const img = d.img;
      try{
        let w = img.width, h = img.height;
        const f = Math.min(1, maxLado/Math.max(w,h));
        w = Math.round(w*f); h = Math.round(h*f);
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        const cx = c.getContext('2d');
        cx.fillStyle = '#fff'; cx.fillRect(0,0,w,h);
        cx.drawImage(img,0,0,w,h);
        // Miniatura pequena para a grade: sem isso o navegador decodifica a
        // imagem inteira só para mostrar num quadrado de 96 px.
        const fm = Math.min(1, 240/Math.max(w,h));
        const cm = document.createElement('canvas');
        cm.width = Math.round(w*fm); cm.height = Math.round(h*fm);
        const cxm = cm.getContext('2d');
        cxm.fillStyle = '#fff'; cxm.fillRect(0,0,cm.width,cm.height);
        cxm.drawImage(img, 0, 0, cm.width, cm.height);
        const mini = cm.toDataURL('image/jpeg', 0.6);
        // Blob em vez de dataURL: não vira string gigante presa na memória.
        c.toBlob(function(blob){
          c.width = c.height = 1;      // libera o canvas grande na hora
          cm.width = cm.height = 1;
          if(d.bitmap) img.close();    // devolve a memoria do bitmap agora
          else URL.revokeObjectURL(d.url);
          if(!blob) return err(new Error('falha ao comprimir'));
          ok({blob: blob, w: w, h: h, mini: mini});
        }, 'image/jpeg', qual);
      }catch(e){
        if(d.bitmap) img.close(); else URL.revokeObjectURL(d.url);
        err(e);
      }
    }).catch(err);
  });
}

/* ---------------- rascunho automático ----------------
   Se a aba for descartada por falta de memória, recarregada ou fechada sem querer,
   nada do que já foi preenchido se perde. Vale principalmente para as fotos. */
const CHAVE = 'rascunho:' + (SCHEMA.titulo || 'form');
let bancoOk = true;

function comBanco(fn){
  return new Promise(function(ok){
    if(!bancoOk || !window.indexedDB) return ok(null);
    let req;
    try{ req = indexedDB.open('formularios_ew', 2); }
    catch(e){ bancoOk = false; return ok(null); }
    req.onupgradeneeded = function(){
      if(!req.result.objectStoreNames.contains('estado')) req.result.createObjectStore('estado');
      if(!req.result.objectStoreNames.contains('fotos')) req.result.createObjectStore('fotos');
    };
    req.onerror = function(){ bancoOk = false; ok(null); };
    req.onsuccess = function(){
      try{ fn(req.result, ok); }
      catch(e){ bancoOk = false; ok(null); }
    };
  });
}

function salvarRascunho(){
  const estado = {quando: Date.now(), campos: {}};
  SCHEMA.campos.forEach(function(c, i){
    const v = ler(c, i);
    if(!vazioValor(v)) estado.campos[i] = v;
  });
  if(!Object.keys(estado.campos).length) return limparRascunho();
  return comBanco(function(bd, ok){
    const t = bd.transaction('estado', 'readwrite');
    t.objectStore('estado').put(estado, CHAVE);
    t.oncomplete = function(){ ok(true); };
    t.onerror = function(){ ok(null); };
  });
}

function lerRascunho(){
  return comBanco(function(bd, ok){
    const r = bd.transaction('estado', 'readonly').objectStore('estado').get(CHAVE);
    r.onsuccess = function(){ ok(r.result || null); };
    r.onerror = function(){ ok(null); };
  });
}

function limparRascunho(){
  return comBanco(function(bd, ok){
    const t = bd.transaction('estado', 'readwrite');
    t.objectStore('estado').delete(CHAVE);
    t.oncomplete = function(){ ok(true); };
    t.onerror = function(){ ok(null); };
  });
}

/* As fotos NÃO ficam na memória. Vão para o banco assim que são tiradas e
   só voltam, uma de cada vez, na hora de montar o PDF. */
function guardarBlob(chave, blob){
  return comBanco(function(bd, ok){
    const t = bd.transaction('fotos', 'readwrite');
    t.objectStore('fotos').put(blob, chave);
    t.oncomplete = function(){ ok(true); };
    t.onerror = function(){ ok(null); };
  });
}

function lerBlob(chave){
  return comBanco(function(bd, ok){
    const r = bd.transaction('fotos', 'readonly').objectStore('fotos').get(chave);
    r.onsuccess = function(){ ok(r.result || null); };
    r.onerror = function(){ ok(null); };
  });
}

function apagarBlobs(chaves){
  if(!chaves || !chaves.length) return Promise.resolve(null);
  return comBanco(function(bd, ok){
    const t = bd.transaction('fotos', 'readwrite');
    const st = t.objectStore('fotos');
    chaves.forEach(function(k){ if(k) st.delete(k); });
    t.oncomplete = function(){ ok(true); };
    t.onerror = function(){ ok(null); };
  });
}

function chavesDasFotos(){
  const l = [];
  Object.keys(fotos).forEach(function(i){
    (fotos[i] || []).forEach(function(f){ if(f && f.id) l.push(f.id); });
  });
  return l;
}

function blobParaDataURL(blob){
  return new Promise(function(ok, err){
    const fr = new FileReader();
    fr.onload = function(){ ok(fr.result); };
    fr.onerror = function(){ err(new Error('não consegui reabrir uma das fotos')); };
    fr.readAsDataURL(blob);
  });
}

async function dadosDaFoto(f){
  if(f.blob) return await blobParaDataURL(f.blob);
  const b = await lerBlob(f.id);
  if(!b) return null;
  return await blobParaDataURL(b);
}

function aplicarRascunho(estado){
  Object.keys(estado.campos || {}).forEach(function(k){
    const i = Number(k), c = SCHEMA.campos[i], v = estado.campos[k];
    if(!c) return;
    const n = document.getElementById('c' + i);
    if(!n) return;
    if(['texto','textao','numero','data','hora','select'].indexOf(c.tipo) >= 0){
      n.value = v;
    }else if(c.tipo === 'radio' || c.tipo === 'checkbox'){
      const alvos = Array.isArray(v) ? v.map(String) : [String(v)];
      Array.prototype.forEach.call(n.querySelectorAll('input'), function(x){
        x.checked = alvos.indexOf(x.value) >= 0;
      });
    }else if(c.tipo === 'foto'){
      fotos[i] = v || [];
      const grade = n.querySelector('.fotos');
      if(grade) desenharFotos(i, grade);
    }else if(c.tipo === 'pessoa'){
      pessoas[i] = v;
      const cp = camposPessoa.filter(function(x){ return x.i === i; })[0];
      if(cp && v){ cp.inp.value = v.nome; cp.mat.value = v.matricula; }
    }else if(c.tipo === 'assinatura'){
      assinaturas[i] = v;
      const cv = n.querySelector('canvas');
      if(cv && v && v.d){
        const img = new Image();
        img.onload = function(){
          const cx = cv.getContext('2d');
          cx.setTransform(1,0,0,1,0,0);
          cx.drawImage(img, 0, 0, cv.width, cv.height);
        };
        img.src = v.d;
      }
    }else if(c.tipo === 'tabela'){
      const tb = n.querySelector('tbody');
      if(!tb) return;
      tb.innerHTML = '';
      (v || []).forEach(function(linha){
        novaLinha(tb, c);
        const inputs = tb.lastChild.querySelectorAll('input');
        linha.forEach(function(cel, k){ if(inputs[k]) inputs[k].value = cel; });
      });
      if(!(v || []).length) novaLinha(tb, c);
    }
  });
  atualizarCondicoes();
}

  const quando = min < 1 ? 'agora há pouco' : (min < 60 ? 'há ' + min + ' min' : 'há ' + Math.round(min/60) + ' h');

  const btSim = el('button', {type:'button', class:'btn'}, 'Continuar');
  const btNao = el('button', {type:'button', class:'btn'}, 'Começar do zero');
  btSim.addEventListener('click', function(){
    aplicarRascunho(estado);
    barra.remove();
  });
  btNao.addEventListener('click', function(){
    const antigas = [];
    Object.keys(estado.campos || {}).forEach(function(k){

      if(Array.isArray(v)) v.forEach(function(f){ if(f && f.id) antigas.push(f.id); });

function aplicarTecnicos(lista){
  TECNICOS = lista || [];
  camposPessoa.forEach(function(cp){

    else cp.inp.placeholder = 'Digite o nome (' + TECNICOS.length + ' técnicos)';
  });

  if(aviso) aviso.style.display = (camposPessoa.length && !TECNICOS.length) ? '' : 'none';

function avisarListaVazia(motivo){
  const aviso = document.getElementById('semLista');
  if(!aviso) return;
  aviso.style.display = '';
  const det = document.getElementById('semListaMotivo');
  if(det) det.textContent = motivo || '';
}

async function carregarTecnicos(){
  if(!camposPessoa.length) return;
  const guardado = await lerEstado('tecnicos');
  if(guardado && guardado.lista) aplicarTecnicos(guardado.lista);

  const url = (SCHEMA.destino || {}).url;
  if(!url) return;
  const fresco = guardado && (Date.now() - guardado.quando) < 10*60*1000;
  if(fresco) return;

  try{
    // A planilha de técnicos é definida nas propriedades do Apps Script.
    const r = await fetch(url, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({listar:'tecnicos'})
    });
    const bruto = await r.text();
    let j = null;
    try{ j = JSON.parse(bruto); }catch(e){}
    if(j && j.ok && j.tecnicos && j.tecnicos.length){
      aplicarTecnicos(j.tecnicos);
      await guardarEstado('tecnicos', {quando: Date.now(), lista: j.tecnicos});
    }else if(!TECNICOS.length){
      // Sem cache e sem resposta útil: diz o porquê em vez de deixar o campo mudo.
      let motivo;
      if(!j) motivo = 'O servidor respondeu ' + r.status + ' fora do formato esperado.';
      else if(j.erro) motivo = j.erro;
      else if(!j.tecnicos) motivo = 'O Apps Script publicado é de uma versão antiga e ainda não sabe listar técnicos. '
                                  + 'Publique uma nova versão do Codigo.gs.';
      else motivo = 'A planilha MINI MASTER abriu, mas não retornou nenhum técnico.';
      avisarListaVazia(motivo);
    }
  }catch(e){
    console.error('lista de técnicos:', e);
    if(!TECNICOS.length) avisarListaVazia('Não consegui falar com o servidor (' + e.message + ').');
  }
}

function montar(c, i){
  const id = 'c'+i;
  if(c.tipo === 'texto')   return el('input', {class:'entrada', id, type:'text'});
  if(c.tipo === 'textao')  return el('textarea', {class:'entrada', id});
  if(c.tipo === 'numero')  return el('input', {class:'entrada', id, type:'number', inputmode:'decimal', step:'any'});
  if(c.tipo === 'data')    return el('input', {class:'entrada', id, type:'date'});
  if(c.tipo === 'hora')    return el('input', {class:'entrada', id, type:'time'});
  if(c.tipo === 'select'){
    const s = el('select', {class:'entrada', id});
    s.appendChild(el('option', {value:''}, 'Selecione...'));
    (c.opcoes||[]).forEach(o=> s.appendChild(el('option', {value:o}, o)));
    return s;
  }
  if(c.tipo === 'radio' || c.tipo === 'checkbox'){
    const w = el('div', {id});
    (c.opcoes||[]).forEach((o, k)=>{
      const l = el('label', {class:'opc'});
      const inp = el('input', {type: c.tipo === 'radio' ? 'radio' : 'checkbox', value:o, name: id});
      l.appendChild(inp); l.appendChild(el('span', null, o));
      w.appendChild(l);
    });
    return w;
  }
  if(c.tipo === 'foto'){
    const w = el('div', {id});
    fotos[i] = [];
    const grade = el('div', {class:'fotos'});

    // Dois inputs separados: com "multiple" o Android costuma abrir SÓ a galeria,
    // e com "capture" abre SÓ a câmera. Um botão para cada caminho resolve os dois.
    const inpCam = el('input', {type:'file', accept:'image/*', capture:'environment', style:'display:none'});
    const inpGal = el('input', {type:'file', accept:'image/*', style:'display:none'});
    if(c.varias) inpGal.setAttribute('multiple','multiple');

    async function receber(inp){
      const arquivos = Array.from(inp.files || []);
      inp.value = '';
      for(const f of arquivos){
        try{
          const r = await comprimir(f, QUAL[0], QUAL[1]);
          const chave = 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
          const guardou = await guardarBlob(chave, r.blob);
          // Se o banco não estiver disponível, o blob fica em memória — ainda é
          // bem mais leve que a dataURL, mas aí o rascunho não protege.
          fotos[i].push({id: chave, w: r.w, h: r.h, mini: r.mini, blob: guardou ? null : r.blob});
          desenharFotos(i, grade);
        }catch(e){
          console.error(e);
          alerta('ruim', 'Não foi possível ler uma das imagens.');
        }
      }
      atualizarCondicoes();
      agendarRascunho();
    }
    inpCam.addEventListener('change', ()=> receber(inpCam));
    inpGal.addEventListener('change', ()=> receber(inpGal));

    const bt = el('button', {type:'button', class:'btn'}, 'Adicionar foto');
    bt.addEventListener('click', ()=> abrirEscolha(inpCam, inpGal));

    w.appendChild(inpCam); w.appendChild(inpGal); w.appendChild(bt); w.appendChild(grade);
    return w;
  }
  if(c.tipo === 'pessoa'){
    const w = el('div', {id, class:'pessoa-cx'});
    const linha = el('div', {class:'pessoa-linha'});
    const inp = el('input', {class:'entrada nome', type:'text', autocomplete:'off',
                             placeholder:'Digite o nome', enterkeyhint:'search'});
    const mat = el('input', {class:'entrada mat', type:'text', readonly:'readonly', placeholder:'Matrícula', tabindex:'-1'});
    linha.appendChild(inp); linha.appendChild(mat);
    const cxSug = el('div', {class:'sugestoes'});
    w.appendChild(linha); w.appendChild(cxSug);
    pessoas[i] = null;

    function fechar(){ cxSug.classList.remove('aberta'); cxSug.innerHTML = ''; }

    function escolher(t){
      pessoas[i] = {nome: t.n, matricula: t.m};
      inp.value = t.n; mat.value = t.m;
      fechar(); atualizarCondicoes(); agendarRascunho();
    }

    function filtrar(){
      // Qualquer digitação desfaz a escolha: matrícula só existe se veio da lista.
      pessoas[i] = null; mat.value = '';
      const termo = normalizar(inp.value);
      if(termo.length < 2){ fechar(); return; }
      const achados = TECNICOS.filter(function(t){
        return normalizar(t.n).indexOf(termo) >= 0 || String(t.m).indexOf(termo) >= 0;
      }).slice(0, 30);
      cxSug.innerHTML = '';
      if(!TECNICOS.length){
        cxSug.appendChild(el('div', {class:'nada'}, 'Lista de técnicos ainda não carregou.'));
      }else if(!achados.length){
        cxSug.appendChild(el('div', {class:'nada'}, 'Nenhum técnico com esse nome.'));
      }else{
        achados.forEach(function(t){
          const b = el('button', {type:'button'});
          b.appendChild(el('span', null, t.n));
          b.appendChild(el('span', {class:'mt'}, t.m));
          b.addEventListener('mousedown', function(ev){ ev.preventDefault(); escolher(t); });
          cxSug.appendChild(b);
        });
      }
      cxSug.classList.add('aberta');
    }

    inp.addEventListener('input', filtrar);
    inp.addEventListener('focus', function(){ if(inp.value) filtrar(); });
    inp.addEventListener('blur', function(){
      setTimeout(function(){
        fechar();
        if(!pessoas[i]) inp.value = '';   // não sobra nome solto sem matrícula
      }, 180);
    });
    camposPessoa.push({i: i, inp: inp, mat: mat});
    return w;
  }
  if(c.tipo === 'assinatura'){
    const w = el('div', {id});
    const cv = el('canvas', {class:'assin'});
    w.appendChild(cv);
    const bt = el('button', {type:'button', class:'btn', style:'margin-top:8px'}, 'Limpar assinatura');
    w.appendChild(bt);
    setTimeout(()=> prepararAssinatura(cv, bt, i), 0);
    return w;
  }
  if(c.tipo === 'tabela'){
    const w = el('div', {id});
    const cx = el('div', {class:'tab-caixa'});
    const t = el('table');
    const thead = el('thead'), tr = el('tr');
    (c.colunas||[]).forEach(col=> tr.appendChild(el('th', null, col.rotulo)));
    tr.appendChild(el('th', {class:'acao'}, ''));
    thead.appendChild(tr); t.appendChild(thead);
    const tb = el('tbody'); t.appendChild(tb);
    cx.appendChild(t); w.appendChild(cx);
    const bt = el('button', {type:'button', class:'btn', style:'margin-top:8px'}, 'Adicionar linha');
    bt.addEventListener('click', ()=> novaLinha(tb, c));
    w.appendChild(bt);
    novaLinha(tb, c);
    return w;
  }
  return el('div');
}

/* ---------- lógica condicional ---------- */
const porUid = {};
SCHEMA.campos.forEach(function(c, i){ if(c.uid != null) porUid[String(c.uid)] = i; });

function condicaoAtendida(i, pilha){
  const c = SCHEMA.campos[i];
  if(!c.cond || c.cond.uid == null) return true;
  const j = porUid[String(c.cond.uid)];
  if(j == null || j === i) return true;
  pilha = pilha || {};
  if(pilha[i]) return true;
  pilha[i] = 1;
  if(!condicaoAtendida(j, pilha)) return false;

  const v = ler(SCHEMA.campos[j], j);
  const lista = Array.isArray(v) ? v.map(String) : [String(v)];
  const alvo = String(c.cond.valor == null ? '' : c.cond.valor);
  const op = c.cond.op || 'igual';
  if(op === 'preenchido') return !vazioValor(v);
  if(op === 'vazio') return vazioValor(v);
  if(op === 'diferente') return lista.indexOf(alvo) < 0;
  return lista.indexOf(alvo) >= 0;
}

function atualizarCondicoes(){
  SCHEMA.campos.forEach(function(c, i){
    const b = document.querySelector('[data-bloco="' + i + '"]');
    if(!b) return;
    const mostrar = condicaoAtendida(i);
    b.style.display = mostrar ? '' : 'none';
    b.setAttribute('data-oculto', mostrar ? '0' : '1');
  });
}

function estaOculto(i){
  const b = document.querySelector('[data-bloco="' + i + '"]');
  return !!(b && b.getAttribute('data-oculto') === '1');
}

function prepararAssinatura(cv, bt, i){
  const escala = window.devicePixelRatio || 1;
  const r = cv.getBoundingClientRect();
  cv.width = Math.round(r.width * escala);
  cv.height = Math.round(r.height * escala);
  const cx = cv.getContext('2d');
  cx.scale(escala, escala);
  cx.fillStyle = '#fff'; cx.fillRect(0,0,r.width,r.height);
  cx.lineWidth = 2; cx.lineCap = 'round'; cx.lineJoin = 'round'; cx.strokeStyle = '#1A2329';
  let desenhando = false, vazio = true;
  const ponto = ev=>{
    const b = cv.getBoundingClientRect();
    return {x: ev.clientX - b.left, y: ev.clientY - b.top};
  };
  cv.addEventListener('pointerdown', ev=>{
    desenhando = true; vazio = false; cv.setPointerCapture(ev.pointerId);
    const p = ponto(ev); cx.beginPath(); cx.moveTo(p.x, p.y);
  });
  cv.addEventListener('pointermove', ev=>{
    if(!desenhando) return;
    const p = ponto(ev); cx.lineTo(p.x, p.y); cx.stroke();
  });
  const parar = ()=>{
    desenhando = false;
    assinaturas[i] = vazio ? null : {d: cv.toDataURL('image/png'), w: cv.width, h: cv.height};
    agendarRascunho();
  };
  cv.addEventListener('pointerup', parar);
  cv.addEventListener('pointercancel', parar);
  cv.addEventListener('pointerleave', parar);
  bt.addEventListener('click', ()=>{
    const b = cv.getBoundingClientRect();
    cx.fillStyle = '#fff'; cx.fillRect(0,0,b.width,b.height);
    vazio = true; assinaturas[i] = null;
    atualizarCondicoes();
  });
  assinaturas[i] = null;
}

function ler(c, i){
  const id = 'c'+i, n = document.getElementById(id);
  if(['texto','textao','numero','data','hora','select'].indexOf(c.tipo) >= 0) return (n.value||'').trim();
  if(c.tipo === 'radio'){ const m = n.querySelector('input:checked'); return m ? m.value : ''; }
  if(c.tipo === 'checkbox') return Array.from(n.querySelectorAll('input:checked')).map(x=> x.value);
  if(c.tipo === 'pessoa') return pessoas[i] || '';
  if(c.tipo === 'foto') return fotos[i] || [];
  if(c.tipo === 'assinatura') return assinaturas[i] || '';
  if(c.tipo === 'tabela'){
    const linhas = [];
    n.querySelectorAll('tbody tr').forEach(tr=>{
      const vals = Array.from(tr.querySelectorAll('input')).map(x=> (x.value||'').trim());
      if(vals.some(v=> v !== '')) linhas.push(vals);
    });
    return linhas;
  }
  return '';
}

function vazioValor(v){
  if(Array.isArray(v)) return v.length === 0;
  return !v;
}

}

document.getElementById('btPdf').addEventListener('click', async function(){
  const bt = this;
  document.querySelectorAll('.bloco').forEach(b=> b.classList.remove('erro'));
  const dados = [];
  let faltando = null;
  SCHEMA.campos.forEach((c, i)=>{
    if(estaOculto(i)) return;          // campo escondido por condição não é exigido nem entra no PDF
    const v = ler(c, i);
    if(c.obrigatorio && vazioValor(v)){
      document.querySelector('[data-bloco="'+i+'"]').classList.add('erro');
      if(faltando === null) faltando = c.rotulo;
    }
    dados.push({campo:c, valor:v});
  });
  if(faltando !== null){
    if(camposPessoa.length && !TECNICOS.length){
      alerta('ruim', 'A lista de técnicos não carregou, então os campos de nome não podem ser preenchidos. '
                   + 'Use "Tentar de novo" no aviso do topo antes de continuar.');
    }else{
      alerta('ruim', 'Preencha os campos marcados. O primeiro é: ' + faltando);
    }
    return;
  }
  if(!window.jspdf){
    alerta('ruim', 'A biblioteca de PDF não carregou. Conecte à internet e recarregue a página.');
    return;
  }
  const D = SCHEMA.destino || {};
  bt.disabled = true; bt.textContent = 'Gerando PDF...';
  let doc, nomeLocal, pdfBlob;
  try{
    doc = await montarPDF(dados);
    nomeLocal = resolver(D.arquivo, dados).replace(/\{ID\}/g,'').replace(/[_-]+$/,'') || 'formulario';
    // blob em vez de doc.save(): evita uma segunda cópia do PDF inteiro em base64
    pdfBlob = doc.output('blob');
    const liga = document.createElement('a');
    const endereco = URL.createObjectURL(pdfBlob);
    liga.href = endereco; liga.download = nomeLocal + '.pdf';
    document.body.appendChild(liga); liga.click(); liga.remove();
    setTimeout(function(){ URL.revokeObjectURL(endereco); }, 8000);
  }catch(e){
    console.error(e);
    alerta('ruim', 'Falha ao gerar o PDF: ' + e.message);
    bt.disabled = false; bt.textContent = rotuloBotao();
    return;
  }

  if(!D.url){
    alerta('bom', 'PDF gerado. Verifique os downloads do aparelho.');
    bt.disabled = false; bt.textContent = rotuloBotao();
    return;
  }

  bt.textContent = 'Enviando...';
  alerta('aviso', 'PDF salvo no aparelho. Enviando para o Dropbox — não feche a página.');
  try{
    const r = await enviar(pdfBlob, dados, D);
    if(r && r.ok){
      const usadas = chavesDasFotos();
      await limparRascunho();
      await apagarBlobs(usadas);
      sucesso(r, identificadores(dados, D));
    }else{
      alerta('ruim', 'O servidor recusou o envio: ' + ((r && r.erro) || 'motivo não informado') +
                     '. O PDF já está salvo no aparelho — reenvie depois.');
      bt.disabled = false; bt.textContent = rotuloBotao();
    }
  }catch(e){
    console.error(e);
    let dica = '';
    if(ultimoTamanhoMB >= 7){
      dica = ' O envio tem ' + ultimoTamanhoMB + ' MB, o que é grande demais para a conexão ou para o limite do '
           + 'Apps Script. Reduza a qualidade das fotos no construtor ou anexe menos imagens.';
    }else if(ultimoTamanhoMB > 0){
      dica = ' Tamanho do envio: ' + ultimoTamanhoMB + ' MB.';
    }
    alerta('ruim', 'O envio falhou: ' + (e.message || 'erro de rede') + '.' + dica +
                   ' O PDF está salvo no aparelho e o preenchimento ficou guardado — ' +
                   'use "Reenviar" quando tiver sinal, sem preencher tudo de novo.');
    mostrarReenviar(pdfBlob, dados, D);
    bt.disabled = false; bt.textContent = rotuloBotao();
  }
});

function mostrarReenviar(pdfBlob, dados, D){

        return;
      }
      alerta('ruim', 'O servidor recusou: ' + ((r && r.erro) || 'motivo não informado'));
    }catch(e){
      alerta('ruim', 'Ainda não consegui enviar: ' + (e.message || 'erro de rede'));

function rotuloBotao(){
  if(!(SCHEMA.destino && SCHEMA.destino.url)) return 'Gerar PDF';
  return protocoloCorrecao ? 'Substituir relatório ' + protocoloCorrecao : 'Gerar PDF e enviar';
}

function limpar(t){
  return String(t == null ? '' : t)
    .replace(/[\\\/:*?"<>|]/g, '-')
    .replace(/\s+/g, ' ')
    .trim();
}

function resolver(padrao, dados){
  const d = new Date(), p = n=> String(n).padStart(2,'0');
  const mapa = {
    '{AAAA}': String(d.getFullYear()),
    '{MM}': p(d.getMonth()+1),
    '{DD}': p(d.getDate()),
    '{MM-AAAA}': p(d.getMonth()+1) + '-' + d.getFullYear(),
    '{HH}': p(d.getHours()),
    '{mm}': p(d.getMinutes())
  };
  return String(padrao || '')
    .replace(/\{(AAAA|MM-AAAA|MM|DD|HH|mm)\}/g, m=> mapa[m])
    .replace(/\{campo:([^}]+)\}/g, function(m, rot){
      const alvo = rot.trim();
      for(const item of dados){
        if((item.campo.rotulo||'').trim() === alvo){
          const v = item.valor;
          if(v && typeof v === 'object' && v.nome) return limpar(v.nome);
          return limpar(Array.isArray(v) ? v.join('-') : v);
        }
      }
      return '';
    });
}

function paraTexto(item){
  const c = item.campo, v = item.valor;
  if(c.tipo === 'pessoa') return v ? (v.nome + ' — ' + v.matricula) : '';
  if(c.tipo === 'tabela') return v.map(l=> l.join(' | ')).join(' ;; ');
  if(c.tipo === 'checkbox') return v.join(', ');
  if(c.tipo === 'foto') return v.length + ' foto(s)';
  if(c.tipo === 'assinatura') return v ? 'assinado' : 'em branco';
  return String(v);
}

let ultimoTamanhoMB = 0;

async function enviar(pdfBlob, dados, D){
  const b64 = (await blobParaDataURL(pdfBlob)).split(',')[1];
  ultimoTamanhoMB = Math.round(b64.length / 1024 / 1024 * 10) / 10;
  const base = String(D.pasta || '/').replace(/\/+$/,'');
  const sub = resolver(D.sub, dados).replace(/^\/+|\/+$/g,'');
  const corpo = {
    formulario: SCHEMA.titulo || 'Formulário',
    pasta: base + (sub ? '/' + sub : ''),
    arquivo: (resolver(D.arquivo, dados) || 'arquivo') + '.pdf',
    planilha: D.sheet !== false,
    planilhaId: D.sheetId || '',
    pdf: b64,
    protocolo: protocoloCorrecao || '',
    campos: (function(){
      const saida = [];
      dados.forEach(function(item){
        saida.push({rotulo: item.campo.rotulo || '', valor: paraTexto(item)});
        // matrícula ganha coluna própria na planilha
        if(item.campo.tipo === 'pessoa'){
          saida.push({rotulo: (item.campo.rotulo || 'Técnico') + ' (matrícula)',
                      valor: item.valor ? item.valor.matricula : ''});
        }
      });
      return saida;
    })()
  };
  const texto = JSON.stringify(corpo);
  let resp = null, falha = null;
  // Uma segunda tentativa cobre queda momentânea de sinal, que é comum em parque.
  for(let tentativa = 1; tentativa <= 2; tentativa++){
    try{
      resp = await fetch(D.url, {
        method: 'POST',
        headers: {'Content-Type': 'text/plain;charset=utf-8'},
        body: texto,
        redirect: 'follow'
      });
      falha = null;
      break;
    }catch(e){
      falha = e;
      resp = null;
      if(tentativa === 1) await new Promise(function(r){ setTimeout(r, 2500); });
    }
  }
  if(!resp){
    const err = new Error((falha && falha.message ? falha.message : 'falha de rede')
      + ' — o envio tinha ' + ultimoTamanhoMB + ' MB');
    err.tamanho = ultimoTamanhoMB;
    throw err;
  }
  const bruto = await resp.text();
  try{
    return JSON.parse(bruto);
  }catch(e){
    // Quase sempre é a tela de login do Google: implantação não está como "Qualquer pessoa".
    return {ok:false, erro:'resposta ' + resp.status + ' fora do formato esperado — verifique se a implantação está como "Qualquer pessoa". Início: ' + bruto.substring(0,100)};
  }
}

/* O que identifica o relatório são justamente os campos usados no caminho e no
   nome do arquivo — mais a data, se o formulário tiver uma. */
function identificadores(dados, D){
  const nomes = [], re = /\{campo:([^}]+)\}/g;
  const fonte = String((D.sub || '') + ' ' + (D.arquivo || ''));
  let m;
  while((m = re.exec(fonte)) !== null){
    const n = m[1].trim();
    if(nomes.indexOf(n) < 0) nomes.push(n);
  }
  const saida = [];
  nomes.forEach(function(n){
    dados.forEach(function(item){
      if((item.campo.rotulo || '').trim() === n){
        const txt = paraTexto(item);
        if(txt) saida.push({rotulo: n, valor: txt});
      }
    });
  });
  dados.forEach(function(item){
    if(item.campo.tipo === 'data' && item.valor){
      const ja = saida.some(function(x){ return x.rotulo === item.campo.rotulo; });
      if(!ja) saida.push({rotulo: item.campo.rotulo, valor: formatarData(item.valor)});
    }
  });
  return saida.slice(0, 4);
}

function formatarData(v){
  const p = String(v).split('-');
  return p.length === 3 ? (p[2] + '/' + p[1] + '/' + p[0]) : String(v);
}

function sucesso(r, ident){
  try{ if(window.ehsGravarUltimo) window.ehsGravarUltimo(); }catch(e){}
  let linhas = '';
  (ident || []).forEach(function(x){
    linhas += '<div class="fim-item"><span>' + x.rotulo + '</span><b>' + x.valor + '</b></div>';
  });
  document.querySelector('.folha').innerHTML =
    '<div class="fim">' +
      '<div class="fim-selo">Enviado</div>' +
      '<h2>' + (SCHEMA.titulo || 'Formulário') + '</h2>' +
      (linhas ? '<div class="fim-lista">' + linhas + '</div>' : '') +
      '<p>' + (r.corrigido ? 'Relatório substituído. ' : 'Registro concluído. ') +
        'Uma cópia do PDF ficou salva neste aparelho.</p>' +
      '<p class="fim-prot">Protocolo <b>' + (r.id || '—') + '</b></p>' +
      '<button type="button" class="btn" onclick="location.reload()">Preencher outro</button>' +
    '</div>';
  document.querySelector('.rodape').style.display = 'none';
  window.scrollTo(0,0);
}

async function montarPDF(dados){
  const doc = new window.jspdf.jsPDF({unit:'mm', format:'a4'});
  const M = 15, LARG = 210, UTIL = LARG - M*2, FIM = 297 - M;
  let y = M;

  function espaco(h){ if(y + h > FIM){ doc.addPage(); y = M; } }
  function texto(t, tam, estilo){
    doc.setFont('helvetica', estilo || 'normal');
    doc.setFontSize(tam);
    doc.setTextColor(26, 35, 41);
    const linhas = doc.splitTextToSize(String(t), UTIL);
    linhas.forEach(l=>{ espaco(tam*0.45); doc.text(l, M, y); y += tam*0.45 + 1.2; });
  }

  doc.setFillColor(26,35,41); doc.rect(0,0,LARG,22,'F');
  doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(14);
  doc.text(String(SCHEMA.titulo || 'Formulário').substring(0,60), M, 11);
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
  doc.text(String(SCHEMA.subtitulo || ''), M, 17);
  doc.text('Emitido em ' + dataHoje(), LARG - M, 17, {align:'right'});
  y = 32;

  for(const d of dados){
    const c = d.campo, v = d.valor;
    espaco(14);
    doc.setDrawColor(214,219,216); doc.setLineWidth(0.2);
    doc.line(M, y-3.5, LARG-M, y-3.5);
    doc.setTextColor(92,106,115); doc.setFont('helvetica','bold'); doc.setFontSize(8);
    const rl = doc.splitTextToSize(String(c.rotulo||'').toUpperCase(), UTIL);
    rl.forEach(l=>{ espaco(5); doc.text(l, M, y); y += 4; });
    y += 0.5;

    if(c.tipo === 'assinatura'){
      if(v && v.d){
        const e = Math.min(70 / v.w, 28 / v.h);
        const lg = v.w * e, al = v.h * e;
        espaco(al + 3);
        doc.addImage(v.d, 'PNG', M, y, lg, al);
        y += al + 3;
      } else { texto('(sem assinatura)', 10, 'italic'); }
    }
    else if(c.tipo === 'foto'){
      if(!v.length){ texto('(sem fotos)', 10, 'italic'); }
      else {
        // Foto única ocupa a largura toda; a partir de duas, vão lado a lado.
        // Em nenhum caso a imagem é deformada: a escala é a mesma nos dois eixos.
        const porLinha = v.length === 1 ? 1 : 2;
        const caixaL = porLinha === 1 ? UTIL : (UTIL - 4) / 2;
        const caixaA = porLinha === 1 ? 115 : 78;
        for(let k=0; k<v.length; k+=porLinha){
          const grupo = v.slice(k, k + porLinha).map(function(f){
            const e = Math.min(caixaL / f.w, caixaA / f.h);
            return {ref: f, lg: f.w * e, al: f.h * e};
          });
          let alturaLinha = 0;
          grupo.forEach(function(g){ if(g.al > alturaLinha) alturaLinha = g.al; });
          espaco(alturaLinha + 4);
          for(let idx=0; idx<grupo.length; idx++){
            const g = grupo[idx];
            // Só agora a imagem cheia entra na memória — e sai logo em seguida.
            let dado = await dadosDaFoto(g.ref);
            if(dado){
              const x = M + idx * (caixaL + 4) + (caixaL - g.lg) / 2;   // centraliza na coluna
              doc.addImage(dado, 'JPEG', x, y, g.lg, g.al);
              dado = null;
            }
          }
          y += alturaLinha + 4;
        }
      }
    }
    else if(c.tipo === 'tabela'){
      const cols = c.colunas || [];
      const lc = UTIL / Math.max(cols.length, 1);
      espaco(9);
      doc.setFillColor(242,244,243); doc.rect(M, y-3.5, UTIL, 6, 'F');
      doc.setFontSize(7.5); doc.setTextColor(92,106,115);
      cols.forEach((col, k)=> doc.text(String(col.rotulo).substring(0,22), M + k*lc + 1.5, y));
      y += 4;
      doc.setTextColor(26,35,41); doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
      if(!v.length){ y += 1; texto('(nenhuma linha preenchida)', 9, 'italic'); }
      v.forEach(linha=>{
        espaco(7);
        linha.forEach((cel, k)=>{
          const t = doc.splitTextToSize(String(cel), lc - 3)[0] || '';
          doc.text(t, M + k*lc + 1.5, y + 1);
        });
        y += 5;
        doc.setDrawColor(230,233,231); doc.line(M, y-2, LARG-M, y-2);
      });
      y += 2;
    }
    else {
      let t;
      if(c.tipo === 'pessoa') t = v ? (v.nome + '   ·   matrícula ' + v.matricula) : '';
      else t = Array.isArray(v) ? v.join(' • ') : v;
      texto(t || '—', 10.5, 'normal');
      y += 1.5;
    }
    y += 3;
  }

  const tot = doc.internal.getNumberOfPages();
  for(let p=1; p<=tot; p++){
    doc.setPage(p);
    doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(140,150,156);
    doc.text('Página ' + p + ' de ' + tot, LARG - M, 292, {align:'right'});
  }

  return doc;
}

/* ================= EHS: campos repetidos do dia anterior =================
   PARQUE/LOCAL, N DA WTG e os tres tecnicos voltam preenchidos e TRAVADOS.
   Para mudar, o tecnico toca em "Editar" ao lado do campo. Guardado so
   neste aparelho e separado do RDO (chave propria). */
(function(){
  var CHAVE = 'ehs_ultimo_v1';
  var UIDS  = [51, 3, 6, 7, 8];   /* PARQUE/LOCAL, WTG, TEC 01, TEC 02, TEC 03 */

  function indiceDe(uid){
    for(var i = 0; i < SCHEMA.campos.length; i++){
      if(String(SCHEMA.campos[i].uid) === String(uid)) return i;
    }
    return -1;
  }

  function lerGuardado(){
    try{ return JSON.parse(localStorage.getItem(CHAVE) || '{}'); }
    catch(e){ return {}; }
  }

  /* chamado pela tela de sucesso, depois do envio confirmado */
  window.ehsGravarUltimo = function(){
    var guardar = {};
    UIDS.forEach(function(uid){
      var i = indiceDe(uid);
      if(i < 0) return;
      var c = SCHEMA.campos[i];
      if(c.tipo === 'pessoa'){
        if(pessoas[i]) guardar[uid] = {nome: pessoas[i].nome, matricula: pessoas[i].matricula};
      }else{
        var el = document.getElementById('c' + i);
        if(el && el.value) guardar[uid] = el.value;
      }
    });
    try{ localStorage.setItem(CHAVE, JSON.stringify(guardar)); }catch(e){}
  };

  function travar(i, travado){
    var c = SCHEMA.campos[i];
    if(c.tipo === 'pessoa'){
      var cx = document.getElementById('c' + i);
      if(!cx) return;
      var nome = cx.querySelector('.nome');
      if(nome) nome.disabled = !!travado;
      return;
    }
    var el = document.getElementById('c' + i);
    if(el) el.disabled = !!travado;
  }

  function botaoEditar(i){
    var bloco = document.querySelector('[data-bloco="' + i + '"]');
    if(!bloco || bloco.querySelector('.ehs-edit')) return;
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn ehs-edit';
    b.style.cssText = 'margin-top:8px;font-size:12px;padding:4px 12px';
    b.textContent = 'Editar';
    b.onclick = function(){ travar(i, false); b.remove(); };
    bloco.appendChild(b);
  }

  function aplicar(){
    var guardado = lerGuardado();
    var algum = false;

    UIDS.forEach(function(uid){
      if(!(uid in guardado)) return;
      var i = indiceDe(uid);
      if(i < 0) return;
      var c = SCHEMA.campos[i], v = guardado[uid];

      if(c.tipo === 'pessoa'){
        var cx = document.getElementById('c' + i);
        if(!cx) return;
        var nome = cx.querySelector('.nome'), mat = cx.querySelector('.mat');
        if(nome && nome.value) return;          /* rascunho ja preencheu */
        pessoas[i] = {nome: v.nome, matricula: v.matricula};
        if(nome) nome.value = v.nome;
        if(mat) mat.value = v.matricula;
      }else{
        var el = document.getElementById('c' + i);
        if(!el || el.value) return;             /* rascunho ja preencheu */
        el.value = v;
      }

      travar(i, true);
      botaoEditar(i);
      algum = true;
    });

    if(algum){
      try{ atualizarCondicoes(); }catch(e){}
    }
  }

  /* espera o rascunho (se houver) terminar de aplicar */
  setTimeout(aplicar, 400);
})();
