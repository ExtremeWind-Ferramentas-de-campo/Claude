<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script src="../guard.js"></script>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://script.google.com https://script.googleusercontent.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data: blob:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2b7fd0">
<title>Disponibilidade | Extreme Wind</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --ink:#0e2033; --muted:#4f6273;
    --panel:rgba(255,255,255,.82); --panel-border:rgba(255,255,255,.65);
    --card:#ffffff; --card-line:#e2e8f0;
    --bg-1:#6db3ef; --bg-2:#eaf6ff;
    --cor:#0b6e99; --cor-forte:#08506f;
    --sim:#15803d; --sim-bg:#dcf3e3; --nao:#b3261e; --nao-bg:#fde4e2;
    --ff:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    --shadow:0 18px 50px rgba(9,34,64,.18);
  }
  :root[data-theme="dark"]{
    --ink:#e8eff8; --muted:#9fb2c6;
    --panel:rgba(15,29,48,.74); --panel-border:rgba(120,150,185,.22);
    --card:#0f1d2e; --card-line:#2a3c52;
    --bg-1:#081525; --bg-2:#173251;
    --cor:#4fb3de; --cor-forte:#4fb3de;
    --sim:#5cc088; --sim-bg:#143524; --nao:#f08a80; --nao-bg:#3d1a18;
    --shadow:0 18px 50px rgba(0,0,0,.5);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ink:#e8eff8; --muted:#9fb2c6;
      --panel:rgba(15,29,48,.74); --panel-border:rgba(120,150,185,.22);
      --card:#0f1d2e; --card-line:#2a3c52;
      --bg-1:#081525; --bg-2:#173251;
      --cor:#4fb3de; --cor-forte:#4fb3de;
      --sim:#5cc088; --sim-bg:#143524; --nao:#f08a80; --nao-bg:#3d1a18;
      --shadow:0 18px 50px rgba(0,0,0,.5);
    }
  }
  body{font-family:var(--ff);color:var(--ink);min-height:100vh;
    background:linear-gradient(180deg,var(--bg-1),var(--bg-2));
    display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
  .topo{display:flex;align-items:center;gap:12px;padding:16px 16px 0;max-width:640px;width:100%;margin:0 auto}
  .nav-back-link{width:40px;height:40px;flex-shrink:0;border-radius:12px;display:grid;place-items:center;
    border:1px solid var(--panel-border);background:var(--panel);color:var(--ink);text-decoration:none;
    box-shadow:var(--shadow)}
  .topo h1{flex:1;text-align:center;font-size:clamp(1.3rem,4vw,1.8rem);font-weight:800;letter-spacing:-.5px}
  .espaco{width:40px;flex-shrink:0}
  main{flex:1;width:100%;max-width:640px;margin:0 auto;padding:20px 16px 110px;
    display:flex;flex-direction:column;gap:16px}
  .sessao{text-align:center;font-size:.82rem;color:var(--muted);font-weight:600}
  .painel{background:var(--panel);border:1px solid var(--panel-border);border-radius:24px;
    padding:18px 14px 20px;box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .estado{text-align:center;padding:26px 12px;color:var(--muted);font-weight:600;font-size:.95rem;line-height:1.5}
  .estado i{display:block;font-size:2rem;margin-bottom:12px;color:var(--cor)}
  .estado.erro i{color:#b02a1e}

  .dica{font-size:.85rem;color:var(--muted);font-weight:600;line-height:1.45;margin-bottom:14px}
  .dica b{color:var(--ink)}
  .resumo{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .resumo span{font-size:.74rem;font-weight:800;border-radius:999px;padding:4px 10px;background:var(--card);border:1px solid var(--card-line)}
  .resumo .r-sim{color:var(--sim)} .resumo .r-nao{color:var(--nao)} .resumo .r-vaz{color:var(--muted)}

  .meses{display:flex;flex-direction:column;gap:12px}
  .mes{background:var(--card);border:1px solid var(--card-line);border-left:6px solid var(--card-line);
    border-radius:16px;overflow:hidden;transition:border-color .15s}
  .mes.st-S{border-left-color:var(--sim)} .mes.st-N{border-left-color:var(--nao)} .mes.st-P{border-left-color:#d4a017}
  .mes-topo{display:flex;align-items:center;gap:10px;padding:12px 12px 10px 14px}
  .mes-nome{flex:1;min-width:0}
  .mes-nome strong{display:block;font-size:1.02rem;font-weight:800}
  .mes-nome small{display:block;font-size:.74rem;font-weight:700;color:var(--muted);margin-top:2px}
  .chip{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.3px;border-radius:999px;padding:3px 8px;white-space:nowrap}
  .chip.S{background:var(--sim-bg);color:var(--sim)} .chip.N{background:var(--nao-bg);color:var(--nao)}
  .chip.P{background:#fbf0cf;color:#8a6400} .chip.V{background:var(--card-line);color:var(--muted)}
  .abrir{width:38px;height:38px;flex-shrink:0;border-radius:10px;border:1px solid var(--card-line);background:none;
    color:var(--ink);cursor:pointer;font-size:.9rem}
  .abrir i{transition:transform .2s}
  .mes.aberto .abrir i{transform:rotate(180deg)}

  .seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .mes-acoes{padding:0 12px 12px 14px}
  .op{min-height:44px;border-radius:12px;border:1.5px solid var(--card-line);background:var(--card);color:var(--muted);
    font-family:inherit;font-weight:800;font-size:.86rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
  .op.sim.on{background:var(--sim);border-color:var(--sim);color:#fff}
  .op.nao.on{background:var(--nao);border-color:var(--nao);color:#fff}
  .op:active{filter:brightness(.95)}

  .semanas{border-top:1px dashed var(--card-line);padding:6px 12px 10px 14px;display:flex;flex-direction:column}
  .semanas[hidden]{display:none}
  .sem{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--card-line)}
  .sem:last-child{border-bottom:none}
  .sem-txt{flex:1;min-width:0}
  .sem-txt strong{font-size:.9rem;font-weight:800}
  .sem-txt small{display:block;font-size:.74rem;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
  .sem-txt .atual{font-size:.64rem;font-weight:800;text-transform:uppercase;color:var(--cor-forte);margin-left:6px}
  .sem .seg{grid-template-columns:44px 44px;gap:6px}
  .sem .op{min-height:38px;border-radius:10px;font-size:1.05rem}

  .atualizado{margin-top:16px;text-align:center;font-size:.82rem;color:var(--muted);
    font-weight:600;line-height:1.6;border-top:1px dashed var(--card-line);padding-top:14px}
  .atualizado strong{display:block;font-size:1rem;color:var(--ink);font-weight:800;margin-top:2px}

  .barra{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));
    background:var(--panel);border-top:1px solid var(--panel-border);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .barra-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
  .btn-salvar{width:100%;min-height:50px;border:none;border-radius:14px;cursor:pointer;
    font-family:inherit;font-size:1rem;font-weight:800;color:#fff;background:var(--cor);
    box-shadow:0 6px 18px rgba(9,34,64,.22);display:flex;align-items:center;justify-content:center;gap:8px}
  .btn-salvar:disabled{opacity:.5;cursor:default;box-shadow:none}
  .msg{text-align:center;font-size:.8rem;font-weight:700;color:var(--muted);min-height:1.1em}
  .msg.ok{color:var(--sim)} .msg.erro{color:var(--nao)}
  .nota{font-size:.75rem;color:var(--muted);text-align:center;line-height:1.5}
  footer{text-align:center;color:var(--muted);font-size:.78rem;padding:8px 16px 18px}
  .girando{animation:gira 1s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</head>
<body>

<div class="topo">
  <a class="nav-back-link" id="voltar" href="index.html" title="Voltar"><i class="fas fa-arrow-left"></i></a>
  <h1>Disponibilidade</h1>
  <span class="espaco" aria-hidden="true"></span>
</div>

<main>
  <div class="sessao" id="sessaoNome"></div>

  <section class="painel">
    <div id="conteudo">
      <div class="estado"><i class="fas fa-circle-notch girando"></i>Consultando…</div>
    </div>
    <div class="atualizado" id="blocoData" hidden>
      Última atualização enviada:
      <strong id="dataAtualizacao">—</strong>
    </div>
  </section>

  <p class="nota">Isso ajuda o RH a montar as equipes. Não é garantia de convocação.<br>
    Mudou de ideia? Volte aqui e salve de novo.</p>
</main>

<div class="barra">
  <div class="barra-in">
    <div class="msg" id="msg" aria-live="polite"></div>
    <button type="button" class="btn-salvar" id="btnSalvar" disabled>
      <i class="fas fa-floppy-disk"></i> <span id="rotSalvar">Salvar</span>
    </button>
  </div>
</div>

<footer>Extreme Wind Blade Services &copy; <span id="year"></span> · Uso interno. Realizado por Ryan Neves.</footer>

<script>
'use strict';
document.getElementById('year').textContent = new Date().getFullYear();
(function(){
  var t = localStorage.getItem('ew_theme');
  if(t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
})();

(function(){

/* Mesmo Apps Script do login e do RDO. Se trocar o endereco la, troque aqui. */
const ENDPOINT = "https://script.google.com/macros/s/AKfycbxoOpV339g76UpYa7sO28C6lS99TAz7po2c0dNAk0i1X1HgsyKC_KXIuuBAS7qbBzLG/exec";
const SESSAO_LS_KEY = 'ew_sessao';

const elConteudo = document.getElementById('conteudo');
const elBlocoData = document.getElementById('blocoData');
const elData = document.getElementById('dataAtualizacao');
const btnSalvar = document.getElementById('btnSalvar');
const elMsg = document.getElementById('msg');

let DADOS = null;        /* resposta do servidor (meses, semanas) */
let SALVO = {};          /* o que está no servidor */
let ATUAL = {};          /* o que está na tela */
const ABERTOS = {};      /* meses expandidos */

function sessao(){
  try{
    const s = JSON.parse(localStorage.getItem(SESSAO_LS_KEY) || 'null');
    if(!s || !s.token || !s.exp || s.exp <= Date.now()) return null;
    return s;
  }catch(_){ return null; }
}
const s0 = sessao();
if(s0) document.getElementById('sessaoNome').textContent = s0.nome + ' \u00b7 mat. ' + s0.mat;

function esc(t){ return String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function paraOLogin(){
  try{ localStorage.removeItem(SESSAO_LS_KEY); }catch(_){}
  location.replace('../index.html');
}
function mostrarEstado(ico, html, cls){
  elConteudo.innerHTML = '<div class="estado ' + (cls||'') + '"><i class="fas ' + ico + '"></i>' + html + '</div>';
}
function msg(t, cls){ elMsg.textContent = t || ''; elMsg.className = 'msg ' + (cls||''); }

/* plano B por JSONP, igual ao login: alguns aparelhos nao conseguem ler a resposta do POST */
function pedirJsonp(acao, extra){
  return new Promise(resolve => {
    const cb = '__dispCb' + Date.now();
    let pronto = false;
    window[cb] = j => { pronto = true; resolve(j); try{ delete window[cb]; }catch(_){ window[cb] = null; } };
    let url = ENDPOINT + (ENDPOINT.indexOf('?') >= 0 ? '&' : '?') + 'acao=' + encodeURIComponent(acao) + '&callback=' + cb;
    Object.keys(extra).forEach(k => { url += '&' + k + '=' + encodeURIComponent(extra[k]); });
    const sc = document.createElement('script');
    sc.src = url;
    sc.onerror = () => { if(!pronto) resolve(null); };
    document.head.appendChild(sc);
    setTimeout(() => { if(!pronto) resolve(null); }, 25000);
  });
}
async function chamar(corpo, extraGet){
  let r = null;
  try{
    const res = await fetch(ENDPOINT, { method:'POST', body: JSON.stringify(corpo) });
    r = await res.json();
  }catch(_){ r = null; }
  if(!r) r = await pedirJsonp(corpo.acao, extraGet);
  return r;
}

/* ---------- estado derivado ---------- */
function semanasDoMes(m){ return DADOS.semanas.filter(w => w.mes === m); }
function statusMes(m){
  const v = semanasDoMes(m).map(w => ATUAL[w.chave] || '');
  if(v.every(x => x === 'S')) return 'S';
  if(v.every(x => x === 'N')) return 'N';
  if(v.every(x => x === '')) return 'V';
  return 'P';
}
const ROT = { S:'Disponível', N:'Indisponível', P:'Parcial', V:'Sem resposta' };
function alteracoes(){
  return DADOS.semanas.filter(w => (ATUAL[w.chave]||'') !== (SALVO[w.chave]||'')).length;
}

/* ---------- desenho ---------- */
function desenhar(){
  const meses = DADOS.meses.map(m => {
    const sem = semanasDoMes(m.chave);
    if(!sem.length) return '';
    const st = statusMes(m.chave), aberto = !!ABERTOS[m.chave];
    const linhas = sem.map(w => {
      const v = ATUAL[w.chave] || '';
      return '<div class="sem">'
        + '<div class="sem-txt"><strong>W' + String(w.n).padStart(2,'0') + '</strong>'
        +   (w.atual ? '<span class="atual">esta semana</span>' : '')
        +   '<small>' + esc(w.ini) + ' a ' + esc(w.fim) + '</small></div>'
        + '<div class="seg">'
        +   '<button type="button" class="op sim' + (v==='S'?' on':'') + '" data-sem="' + w.chave + '" data-v="S" aria-pressed="' + (v==='S') + '" aria-label="Posso na W' + w.n + '">\u2713</button>'
        +   '<button type="button" class="op nao' + (v==='N'?' on':'') + '" data-sem="' + w.chave + '" data-v="N" aria-pressed="' + (v==='N') + '" aria-label="N\u00e3o posso na W' + w.n + '">\u2715</button>'
        + '</div></div>';
    }).join('');
    return '<div class="mes st-' + st + (aberto ? ' aberto' : '') + '">'
      + '<div class="mes-topo">'
      +   '<div class="mes-nome"><strong>' + esc(m.rotulo) + '</strong><small>' + sem.length + ' semana' + (sem.length>1?'s':'')
      +     ' \u00b7 W' + String(sem[0].n).padStart(2,'0') + (sem.length>1 ? ' a W' + String(sem[sem.length-1].n).padStart(2,'0') : '') + '</small></div>'
      +   '<span class="chip ' + st + '">' + ROT[st] + '</span>'
      +   '<button type="button" class="abrir" data-abrir="' + m.chave + '" aria-expanded="' + aberto + '" title="Escolher por semana"><i class="fas fa-chevron-down"></i></button>'
      + '</div>'
      + '<div class="mes-acoes"><div class="seg">'
      +   '<button type="button" class="op sim' + (st==='S'?' on':'') + '" data-mes="' + m.chave + '" data-v="S"><i class="fas fa-check"></i> Posso</button>'
      +   '<button type="button" class="op nao' + (st==='N'?' on':'') + '" data-mes="' + m.chave + '" data-v="N"><i class="fas fa-xmark"></i> N\u00e3o posso</button>'
      + '</div></div>'
      + '<div class="semanas"' + (aberto ? '' : ' hidden') + '>' + linhas + '</div>'
      + '</div>';
  }).join('');

  const v = DADOS.semanas.map(w => ATUAL[w.chave] || '');
  const nS = v.filter(x => x==='S').length, nN = v.filter(x => x==='N').length, nV = v.length - nS - nN;
  elConteudo.innerHTML =
      '<p class="dica">Marque se voc\u00ea <b>pode</b> ou <b>n\u00e3o pode</b> ser convocado em cada m\u00eas. '
    + 'Quer ser mais espec\u00edfico? Toque na <i class="fas fa-chevron-down"></i> e escolha semana a semana. '
    + 'Tocar de novo na op\u00e7\u00e3o marcada desmarca.</p>'
    + '<div class="resumo"><span class="r-sim">' + nS + ' posso</span><span class="r-nao">' + nN + ' n\u00e3o posso</span>'
    + (nV ? '<span class="r-vaz">' + nV + ' sem resposta</span>' : '') + '</div>'
    + '<div class="meses">' + meses + '</div>';

  btnSalvar.disabled = alteracoes() === 0;
  rotular();
}

elConteudo.addEventListener('click', e => {
  const ab = e.target.closest('[data-abrir]');
  if(ab){ const k = ab.getAttribute('data-abrir'); ABERTOS[k] = !ABERTOS[k]; desenhar(); return; }

  const bm = e.target.closest('[data-mes]');
  if(bm){
    const m = bm.getAttribute('data-mes'), v = bm.getAttribute('data-v');
    const limpar = statusMes(m) === v;          /* tocou no que já estava marcado */
    semanasDoMes(m).forEach(w => { if(limpar) delete ATUAL[w.chave]; else ATUAL[w.chave] = v; });
    msg(''); desenhar(); return;
  }
  const bs = e.target.closest('[data-sem]');
  if(bs){
    const k = bs.getAttribute('data-sem'), v = bs.getAttribute('data-v');
    if(ATUAL[k] === v) delete ATUAL[k]; else ATUAL[k] = v;
    msg(''); desenhar();
  }
});

function aplicar(r){
  DADOS = r;
  SALVO = Object.assign({}, r.valores || {});
  ATUAL = Object.assign({}, SALVO);
  if(r.atualizadoEm){ elData.textContent = r.atualizadoEm; elBlocoData.hidden = false; }
  else elBlocoData.hidden = true;
  desenhar();
}

function tratarFalha(r, acao){
  if(!r){ return { ico:'fa-wifi', txt:'Sem conex\u00e3o com o servidor. ' + (acao==='salvar' ? 'Suas marca\u00e7\u00f5es continuam na tela \u2014 conecte e toque em Salvar.' : 'Conecte e abra de novo.') }; }
  if(r.sessao === false){ setTimeout(paraOLogin, 2200); return { ico:'fa-right-to-bracket', txt:(r.erro || 'Sess\u00e3o expirada.') + ' Voltando para a tela de entrada\u2026' }; }
  return { ico:'fa-triangle-exclamation', txt: r.erro || 'N\u00e3o foi poss\u00edvel agora.' };
}

async function consultar(){
  const ss = sessao();
  if(!ss){ paraOLogin(); return; }
  mostrarEstado('fa-circle-notch girando', 'Consultando\u2026');
  const r = await chamar({ acao:'disponibilidade', token: ss.token }, { token: ss.token });
  if(!r || !r.ok){
    const f = tratarFalha(r, 'consultar');
    mostrarEstado(f.ico, esc(f.txt), 'erro');
    return;
  }
  aplicar(r);
}

async function salvar(){
  const ss = sessao();
  if(!ss){ paraOLogin(); return; }
  const valores = {};
  DADOS.semanas.forEach(w => { if(ATUAL[w.chave]) valores[w.chave] = ATUAL[w.chave]; });
  btnSalvar.disabled = true;
  btnSalvar.innerHTML = '<i class="fas fa-circle-notch girando"></i> Salvando\u2026';
  msg('');
  const r = await chamar({ acao:'salvarDisponibilidade', token: ss.token, valores: valores },
                         { token: ss.token, v: JSON.stringify(valores) });
  btnSalvar.innerHTML = '<i class="fas fa-floppy-disk"></i> <span id="rotSalvar">Salvar</span>';
  if(!r || !r.ok){
    const f = tratarFalha(r, 'salvar');
    msg(f.txt, 'erro');
    btnSalvar.disabled = false;
    rotular();
    return;
  }
  const abertos = Object.assign({}, ABERTOS);
  aplicar(r);
  Object.assign(ABERTOS, abertos);
  msg('Salvo! Em at\u00e9 5 minutos aparece na planilha do RH.', 'ok');
}
function rotular(){
  const el = document.getElementById('rotSalvar'), n = DADOS ? alteracoes() : 0;
  if(el) el.textContent = n ? 'Salvar (' + n + (n>1 ? ' altera\u00e7\u00f5es' : ' altera\u00e7\u00e3o') + ')' : 'Salvar';
}
btnSalvar.addEventListener('click', salvar);

/* não perder marcação sem salvar */
function temPendente(){ return DADOS && alteracoes() > 0; }
window.addEventListener('beforeunload', e => { if(temPendente()){ e.preventDefault(); e.returnValue = ''; } });
document.getElementById('voltar').addEventListener('click', e => {
  if(temPendente() && !confirm('Voc\u00ea tem altera\u00e7\u00f5es n\u00e3o salvas. Sair mesmo assim?')) e.preventDefault();
});

consultar();

})();
</script>
</body>
</html>
