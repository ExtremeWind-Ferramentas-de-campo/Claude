<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script src="../guard.js"></script>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://script.google.com https://script.googleusercontent.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data: blob:; connect-src 'self' https://script.google.com https://script.googleusercontent.com; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2b7fd0">
<title>Contracheque-Operacional | Extreme Wind</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --ink:#0e2033; --muted:#4f6273;
    --panel:rgba(255,255,255,.82); --panel-border:rgba(255,255,255,.65);
    --card:#ffffff; --card-line:#e2e8f0;
    --bg-1:#6db3ef; --bg-2:#eaf6ff;
    --cor:#3b5bdb; --cor-forte:#2a43a8;
    --ff:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    --shadow:0 18px 50px rgba(9,34,64,.18);
  }
  :root[data-theme="dark"]{
    --ink:#e8eff8; --muted:#9fb2c6;
    --panel:rgba(15,29,48,.74); --panel-border:rgba(120,150,185,.22);
    --card:#0f1d2e; --card-line:#2a3c52;
    --bg-1:#081525; --bg-2:#173251;
    --cor:#8ea2ff; --cor-forte:#8ea2ff;
    --shadow:0 18px 50px rgba(0,0,0,.5);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ink:#e8eff8; --muted:#9fb2c6;
      --panel:rgba(15,29,48,.74); --panel-border:rgba(120,150,185,.22);
      --card:#0f1d2e; --card-line:#2a3c52;
      --bg-1:#081525; --bg-2:#173251;
      --cor:#8ea2ff; --cor-forte:#8ea2ff;
      --shadow:0 18px 50px rgba(0,0,0,.5);
    }
  }
  body{font-family:var(--ff);color:var(--ink);min-height:100vh;
    background:linear-gradient(180deg,var(--bg-1),var(--bg-2));
    display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
  .topo{display:flex;align-items:center;gap:12px;padding:16px 16px 0;max-width:640px;width:100%;margin:0 auto}
  .nav-back-link{width:40px;height:40px;flex-shrink:0;border-radius:12px;display:grid;place-items:center;
    border:1px solid var(--panel-border);background:var(--panel);color:var(--ink);text-decoration:none;
    box-shadow:var(--shadow)}
  .topo h1{flex:1;text-align:center;font-size:clamp(1.25rem,4vw,1.8rem);font-weight:800;letter-spacing:-.5px}
  .espaco{width:40px;flex-shrink:0}
  main{flex:1;width:100%;max-width:640px;margin:0 auto;padding:20px 16px 24px;
    display:flex;flex-direction:column;gap:16px}
  .sessao{text-align:center;font-size:.82rem;color:var(--muted);font-weight:600}

  .painel{background:var(--panel);border:1px solid var(--panel-border);border-radius:24px;
    padding:18px 14px 20px;box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

  .estado{text-align:center;padding:26px 12px;color:var(--muted);font-weight:600;font-size:.95rem;line-height:1.55}
  .estado i{display:block;font-size:2rem;margin-bottom:12px;color:var(--cor)}
  .estado.erro i{color:#b02a1e}
  .estado.vazio i{color:var(--muted)}
  .estado b{color:var(--ink)}

  .tec{display:flex;align-items:center;gap:12px;padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--card-line)}
  .tec-av{width:46px;height:46px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;
    background:var(--cor);color:#fff;font-weight:800;font-size:1rem;letter-spacing:.5px}
  .tec-nome{font-weight:800;font-size:.98rem;line-height:1.25}
  .tec-mat{font-size:.8rem;color:var(--muted);font-weight:600;margin-top:2px}

  .cc{background:var(--card);border:1px solid var(--card-line);border-top:5px solid var(--cor);
    border-radius:18px;padding:22px 16px 18px;text-align:center}
  .cc-ico{width:64px;height:64px;border-radius:18px;margin:0 auto 12px;display:grid;place-items:center;
    color:#fff;font-size:1.7rem;background:linear-gradient(135deg,var(--cor),color-mix(in srgb,var(--cor) 60%,#fff))}
  .cc-ref{font-size:.85rem;font-weight:700;color:var(--muted)}
  .cc-mes{font-size:1.35rem;font-weight:800;color:var(--cor-forte);margin:2px 0 10px;line-height:1.2}
  .cc-post{font-size:.88rem;font-weight:600;color:var(--muted);margin-bottom:18px}
  .cc-post b{color:var(--ink)}
  .cc-btn{width:100%;min-height:50px;border:none;border-radius:14px;cursor:pointer;
    font-family:inherit;font-size:1rem;font-weight:800;color:#fff;background:var(--cor);
    box-shadow:0 6px 18px rgba(9,34,64,.22);display:flex;align-items:center;justify-content:center;gap:8px}
  .cc-btn:active{filter:brightness(.94)}
  .cc-btn:disabled{opacity:.6;cursor:default}
  .cc-msg{margin-top:10px;font-size:.82rem;font-weight:600;color:var(--muted);min-height:1.2em}
  .cc-msg a{color:var(--cor-forte);font-weight:800}

  .btn-recarregar{width:100%;min-height:48px;border:1px solid var(--panel-border);border-radius:14px;cursor:pointer;
    font-family:inherit;font-size:.95rem;font-weight:800;color:var(--ink);background:var(--panel);
    box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;gap:8px}
  .btn-recarregar:disabled{opacity:.6;cursor:default}
  .nota{font-size:.75rem;color:var(--muted);text-align:center;line-height:1.5}
  footer{text-align:center;color:var(--muted);font-size:.78rem;padding:8px 16px 18px}
  .girando{animation:gira 1s linear infinite}
  @keyframes gira{to{transform:rotate(360deg)}}
  @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
</style>
</head>
<body>

<div class="topo">
  <a class="nav-back-link" href="index.html" title="Voltar"><i class="fas fa-arrow-left"></i></a>
  <h1>Contracheque-Operacional</h1>
  <span class="espaco" aria-hidden="true"></span>
</div>

<main>
  <div class="sessao" id="sessaoNome"></div>

  <section class="painel">
    <div id="conteudo">
      <div class="estado"><i class="fas fa-circle-notch girando"></i>Consultando…</div>
    </div>
  </section>

  <button type="button" class="btn-recarregar" id="btnRecarregar">
    <i class="fas fa-rotate"></i> Atualizar
  </button>

  <p class="nota">O contracheque é pessoal: só aparece para a sua matrícula.</p>
</main>

<footer>Extreme Wind Blade Services &copy; <span id="year"></span> · Uso interno. Realizado por Ryan Neves.</footer>

<script>
'use strict';
document.getElementById('year').textContent = new Date().getFullYear();

(function(){
  var t = localStorage.getItem('ew_theme');
  if(t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
})();

(function(){

/* Mesmo Apps Script do login e do RDO. Se trocar o endereco la, troque aqui. */
const ENDPOINT = "https://script.google.com/macros/s/AKfycbxoOpV339g76UpYa7sO28C6lS99TAz7po2c0dNAk0i1X1HgsyKC_KXIuuBAS7qbBzLG/exec";
const SESSAO_LS_KEY = 'ew_sessao';

const elConteudo = document.getElementById('conteudo');
const btnRecarregar = document.getElementById('btnRecarregar');

function sessao(){
  try{
    const s = JSON.parse(localStorage.getItem(SESSAO_LS_KEY) || 'null');
    if(!s || !s.token || !s.exp || s.exp <= Date.now()) return null;
    return s;
  }catch(_){ return null; }
}
const s = sessao();
if(s) document.getElementById('sessaoNome').textContent = s.nome + ' · mat. ' + s.mat;

function paraOLogin(){
  try{ localStorage.removeItem(SESSAO_LS_KEY); }catch(_){}
  location.replace('../index.html');
}

function esc(t){
  return String(t==null?'':t).replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function iniciais(nome){
  const p = String(nome||'').trim().split(/\s+/).filter(Boolean);
  return ((p[0]||'')[0]||'') + (p.length > 1 ? (p[p.length-1][0]||'') : '');
}

/* JSONP: plano B quando o navegador não deixa ler a resposta do POST */
function pedirJsonp(acao, token){
  return new Promise(resolve=>{
    const cb = '__ccCb' + Date.now() + Math.floor(Math.random()*1000);
    let pronto = false;
    window[cb] = j => { pronto = true; resolve(j); try{ delete window[cb]; }catch(_){ window[cb]=null; } };
    const sc = document.createElement('script');
    sc.src = ENDPOINT + (ENDPOINT.indexOf('?')>=0?'&':'?')
           + 'acao=' + acao + '&token=' + encodeURIComponent(token) + '&callback=' + cb;
    sc.onerror = ()=>{ if(!pronto) resolve(null); };
    document.head.appendChild(sc);
    setTimeout(()=>{ if(!pronto) resolve(null); }, 45000);
  });
}
async function pedir(acao, token){
  let r = null;
  try{
    const res = await fetch(ENDPOINT, { method:'POST', body: JSON.stringify({acao: acao, token: token}) });
    r = await res.json();
  }catch(_){ r = null; }
  return r || await pedirJsonp(acao, token);
}

function mostrarEstado(icone, texto, classe){
  elConteudo.innerHTML = '<div class="estado ' + (classe||'') + '">'
    + '<i class="fas ' + icone + '"></i>' + texto + '</div>';
}

function cabecalho(r){
  return '<div class="tec"><div class="tec-av">' + esc(iniciais(r.nome)) + '</div>'
    + '<div><div class="tec-nome">' + esc(r.nome) + '</div><div class="tec-mat">Matrícula ' + esc(r.mat) + '</div></div></div>';
}

function mostrar(r){
  if(!r.encontrado){
    elConteudo.innerHTML = cabecalho(r)
      + '<div class="estado vazio"><i class="fas fa-file-circle-xmark"></i>'
      + 'Não há contracheque seu no mês vigente'
      + (r.mes ? ' (<b>' + esc(r.mes) + '</b>)' : '') + '.</div>';
    return;
  }
  elConteudo.innerHTML = cabecalho(r)
    + '<div class="cc">'
    +   '<div class="cc-ico"><i class="fas fa-money-check-dollar"></i></div>'
    +   '<div class="cc-ref">Contracheque referente ao mês de</div>'
    +   '<div class="cc-mes">' + esc(r.mes) + '</div>'
    +   '<div class="cc-post">Postado dia <b>' + esc(r.postadoEm || '—') + '</b></div>'
    +   '<button type="button" class="cc-btn" id="ccBaixar"><i class="fas fa-file-arrow-down"></i> Baixar PDF</button>'
    +   '<div class="cc-msg" id="ccMsg" aria-live="polite"></div>'
    + '</div>';
}

async function baixar(botao){
  const ss = sessao();
  if(!ss){ paraOLogin(); return; }
  const msg = document.getElementById('ccMsg');
  /* abre a aba já no toque (senão o celular bloqueia a janela) e aponta para o PDF depois */
  let janela = null;
  try{ janela = window.open('', '_blank'); }catch(_){ janela = null; }
  if(janela){ try{ janela.document.write('<p style="font-family:sans-serif;padding:24px">Abrindo o contracheque…</p>'); }catch(_){} }
  botao.disabled = true; msg.textContent = 'Abrindo…';

  const r = await pedir('contrachequeLink', ss.token);
  botao.disabled = false;
  if(r && r.sessao === false){ if(janela) try{ janela.close(); }catch(_){} paraOLogin(); return; }
  if(!r || !r.ok || !r.url){
    if(janela) try{ janela.close(); }catch(_){}
    msg.textContent = (r && r.erro) || 'Não foi possível abrir o contracheque agora. Confira a internet e tente de novo.';
    return;
  }
  if(janela && !janela.closed){ janela.location.href = r.url; msg.textContent = 'PDF aberto em outra aba.'; }
  else { msg.innerHTML = '<a href="' + esc(r.url) + '" target="_blank" rel="noopener">Toque aqui para abrir o PDF</a>'; }
}

elConteudo.addEventListener('click', e => {
  const b = e.target.closest('#ccBaixar');
  if(b) baixar(b);
});

async function consultar(){
  const ss = sessao();
  if(!ss){ paraOLogin(); return; }
  btnRecarregar.disabled = true;
  btnRecarregar.innerHTML = '<i class="fas fa-circle-notch girando"></i> Consultando…';
  mostrarEstado('fa-circle-notch girando', 'Consultando…');

  const r = await pedir('contracheque', ss.token);

  btnRecarregar.disabled = false;
  btnRecarregar.innerHTML = '<i class="fas fa-rotate"></i> Atualizar';

  if(!r){
    mostrarEstado('fa-wifi', 'Sem conexão com o servidor.<br>Esta consulta precisa de internet — '
      + 'conecte e toque em <b>Atualizar</b>.', 'erro');
    return;
  }
  if(r.sessao === false){
    mostrarEstado('fa-right-to-bracket', esc(r.erro || 'Sessão expirada.') + '<br>Voltando para a tela de entrada…', 'erro');
    setTimeout(paraOLogin, 2200);
    return;
  }
  if(!r.ok){
    mostrarEstado('fa-triangle-exclamation', esc(r.erro || 'Não foi possível consultar agora.'), 'erro');
    return;
  }
  mostrar(r);
}

btnRecarregar.addEventListener('click', consultar);
consultar();

})();
</script>
<script>
/* PWA — mesmo service worker do site */
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('../sw.js').catch(function(){});});}
</script>
</body>
</html>
