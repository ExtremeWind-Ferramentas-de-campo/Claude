<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' data: blob:; connect-src 'self' https://ew-dropbox-proxy.ew-fotos.workers.dev; object-src 'none'; base-uri 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Extreme Wind — Checklist de materiais por cliente (Nordex, GE, Siemens)">
<meta name="theme-color" content="#c26a12">
<title>Extreme Wind | Checklist de Materiais</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EW Checklist">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --ink:#0e2033; --muted:#4f6273;
    --panel:rgba(255,255,255,.86); --panel-border:rgba(255,255,255,.65);
    --card:#ffffff; --card-line:#e2e8f0; --field:#ffffff; --field-line:#d5dee8;
    --accent:#c26a12; --accent-soft:#f6e3cf;
    --sky-1:#6db3ef; --sky-2:#eaf6ff;
    --hill-1:#bfe3b5; --hill-2:#a1d597; --hill-3:#83c67b;
    --turbine:#f9fdff; --turbine-edge:#c7d8ea; --tower:#eef5fb;
    --sun:#ffd76a; --sun-glow:rgba(255,215,106,.55);
    --cloud:rgba(255,255,255,.9); --star:transparent;
    --ff:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    --shadow:0 18px 50px rgba(9,34,64,.18);
  }
  :root[data-theme="dark"]{
    --ink:#e8eff8; --muted:#9fb2c6;
    --panel:rgba(15,29,48,.80); --panel-border:rgba(120,150,185,.22);
    --card:#0f1d2e; --card-line:#2a3c52; --field:#0c1826; --field-line:#2a3c52;
    --accent:#f0923a; --accent-soft:#3a2a17;
    --sky-1:#081525; --sky-2:#173251;
    --hill-1:#123049; --hill-2:#0d2439; --hill-3:#081a2b;
    --turbine:#a9bccf; --turbine-edge:#6d859c; --tower:#93a8bf;
    --sun:#dde8f6; --sun-glow:rgba(221,232,246,.28);
    --cloud:transparent; --star:#dfeaff;
    --shadow:0 18px 50px rgba(0,0,0,.5);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ink:#e8eff8; --muted:#9fb2c6;
      --panel:rgba(15,29,48,.80); --panel-border:rgba(120,150,185,.22);
      --card:#0f1d2e; --card-line:#2a3c52; --field:#0c1826; --field-line:#2a3c52;
      --accent:#f0923a; --accent-soft:#3a2a17;
      --sky-1:#081525; --sky-2:#173251;
      --hill-1:#123049; --hill-2:#0d2439; --hill-3:#081a2b;
      --turbine:#a9bccf; --turbine-edge:#6d859c; --tower:#93a8bf;
      --sun:#dde8f6; --sun-glow:rgba(221,232,246,.28);
      --cloud:transparent; --star:#dfeaff;
      --shadow:0 18px 50px rgba(0,0,0,.5);
    }
  }
  html{overflow-x:hidden}
  body{font-family:var(--ff);color:var(--ink);min-height:100vh;position:relative;overflow-x:hidden;
    display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}

  .scene{position:fixed;inset:0;z-index:-1}
  .scene svg{width:100%;height:100%;display:block}
  .sky-1{stop-color:var(--sky-1)} .sky-2{stop-color:var(--sky-2)}
  .hill-1{fill:var(--hill-1)} .hill-2{fill:var(--hill-2)} .hill-3{fill:var(--hill-3)}
  .blade{fill:var(--turbine);stroke:var(--turbine-edge);stroke-width:.6}
  .nacelle{fill:var(--turbine);stroke:var(--turbine-edge);stroke-width:.6}
  .hub{fill:var(--turbine-edge)}
  .tower{fill:var(--tower);stroke:var(--turbine-edge);stroke-width:.4}
  .sun{fill:var(--sun)} .sun-glow{fill:var(--sun-glow)}
  .cloud{fill:var(--cloud)} .star{fill:var(--star)}

  .theme-btn{position:fixed;top:14px;right:14px;z-index:20;width:42px;height:42px;border-radius:50%;
    border:1px solid var(--panel-border);cursor:pointer;background:var(--panel);color:var(--ink);font-size:1.05rem;
    box-shadow:var(--shadow);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .theme-btn:hover{filter:brightness(1.05)}
  .nav-back-link{position:fixed;top:14px;left:14px;z-index:20;width:42px;height:42px;border-radius:50%;
    border:1px solid var(--panel-border);cursor:pointer;background:var(--panel);color:var(--ink);
    display:grid;place-items:center;font-size:1.05rem;text-decoration:none;
    box-shadow:var(--shadow);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
  .nav-back-link:hover{filter:brightness(1.05)}

  .wrap{flex:1;width:100%;max-width:760px;margin:0 auto;padding:26px 14px 40px;
    display:flex;flex-direction:column;align-items:center;gap:16px}
  .brand-pill{background:#fff;border-radius:16px;padding:10px 18px;box-shadow:var(--shadow)}
  .brand-pill img{height:40px;width:auto;display:block}
  .brand-fallback{font-weight:800;letter-spacing:.5px;font-size:1.3rem;color:#004aad}
  h1{font-size:clamp(1.35rem,4vw,1.9rem);font-weight:800;letter-spacing:-.5px;line-height:1.15;text-align:center;
    text-shadow:0 1px 12px rgba(255,255,255,.35)}
  :root[data-theme="dark"] h1{text-shadow:0 1px 14px rgba(0,0,0,.5)}
  .subtitle{font-size:.95rem;color:var(--muted);font-weight:600;margin-top:-6px;text-align:center}

  .panel{width:100%;background:var(--panel);border:1px solid var(--panel-border);border-radius:22px;
    padding:20px 18px 22px;box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .panel + .panel{margin-top:2px}

  /* Seletor de cliente */
  .oem-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  /* Só a logo — sem o nome do cliente ao lado (o título fica no atributo title/aria-label) */
  .oem-tab{background:var(--card);border:1px solid var(--card-line);border-top:4px solid var(--c,#999);
    border-radius:14px;padding:14px 10px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    min-height:74px;transition:transform .15s ease,box-shadow .15s ease;box-shadow:0 4px 12px rgba(9,34,64,.08)}
  .oem-tab:hover{transform:translateY(-3px)}
  .oem-tab img{height:42px;max-width:100%;object-fit:contain}
  /* span só aparece como fallback se a imagem da logo não carregar */
  .oem-tab span{font-size:.95rem;font-weight:800;letter-spacing:.3px}
  .oem-tab.on{outline:2px solid var(--c,#999);outline-offset:1px;box-shadow:0 8px 22px rgba(9,34,64,.18)}

  /* Identificação */
  .idgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
  .idgrid .full{grid-column:1/-1}
  label.lbl{display:block;font-size:.72rem;color:var(--muted);font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px}
  input,select{width:100%;padding:9px 11px;background:var(--field);border:1px solid var(--field-line);border-radius:9px;
    color:var(--ink);font-size:.92rem;font-family:inherit;outline:none}
  input:focus,select:focus{border-color:var(--accent)}

  /* Modo do registro: contagem de estoque (laranja) vs entrada de material (azul) */
  .modo-wrap{margin-bottom:14px}
  .modo-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .modo-tab{display:flex;align-items:center;justify-content:center;gap:8px;padding:11px 10px;
    background:var(--card);border:1px solid var(--card-line);border-radius:11px;cursor:pointer;
    font-family:inherit;font-size:.84rem;font-weight:700;color:var(--muted);
    -webkit-tap-highlight-color:transparent;transition:background .15s,border-color .15s,color .15s}
  .modo-tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
  #modo-entrada.on{background:#1f6feb;border-color:#1f6feb}
  /* Modo desligado: continua na tela, apagado, para o técnico saber que a
     função existe e está desativada — e não achar que sumiu do app. */
  .modo-tab[disabled]{opacity:.45;cursor:not-allowed;filter:saturate(.3)}
  .modo-tab[disabled]:hover{background:transparent;border-color:var(--line)}
  .modo-tab .selo-off{font-size:.62rem;font-weight:800;letter-spacing:.4px;text-transform:uppercase;
    border:1px solid currentColor;border-radius:999px;padding:1px 6px;opacity:.85}
  .modo-hint{font-size:.78rem;color:var(--muted);margin-top:7px;text-align:center;line-height:1.35}
  /* Em modo ENTRADA a lista ganha um contorno azul, para não confundir com contagem */
  .items.entrada .item.filled{border-color:#1f6feb;background:color-mix(in srgb,#1f6feb 8%,var(--card))}
  .count-pill.entrada{color:#1f6feb;background:rgba(31,111,235,.12)}

  /* Barra de ferramentas da lista */
  .toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .search{flex:1;min-width:150px;position:relative}
  .search i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:.85rem}
  .search input{padding-left:32px}
  .filter-chip{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);font-weight:600;
    background:var(--card);border:1px solid var(--card-line);border-radius:20px;padding:7px 12px;cursor:pointer;white-space:nowrap}
  .filter-chip input{width:auto;margin:0}

  .count-pill{font-size:.78rem;font-weight:700;color:var(--accent);background:var(--accent-soft);
    border-radius:20px;padding:4px 12px;margin-left:auto}

  /* Lista de itens */
  .items{display:flex;flex-direction:column;gap:6px;max-height:none}
  .item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:11px;
    background:var(--card);border:1px solid var(--card-line);transition:border-color .15s;flex-wrap:wrap}
  .item.filled{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--card))}
  .item .name{flex:1;font-size:.86rem;font-weight:600;line-height:1.25}
  .item .num{width:74px;flex-shrink:0}
  .item .num input{padding:8px 8px;text-align:center;font-weight:700}
  .item .unit{width:78px;flex-shrink:0}
  .item .unit select{padding:8px 6px;font-size:.82rem}
  .hidden{display:none!important}

  /* ── Lote e validade (só material perecível, só no modo ENTRADA) ──
     Segunda linha dentro do .item (flex-wrap acima é o que permite).
     Some no modo estoque porque ali não entra material novo. */
  .item .lote{flex-basis:100%;display:none;gap:8px;align-items:flex-end;
    padding-top:8px;margin-top:2px;border-top:1px dashed var(--card-line)}
  .items.entrada .item .lote{display:flex}
  .item .lote .campo{display:flex;flex-direction:column;gap:3px}
  .item .lote .campo.l{flex:1.15}
  .item .lote .campo.v{flex:1}
  .item .lote label{font-size:.66rem;color:var(--muted);font-weight:700;letter-spacing:.3px}
  .item .lote input{padding:7px 8px;font-size:.8rem}
  .item .lote input.falta{border-color:var(--amber)}

  /* Unidade virou rótulo: ela vem da planilha, não é escolha de campo. */
  .item .unit-fix{width:48px;flex-shrink:0;text-align:center;font-size:.76rem;font-weight:800;
    color:var(--muted);background:color-mix(in srgb,var(--muted) 14%,transparent);
    border-radius:8px;padding:7px 0;letter-spacing:.2px}

  /* Terceira linha do item: foto do químico (só nos químicos) */
  .item .foto{flex-basis:100%;display:none;gap:9px;align-items:center;
    padding-top:8px;margin-top:2px;border-top:1px dashed var(--card-line)}
  .item[data-quim="1"] .foto{display:flex}
  .item .foto input[type=file]{display:none}
  .item .foto .fbtn{display:inline-flex;align-items:center;gap:7px;cursor:pointer;
    font-size:.75rem;font-weight:700;padding:7px 11px;border-radius:9px;
    border:1px solid var(--card-line);color:var(--muted);background:transparent}
  .item .foto .fbtn.pede{border-color:var(--amber);color:var(--amber)}
  .item .foto .fbtn.tem{border-color:#1d7a4b;color:#1d7a4b}
  .item .foto img{height:46px;width:46px;object-fit:cover;border-radius:8px;
    border:1px solid var(--card-line);display:none}
  .item .foto img.on{display:block}
  .item .foto .fdel{display:none;cursor:pointer;border:none;background:transparent;
    color:var(--muted);font-size:.95rem;padding:4px 6px}
  .item .foto .fdel.on{display:inline-block}

  /* ── Materiais fora da lista ── */
  .extras{border:1px solid var(--line);border-radius:13px;padding:11px 12px;margin-bottom:10px;background:var(--card)}
  .extras-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .extras-tit{font-size:.86rem;font-weight:700;flex:1;min-width:190px}
  .simnao{display:flex;gap:6px;flex:0 0 auto}
  .simnao .sn{border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer;
    border-radius:999px;padding:5px 15px;font-size:.8rem;font-weight:700;font-family:inherit}
  .simnao .sn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .extras-corpo{display:none;margin-top:11px}
  .extras.aberto .extras-corpo{display:block}
  .extras-hint{font-size:.76rem;color:var(--muted);margin:0 0 9px;line-height:1.45}
  .extra-linha{display:grid;grid-template-columns:1fr 92px 74px 34px;gap:7px;margin-bottom:7px;align-items:center}
  .extra-linha input,.extra-linha select{width:100%;border:1px solid var(--line);border-radius:9px;
    padding:8px 9px;background:var(--bg);color:var(--ink);font-family:inherit;font-size:.84rem}
  .extra-linha input.falta{border-color:var(--amber)}
  .extra-linha .xdel{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:.9rem;padding:6px}
  .extra-linha .xdel:hover{color:#d1495b}
  .extras-add{width:100%;margin-top:2px}
  @media(max-width:560px){
    .extra-linha{grid-template-columns:1fr 74px 66px 30px;gap:5px}
    .extra-linha input,.extra-linha select{padding:7px;font-size:.8rem}
  }

  /* O que ainda falta para liberar o envio */
  .pend{font-size:.78rem;line-height:1.5;color:var(--muted);border-radius:11px;padding:10px 12px;margin-bottom:10px;
    background:color-mix(in srgb,var(--amber) 12%,transparent);
    border:1px solid color-mix(in srgb,var(--amber) 45%,transparent)}
  .pend.ok{background:color-mix(in srgb,#1d7a4b 12%,transparent);
    border-color:color-mix(in srgb,#1d7a4b 45%,transparent)}
  .pend b{color:var(--ink)}
  .btn[disabled]{opacity:.42;cursor:not-allowed;filter:saturate(.35)}
  .val-tag{font-size:.66rem;font-weight:800;padding:3px 7px;border-radius:20px;white-space:nowrap;
    align-self:center;margin-bottom:2px}
  .val-tag.vencido{background:color-mix(in srgb,#d1495b 22%,transparent);color:#ff8fa0}
  .val-tag.proximo{background:color-mix(in srgb,#e3a008 22%,transparent);color:#ffcc57}
  .val-tag.ok{background:color-mix(in srgb,#3fb950 20%,transparent);color:#6ee787}
  @media print{ .items.entrada .item .lote{display:flex} .item .lote input{border:1px solid #999;color:#000} }

  .btnrow{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border:none;border-radius:11px;
    font-weight:700;font-size:.88rem;cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-ghost{background:var(--card);color:var(--ink);border:1px solid var(--card-line)}
  .btn-danger{background:transparent;color:#d1495b;border:1px solid #d1495b55}
  .btn.full{grid-column:1/-1}

  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
    background:#0e2033;color:#fff;padding:11px 20px;border-radius:12px;font-size:.86rem;font-weight:600;
    box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:60;transition:all .25s;pointer-events:none;max-width:90vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.success{background:#1a7a4c} #toast.error{background:#b5384a}

  footer{text-align:center;color:var(--muted);font-size:.78rem;padding:18px 16px 8px;
    text-shadow:0 1px 8px rgba(255,255,255,.3)}
  :root[data-theme="dark"] footer{text-shadow:0 1px 10px rgba(0,0,0,.5)}

  @media(max-width:640px){
    .wrap{padding:16px 10px 32px}
    .panel{padding:16px 14px 18px;border-radius:18px}
    .brand-pill img{height:34px}
    .oem-tabs{grid-template-columns:1fr;gap:8px}
    .oem-tab{padding:12px 16px;min-height:64px}
    .oem-tab img{height:44px;max-height:44px}
    .idgrid{grid-template-columns:1fr}
    .btnrow{grid-template-columns:1fr}
    .item .num{width:66px} .item .unit{width:70px}
  }

  /* Impressão */
  @media print{
    .scene,.theme-btn,.nav-back-link,.toolbar,.btnrow,.oem-tabs,footer,#toast,.brand-pill{display:none!important}
    body{background:#fff;color:#000} .panel{box-shadow:none;border:none;background:#fff;padding:0}
    .item{border:none;border-bottom:1px solid #ccc;border-radius:0;background:#fff!important;page-break-inside:avoid}
    .item.hidden{display:flex!important}
    .item .num input{border:1px solid #999;background:#fff;color:#000}
    .item .unit-fix{background:#fff;color:#000}
  }
</style>
<script src="../guard.js"></script>
<script src="../prazos.js" defer></script>
</head>
<body>

<div class="scene" aria-hidden="true">
  <svg viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="sky-1"/><stop offset="1" class="sky-2"/></linearGradient>
      <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" class="sun-glow"/><stop offset="1" stop-color="transparent"/></radialGradient>
      <path id="blade" class="blade" d="M0 0 C 6 -44 4 -98 1.4 -124 C 0.6 -129 -0.6 -129 -1.4 -124 C -3 -98 -6 -44 0 0 Z"/>
      <g id="turbine">
        <path class="tower" d="M -3.2 4 L 3.2 4 L 9 262 L -9 262 Z"/>
        <rect class="nacelle" x="-7" y="-7" width="21" height="13" rx="4"/>
        <g class="rotor"><use href="#blade"/><use href="#blade" transform="rotate(120)"/><use href="#blade" transform="rotate(240)"/>
          <circle class="hub" r="6"/>
          <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 0 0" to="360 0 0" dur="8s" repeatCount="indefinite"/></g>
      </g>
    </defs>
    <rect x="0" y="0" width="1200" height="700" fill="url(#sky)"/>
    <circle class="sun-glow" cx="985" cy="135" r="150" fill="url(#glow)"/>
    <circle class="sun" cx="985" cy="135" r="60"/>
    <g><circle class="star" cx="140" cy="90" r="2"/><circle class="star" cx="320" cy="150" r="1.6"/>
      <circle class="star" cx="520" cy="70" r="2.2"/><circle class="star" cx="700" cy="120" r="1.5"/>
      <circle class="star" cx="250" cy="220" r="1.6"/><circle class="star" cx="1120" cy="220" r="2"/></g>
    <g class="cloud"><ellipse cx="230" cy="140" rx="70" ry="24"/><ellipse cx="290" cy="130" rx="52" ry="26"/></g>
    <g class="cloud"><ellipse cx="640" cy="210" rx="60" ry="20"/><ellipse cx="690" cy="202" rx="42" ry="22"/></g>
    <path class="hill-1" d="M0 470 C 220 428 430 472 620 456 C 820 440 1010 448 1200 470 L1200 700 L0 700 Z"/>
    <path class="hill-2" d="M0 532 C 260 496 520 540 760 518 C 980 498 1110 522 1200 536 L1200 700 L0 700 Z"/>
    <path class="hill-3" d="M0 590 C 300 558 660 594 900 578 C 1080 566 1150 588 1200 592 L1200 700 L0 700 Z"/>
    <use href="#turbine" transform="translate(1035 358) scale(0.55)"/>
    <use href="#turbine" transform="translate(545 342) scale(0.72)"/>
    <use href="#turbine" transform="translate(835 312) scale(0.9)"/>
    <use href="#turbine" transform="translate(250 300) scale(1.05)"/>
  </svg>
</div>

<a class="nav-back-link" href="almoxarifado-seguranca.html" title="Voltar"><i class="fas fa-arrow-left"></i></a>
<button class="theme-btn" id="theme-btn" title="Alternar tema"><i class="fas fa-moon"></i></button>

<main class="wrap">

const DIAS_ALERTA = 30;
function statusValidade(v){
  if(!v) return null;
  const p = String(v).split('-');
  if(p.length < 2) return null;
  const ano = Number(p[0]), mes = Number(p[1]);
  if(!ano || !mes) return null;
  const fim = new Date(ano, mes, 0);            // dia 0 do mês seguinte = último dia
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const dias = Math.round((fim - hoje) / 86400000);
  if(dias < 0) return {classe:'vencido', txt:'VENCIDO', dias:dias};
  if(dias <= DIAS_ALERTA) return {classe:'proximo', txt:dias+'d', dias:dias};
  return {classe:'ok', txt:dias+'d', dias:dias};
}

   nela pela tela.

   PARA RELIGAR: troque para true. Nada mais precisa mudar.

   O que fica de fora enquanto estiver false: a aba "Entrada de material", e
   com ela o desconto de reabastecimento no cálculo de consumo da análise
   semanal. Contagem de estoque não é afetada. O que já foi enviado como
   ENTRADA continua na planilha e continua sendo usado pelas análises. */
const ENTRADA_ATIVA = false;

/* Pinta a aba de entrada conforme a flag. Chamada uma vez no arranque. */
function aplicarEstadoEntrada(){
  const bt = document.getElementById('modo-entrada');
  if(!bt) return;
  const rot = bt.querySelector('span');
  if(ENTRADA_ATIVA){
    bt.removeAttribute('disabled');
    bt.removeAttribute('title');
    if(rot) rot.textContent = 'Entrada de material';
    return;
  }
  bt.setAttribute('disabled','disabled');
  bt.setAttribute('title','Registro de entrada de material temporariamente desativado');
  if(rot) rot.innerHTML = 'Entrada de material <span class="selo-off">off</span>';
}

function setModo(m){
  /* Pedido de 'entrada' com a função desligada cai em 'estoque' em vez de
     ser ignorado: quem tinha o app aberto no modo entrada (ou com ele salvo
     no aparelho da semana passada) precisa cair numa tela que funciona, e
     não ficar preso numa aba que não responde. */
  if(m === 'entrada' && !ENTRADA_ATIVA) m = 'estoque';
  modoAtual = (m === 'entrada') ? 'entrada' : 'estoque';
  document.getElementById('modo-estoque').classList.toggle('on', modoAtual==='estoque');
  document.getElementById('modo-entrada').classList.toggle('on', modoAtual==='entrada');
  document.getElementById('modo-hint').innerHTML = MODO_TXT[modoAtual].hint;
  document.getElementById('lista').classList.toggle('entrada', modoAtual==='entrada');
  document.getElementById('count').classList.toggle('entrada', modoAtual==='entrada');
  localStorage.setItem('ew_checklist_modo', modoAtual);
  renderLista();
}

/* ══ RENDER ══ */
function esc(s){ return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

function selecionarCliente(cli){
  clienteAtual = cli;
  document.querySelectorAll('.oem-tab').forEach(t=>t.classList.toggle('on', t.dataset.cli===cli));
  document.querySelector('meta[name=theme-color]');
  localStorage.setItem('ew_checklist_cli', cli);
  renderLista();
}

function renderLista(){
  const itens = LISTAS[clienteAtual];
  const salvos = safeParse(qtdKey(clienteAtual));
  const fotos = safeParse(fotoKey(clienteAtual));
  const html = itens.map((nome,idx)=>{
    const reg = salvos[nome] || {};
    const q = reg.qtd!=null ? esc(reg.qtd) : '';
    const un = unidadeDe(nome);
    /* Perecível ganha a segunda linha com lote e validade. Só é exigido quando
       há quantidade recebida — item zerado não precisa de lote. */
    const per = ehPerecivel(nome);
    const lote = reg.lote!=null ? esc(reg.lote) : '';
    const validade = reg.validade!=null ? esc(reg.validade) : '';
    const st = statusValidade(validade);
    const cobra = per && q!=='' && Number(q)>0;
    const blocoLote = per ? `
      <div class="lote">
        <div class="campo l"><label>LOTE</label>
          <input type="text" autocomplete="off" placeholder="nº do lote" value="${lote}"
            class="${cobra&&!lote?'falta':''}" oninput="onLote(this)"></div>
        <div class="campo v"><label>VALIDADE</label>
          <input type="month" value="${validade}"
            class="${cobra&&!validade?'falta':''}" onchange="onValidade(this)"></div>
        ${st?`<span class="val-tag ${st.classe}">${st.txt}</span>`:''}
      </div>` : '';
    /* Químico ganha a linha da foto. Só é COBRADA quando há quantidade — item
       zerado não tem tambor no parque para fotografar. */
    const quim = ehQuimico(nome);
    const temFoto = !!(fotos[nome] && fotos[nome].d);
    const pedeFoto = quim && q!=='' && Number(q)>0 && !temFoto;
    const blocoFoto = quim ? `
      <div class="foto">
        <label class="fbtn ${temFoto?'tem':(pedeFoto?'pede':'')}">
          <i class="fas fa-camera"></i> <span class="ftxt">${temFoto?'Trocar foto':'Anexar foto'}</span>
          <input type="file" accept="image/*" capture="environment" onchange="onFoto(this)">
        </label>
        <img class="${temFoto?'on':''}" alt="Foto de ${esc(nome)}">
        <button type="button" class="fdel ${temFoto?'on':''}" title="Remover foto"
          onclick="removerFoto(this)"><i class="fas fa-trash-can"></i></button>
      </div>` : '';
    /* "Preenchido" é ter valor, inclusive ZERO: numa contagem de estoque
       "não tem nenhum" é resposta, e é o que libera o envio. */
    return `<div class="item${q!==''?' filled':''}" data-nome="${esc(nome)}" data-i="${idx}" data-per="${per?1:0}" data-quim="${quim?1:0}">
      <span class="name">${esc(nome)}</span>
      <div class="num"><input type="number" inputmode="decimal" min="0" step="any" placeholder="0" value="${q}"
        oninput="onQtd(this)"></div>
      <div class="unit-fix" title="Unidade da planilha">${esc(un)}</div>
      ${blocoLote}
      ${blocoFoto}
    </div>`;
  }).join('');
  document.getElementById('lista').innerHTML = html;
  /* As miniaturas entram depois do innerHTML: são data URLs de ~100 KB cada e
     concatená-las na string de HTML deixava a lista visivelmente lenta. */
  document.querySelectorAll('#lista .item[data-quim="1"]').forEach(it=>{
    const f = fotos[it.dataset.nome];
    if(f && f.d) it.querySelector('.foto img').src = f.d;
  });
  aplicarFiltro();
  renderExtras();
  atualizarAcoes();
}

/* ══ MATERIAIS FORA DA LISTA ══
   Guardado por cliente E por modo, igual às quantidades: o que entrou de
   material recebido não é a mesma coisa que o que sobrou no estoque, e
   misturar os dois estragaria a análise semanal.

   Formato: { on: true|false, itens: [{nome, qtd, un}] }. Item sem nome ou sem
   quantidade não sai daqui — a validação do envio barra. */
const extraKey = (c, modo) => (( modo || modoAtual) === 'entrada' ? 'ew_checklist_xent_' : 'ew_checklist_xest_') + c;
const UNIDADES_EXTRA = ['un','kg','m','m²','L'];

function extrasLer(){
  const o = safeParse(extraKey(clienteAtual));
  return { on: !!o.on, itens: Array.isArray(o.itens) ? o.itens : [] };
}
function extrasSalvar(o){
  try{ localStorage.setItem(extraKey(clienteAtual), JSON.stringify(o)); }
  catch(e){ toast('Memória do aparelho cheia','error'); }
}

function setExtras(ligado){
  const o = extrasLer();
  o.on = !!ligado;
  /* Ligou e não tem nenhuma linha ainda: já abre uma, senão o técnico clica
     em "Sim" e fica olhando para um bloco vazio. */
  if(o.on && !o.itens.length) o.itens = [{nome:'', qtd:'', un:'un'}];
  extrasSalvar(o);
  renderExtras();
  atualizarAcoes();
}
function addExtra(){
  const o = extrasLer();
  o.itens.push({nome:'', qtd:'', un:'un'});
  extrasSalvar(o);
  renderExtras();
  const campos = document.querySelectorAll('#extras-linhas .extra-linha input[data-k="nome"]');
  if(campos.length) campos[campos.length-1].focus();
}
function delExtra(i){
  const o = extrasLer();
  o.itens.splice(i,1);
  if(!o.itens.length) o.itens = [{nome:'', qtd:'', un:'un'}];
  extrasSalvar(o);
  renderExtras();
  atualizarAcoes();
}
function onExtra(el){
  const linha = el.closest('.extra-linha');
  const i = Number(linha.dataset.i);
  const o = extrasLer();
  if(!o.itens[i]) return;
  o.itens[i][el.dataset.k] = el.value;
  extrasSalvar(o);
  /* Repinta só o campo em falta, sem re-render: re-render aqui tiraria o foco
     do técnico no meio da digitação. */
  linha.querySelectorAll('input[data-k]').forEach(inp=>{
    const preenchido = String(inp.value).trim() !== '';
    const irmao = linha.querySelector('input[data-k="'+(inp.dataset.k==='nome'?'qtd':'nome')+'"]');
    const irmaoTem = String(irmao.value).trim() !== '';
    inp.classList.toggle('falta', !preenchido && irmaoTem);
  });
  atualizarAcoes();
}

function renderExtras(){
  const o = extrasLer();
  const cx = document.getElementById('extras');
  if(!cx) return;
  cx.classList.toggle('aberto', o.on);
  document.getElementById('extras-sim').classList.toggle('on', o.on);
  document.getElementById('extras-nao').classList.toggle('on', !o.on);
  document.getElementById('extras-linhas').innerHTML = o.itens.map((it,i)=>{
    const nome = it.nome==null?'':esc(it.nome), qtd = it.qtd==null?'':esc(it.qtd);
    const un = it.un || 'un';
    const temNome = String(it.nome||'').trim()!=='', temQtd = String(it.qtd==null?'':it.qtd).trim()!=='';
    return `<div class="extra-linha" data-i="${i}">
      <input type="text" data-k="nome" placeholder="Material" value="${nome}"
        class="${!temNome&&temQtd?'falta':''}" oninput="onExtra(this)">
      <input type="number" data-k="qtd" inputmode="decimal" min="0" step="any" placeholder="Qtd" value="${qtd}"
        class="${!temQtd&&temNome?'falta':''}" oninput="onExtra(this)">
      <select data-k="un" onchange="onExtra(this)">
        ${UNIDADES_EXTRA.map(u=>`<option value="${u}"${u===un?' selected':''}>${u}</option>`).join('')}
      </select>
      <button type="button" class="xdel" title="Remover linha" onclick="delExtra(${i})">
        <i class="fas fa-trash-can"></i></button>
    </div>`;
  }).join('');
}

/* Linhas válidas — é o que vai para a planilha e para o PDF. */
function extrasValidos(){
  const o = extrasLer();
  if(!o.on) return [];
  return o.itens
    .filter(it=> String(it.nome||'').trim()!=='' && String(it.qtd==null?'':it.qtd).trim()!=='')
    .map(it=>({ nome: String(it.nome).trim(), qtd: it.qtd, un: it.un || 'un' }));
}
/* Linhas pela metade: só nome ou só quantidade. Travam o envio, porque nome
   sem número não conta nada e número sem nome não dá para lançar. */
function extrasIncompletos(){
  const o = extrasLer();
  if(!o.on) return 0;
  return o.itens.filter(it=>{
    const n = String(it.nome||'').trim()!=='', q = String(it.qtd==null?'':it.qtd).trim()!=='';
    return (n && !q) || (!n && q);
  }).length;
}

function itemDe(el){ return el.closest('.item'); }
function guardar(store){ localStorage.setItem(qtdKey(clienteAtual), JSON.stringify(store)); }

function onQtd(input){
  const it = itemDe(input); const nome = it.dataset.nome;
  const val = input.value.trim();
  const un = unidadeDe(nome);
  const store = safeParse(qtdKey(clienteAtual));
  if(val===''){
    /* Apagar a quantidade NÃO joga fora lote e validade já digitados — quem
       corrige um número errado não perde o resto. A entrada só desaparece se
       não sobrar nada dela. */
    if(store[nome]){
      delete store[nome].qtd;
      if(!store[nome].lote && !store[nome].validade) delete store[nome];
    }
  } else {
    store[nome] = Object.assign(store[nome]||{}, {qtd:val, un:un});
  }
  guardar(store);
  it.classList.toggle('filled', val!=='');
  marcarFaltas(it);
  marcarFoto(it);
  atualizarContador();
  atualizarAcoes();
}
function onLote(input){
  const it = itemDe(input); const nome = it.dataset.nome;
  const store = safeParse(qtdKey(clienteAtual));
  store[nome] = Object.assign(store[nome]||{}, {lote: input.value.trim()});
  if(!store[nome].un) store[nome].un = unidadeDe(nome);
  guardar(store);
  marcarFaltas(it);
  atualizarAcoes();
}
function onValidade(input){
  const it = itemDe(input); const nome = it.dataset.nome;
  const store = safeParse(qtdKey(clienteAtual));
  store[nome] = Object.assign(store[nome]||{}, {validade: input.value});
  if(!store[nome].un) store[nome].un = unidadeDe(nome);
  guardar(store);
  /* Redesenha a tarja de validade (vencido / dias restantes) sem re-render geral */
  const st = statusValidade(input.value);
  const bloco = it.querySelector('.lote');
  let tag = bloco.querySelector('.val-tag');
  if(!st){ if(tag) tag.remove(); }
  else {
    if(!tag){ tag = document.createElement('span'); bloco.appendChild(tag); }
    tag.className = 'val-tag ' + st.classe;
    tag.textContent = st.txt;
  }
  marcarFaltas(it);
  atualizarAcoes();
}

/* ══ FOTO DOS QUÍMICOS ══
   Guardada como JPEG reduzido (1000 px no maior lado, qualidade 0,6): dá ~80 KB
   por foto, legível para ler rótulo de lote, e ainda cabe no localStorage.
   Guardamos largura e altura junto porque o gerador de PDF precisa delas e
   não teria como medir sem recarregar a imagem. */
const FOTO_MAX = 1000, FOTO_Q = 0.6;

function onFoto(input){
  const arq = input.files && input.files[0];
  input.value = '';
  if(!arq) return;
  const it = itemDe(input), nome = it.dataset.nome;
  toast('Processando foto...');
  reduzirFoto(arq, reg=>{
    if(!reg){ toast('Não consegui ler essa imagem','error'); return; }
    const fotos = safeParse(fotoKey(clienteAtual));
    const antes = fotos[nome];
    fotos[nome] = reg;
    if(!guardarFotos(fotos)){
      if(antes) fotos[nome] = antes; else delete fotos[nome];
      guardarFotos(fotos);
      return;
    }
    it.querySelector('.foto img').src = reg.d;
    marcarFoto(it);
    atualizarAcoes();
    toast('Foto anexada','success');
  });
}

function removerFoto(btn){
  const it = itemDe(btn), nome = it.dataset.nome;
  const fotos = safeParse(fotoKey(clienteAtual));
  delete fotos[nome];
  guardarFotos(fotos);
  const img = it.querySelector('.foto img');
  img.removeAttribute('src');
  marcarFoto(it);
  atualizarAcoes();
}

function guardarFotos(store){
  try{
    localStorage.setItem(fotoKey(clienteAtual), JSON.stringify(store));
    return true;
  }catch(e){
    /* Cota do navegador cheia. Não dá para "abrir espaço" sozinho sem apagar
       trabalho de alguém, então avisa e devolve o controle. */
    toast('Memória do aparelho cheia — envie e limpe antes de anexar mais fotos','error');
    return false;
  }
}

function reduzirFoto(arq, cb){
  const fr = new FileReader();
  fr.onerror = ()=>cb(null);
  fr.onload = ()=>{
    const img = new Image();
    img.onerror = ()=>cb(null);
    img.onload = ()=>{
      try{
        const k = Math.min(1, FOTO_MAX / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width*k)), h = Math.max(1, Math.round(img.height*k));
        const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
        const cx = cv.getContext('2d');
        cx.fillStyle='#fff'; cx.fillRect(0,0,w,h);      // JPEG não tem transparência
        cx.drawImage(img,0,0,w,h);
        cb({d: cv.toDataURL('image/jpeg', FOTO_Q), w:w, h:h});
      }catch(e){ cb(null); }
    };
    img.src = fr.result;
  };
  fr.readAsDataURL(arq);
}

/* Pinta o botão da foto: âmbar quando é cobrada, verde quando já tem */
function marcarFoto(it){
  const bloco = it.querySelector('.foto');
  if(!bloco) return;
  const img = bloco.querySelector('img');
  const tem = !!(img.getAttribute('src'));
  const qtd = Number(it.querySelector('.num input').value);
  const btn = bloco.querySelector('.fbtn');
  btn.classList.toggle('tem', tem);
  btn.classList.toggle('pede', !tem && qtd > 0);
  btn.querySelector('.ftxt').textContent = tem ? 'Trocar foto' : 'Anexar foto';
  img.classList.toggle('on', tem);
  bloco.querySelector('.fdel').classList.toggle('on', tem);
}

/* ══ O QUE FALTA PARA LIBERAR O ENVIO ══
   Regra: toda a lista precisa de um número (zero vale) e todo químico com
   quantidade precisa de foto. Na ENTRADA, perecível também precisa de lote e
   validade — regra que já existia. */
function pendencias(){
  const lista = LISTAS[clienteAtual];
  /* Cabeçalho entra na trava: o Parque é o que vira aba na planilha, e um PDF
     sem parque, responsável e data não serve para nada no grupo do WhatsApp. */
  const cab = [];
  if(!val('i-parque')) cab.push('Parque / Projeto');
  if(!val('i-resp'))   cab.push('Responsável');
  if(!val('i-data'))   cab.push('Data');
  const store = safeParse(qtdKey(clienteAtual));
  const fotos = safeParse(fotoKey(clienteAtual));
  const temQtd = n => store[n] && String(store[n].qtd==null?'':store[n].qtd).trim()!=='';
  const semQtd  = lista.filter(n=>!temQtd(n));
  const semFoto = lista.filter(n=>ehQuimico(n) && temQtd(n) && Number(store[n].qtd)>0
                                  && !(fotos[n] && fotos[n].d));
  const semLote = modoAtual==='entrada' ? pendenciasLote() : [];
  const extraMeio = extrasIncompletos();
  return {cab, semQtd, semFoto, semLote, extraMeio,
          ok: !cab.length && !semQtd.length && !semFoto.length && !semLote.length && !extraMeio,
          total: lista.length, feitos: lista.length - semQtd.length};
}

function atualizarAcoes(){
  const p = pendencias();
  const cx = document.getElementById('pend');
  const bE = document.getElementById('b-enviar');
  const bC = document.getElementById('b-compartilhar');
  if(!cx || !bE || !bC) return;
  bE.disabled = !p.ok; bC.disabled = !p.ok;
  if(p.ok){
    const ex = extrasValidos().length;
    cx.className = 'pend ok';
    cx.innerHTML = '<b>Lista completa</b> — '+p.total+' itens contados'
      + (ex ? ' + <b>'+ex+'</b> fora da lista' : '') + '. '
      + 'Já pode enviar para a planilha e compartilhar o PDF.';
    return;
  }
  cx.className = 'pend';
  const partes = [];
  if(p.cab.length) partes.push('Falta preencher: <b>'+p.cab.join(', ')+'</b>');
  partes.push('<b>'+p.feitos+'/'+p.total+'</b> itens com quantidade'
    + (p.semQtd.length ? ' — faltam '+p.semQtd.length+' (zero também conta)' : ''));
  if(p.semFoto.length) partes.push('<b>'+p.semFoto.length+'</b> químico(s) sem foto: '+resumoNomes(p.semFoto));
  if(p.semLote.length) partes.push('<b>'+p.semLote.length+'</b> sem lote/validade: '+resumoNomes(p.semLote));
  if(p.extraMeio) partes.push('<b>'+p.extraMeio+'</b> material(is) fora da lista pela metade — falta o nome ou a quantidade');
  cx.innerHTML = partes.join('<br>');
}
function resumoNomes(arr){
  const n = arr.slice(0,3).map(esc).join(' · ');
  return arr.length>3 ? n+' e mais '+(arr.length-3) : n;
}

/* Realça em âmbar o que falta preencher num perecível que tem quantidade */
function marcarFaltas(it){
  const bloco = it.querySelector('.lote');
  if(!bloco) return;
  const qtd = Number(it.querySelector('.num input').value);
  const cobra = it.dataset.per === '1' && qtd > 0;
  const [iLote, iVal] = bloco.querySelectorAll('input');
  iLote.classList.toggle('falta', cobra && !iLote.value.trim());
  iVal.classList.toggle('falta', cobra && !iVal.value);
}

/* Perecíveis com quantidade recebida mas sem lote ou sem validade.
   O filtro de quantidade > 0 passou a ser essencial quando o coletados() começou
   a trazer os zeros: perecível zerado não foi recebido, logo não tem rótulo. */
function pendenciasLote(){
  return coletados()
    .filter(i => i.perecivel && Number(i.qtd) > 0 && (!i.lote || !i.validade))
    .map(i => i.nome);
}

function aplicarFiltro(){
  const termo = (document.getElementById('busca').value||'').toLowerCase().trim();
  const soP = document.getElementById('soPreenchidos').checked;
  document.querySelectorAll('#lista .item').forEach(it=>{
    const nome = it.dataset.nome.toLowerCase();
    const filled = it.classList.contains('filled');
    const okBusca = !termo || nome.includes(termo);
    const okP = !soP || filled;
    it.classList.toggle('hidden', !(okBusca && okP));
  });
  atualizarContador();
}
function atualizarContador(){
  const all = LISTAS[clienteAtual].length;
  const store = safeParse(qtdKey(clienteAtual));
  const preench = Object.keys(store)
    .filter(k=>String(store[k].qtd==null?'':store[k].qtd).trim()!=='').length;
  document.getElementById('count').textContent = `${preench}/${all} preenchidos`;
}

/* ══ IDENTIFICAÇÃO (persistência) ══ */
function salvarEstado(){
  const id = {
    parque: val('i-parque'), resp: val('i-resp'), data: val('i-data')
  };
  localStorage.setItem(IDKEY, JSON.stringify(id));
  atualizarAcoes();
}
function carregarEstado(){
  const id = safeParseObj(IDKEY);
  if(id.parque) setv('i-parque',id.parque);
  if(id.resp) setv('i-resp',id.resp);
  if(id.data) setv('i-data',id.data);
}
function val(id){ return (document.getElementById(id).value||'').trim(); }
function setv(id,v){ document.getElementById(id).value=v; }

/* ══ AÇÕES ══ */
/* Tudo o que TEM VALOR, inclusive ZERO. O zero é resposta, não ausência de
   dado: numa contagem de estoque é ele que diz "conferi e não tem nenhum", e a
   análise semanal precisa disso — sem a linha de zero o material desaparece da
   janela e o consumo daquela semana não fecha.
   Serve à planilha E ao PDF: uma lista só, para as duas não divergirem. */
function coletados(){
  const store = safeParse(qtdKey(clienteAtual));
  const daLista = LISTAS[clienteAtual]
    .filter(n=>store[n] && String(store[n].qtd==null?'':store[n].qtd).trim()!=='')
    .map(n=>({nome:n, qtd:store[n].qtd, un:unidadeDe(n),
              quimico:ehQuimico(n), perecivel:ehPerecivel(n),
              lote:(store[n].lote||''), validade:(store[n].validade||''), fora:false}));
  /* Os de fora da lista vão no fim, marcados. Não são químicos nem perecíveis
     para o app: sem estar na lista mestra não dá para afirmar que pedem foto
     ou lote, e inventar essa exigência travaria o envio por adivinhação. */
  const foraDaLista = extrasValidos()
    .map(x=>({nome:x.nome, qtd:x.qtd, un:x.un,
              quimico:false, perecivel:false, lote:'', validade:'', fora:true}));
  return daLista.concat(foraDaLista);
}
/* AAAA-MM -> MM/AAAA, para texto e CSV */
function validadeBR(v){
  if(!v) return '';
  const p = String(v).split('-');
  return p.length>=2 ? `${p[1]}/${p[0]}` : v;
}
function cabecalhoTexto(){
  const id = safeParseObj(IDKEY);
  const titulo = modoAtual==='entrada'
    ? `ENTRADA DE MATERIAIS — ${NOME_CLI[clienteAtual]}`
    : `CHECKLIST DE MATERIAIS (estoque) — ${NOME_CLI[clienteAtual]}`;
  const linhas = [titulo];
  if(id.parque) linhas.push(`Parque/Projeto: ${id.parque}`);
  if(id.resp) linhas.push(`Responsável: ${id.resp}`);
  if(id.data) linhas.push(`Data: ${formatarData(id.data)}`);
  return linhas.join('\n');
}
function formatarData(iso){ if(!iso) return ''; const p=iso.split('-'); return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:iso; }

/* Mensagem que acompanha o PDF no WhatsApp */
function resumoTexto(){
  const itens = coletados();
  let txt = cabecalhoTexto() + '\n\nMATERIAIS:\n';
  txt += itens.map(i=>{
    let l = `• ${i.nome}: ${i.qtd} ${i.un}`;
    if(i.perecivel && modoAtual==='entrada'){
      const st = statusValidade(i.validade);
      l += `\n    Lote: ${i.lote||'—'} · Validade: ${validadeBR(i.validade)||'—'}`;
      if(st && st.classe==='vencido') l += ' ⚠ VENCIDO';
      else if(st && st.classe==='proximo') l += ` ⚠ vence em ${st.dias} dia(s)`;
    }
    return l;
  }).join('\n');
  txt += `\n\n(${itens.length} itens · Extreme Wind Blade Services)`;
  return txt;
}

function nomeArquivo(ext){
  const id = safeParseObj(IDKEY);
  const base = (id.parque||'').replace(/[^a-zA-Z0-9]/g,'_')
            || (id.data||new Date().toISOString().slice(0,10));

function baixarBlob(blob, nome){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = nome;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}

/* Compartilhar = gerar o PDF e entregá-lo ao WhatsApp. Só é liberado com a
   lista completa (ver pendencias()). Onde o navegador não sabe compartilhar
   arquivo, o PDF é baixado para o técnico anexar à mão. */

  const p = pendencias();
  if(!p.ok){
    atualizarAcoes();
    toast('Complete a lista antes de compartilhar','error');
    document.getElementById('pend').scrollIntoView({block:'center'});
    return;
  }
  let blob;

  catch(e){ toast('Falha ao gerar o PDF: '+e.message,'error'); return; }

  const nome = nomeArquivo('pdf');
  const texto = resumoTexto();
  let arq = null;
  try{ arq = new File([blob], nome, {type:'application/pdf'}); }catch(e){}

  if(arq && navigator.canShare && navigator.canShare({files:[arq]}) && navigator.share){
    navigator.share({files:[arq], title:'Checklist de Materiais — EW', text:texto})
      .then(()=>toast('PDF compartilhado','success'))
      .catch(e=>{
        if(e.name==='AbortError') return;
        baixarBlob(blob, nome);
        toast('PDF salvo no aparelho — anexe no WhatsApp','success');
      });
    return;
  }
  baixarBlob(blob, nome);
  toast('PDF salvo no aparelho — anexe no WhatsApp','success');
}
function copiar(txt){
  if(navigator.clipboard){ navigator.clipboard.writeText(txt).then(()=>toast('Copiado para a área de transferência','success')).catch(()=>fallbackCopy(txt)); }
  else fallbackCopy(txt);
}
function fallbackCopy(txt){
  const ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('Copiado','success'); }catch(e){ toast('Não foi possível copiar','error'); }
  document.body.removeChild(ta);
}

/* ══ PDF ══
   Escrito à mão, sem biblioteca: o app precisa funcionar offline e a política
   de segurança da página não deixa carregar script de fora. São páginas A4
   com texto Helvetica e as fotos embutidas como JPEG (filtro DCTDecode, que é
   o próprio JPEG — não há recompressão).

   O texto usa WinAnsiEncoding, que cobre o português. Os caracteres que o
   WinAnsi guarda fora do Latin-1 (travessão, aspas curvas, bolinha) são
   traduzidos abaixo; o que sobrar de fora vira '?'. */
const PDF_WIN = {'—':'\u0097','–':'\u0096','‘':'\u0091','’':'\u0092','“':'\u0093','”':'\u0094',
  '•':'\u0095','…':'\u0085','⚠':'!','✓':'OK','×':'x'};
function pdfWin(v){
  let o='';
  for(const ch of String(v)){
    const m = PDF_WIN[ch];
    if(m!==undefined) o+=m;
    else if(ch.charCodeAt(0)<=255) o+=ch;
    else o+='?';
  }
  return o;
}
function pdfTxt(v){ return pdfWin(v).replace(/[\\()]/g, m=>'\\'+m); }
function pdfBytes(str){
  const a = new Uint8Array(str.length);
  for(let i=0;i<str.length;i++) a[i] = str.charCodeAt(i) & 0xff;
  return a;
}
function b64Bytes(b64){
  const bin = atob(b64);
  const a = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) a[i] = bin.charCodeAt(i);
  return a;
}
function n2(v){ return (Math.round(v*100)/100).toString(); }
/* Largura aproximada de um texto em Helvetica, só para truncar nome comprido
   sem invadir a coluna da quantidade. 0.5 do corpo é a média da fonte. */
function larguraAprox(txt, tam){ return String(txt).length * tam * 0.5; }
function cortar(txt, tam, limite){
  let t = String(txt);
  while(t.length>4 && larguraAprox(t,tam) > limite) t = t.slice(0,-1);
  return t.length < String(txt).length ? t.slice(0,-1)+'…' : t;
}

function gerarPDF(){
  const LARG = 595.28, ALT = 841.89, MARG = 42;
  const id = safeParseObj(IDKEY);
  const itens = coletados();
  const fotos = safeParse(fotoKey(clienteAtual));
  const ent = modoAtual === 'entrada';

  const paginas = [], imgs = [];
  let pg = null, y = 0;

  function nova(){ pg = {ops:[], usa:[]}; paginas.push(pg); y = ALT - MARG; }
  function precisa(h){ if(!pg || y - h < MARG) { nova(); return true; } return false; }
  function txt(v, x, tam, bold, cinza){
    pg.ops.push((cinza?'0.36 0.42 0.5 rg ':'0 0 0 rg ')
      + 'BT /'+(bold?'F2':'F1')+' '+tam+' Tf 1 0 0 1 '+n2(x)+' '+n2(y)+' Tm ('+pdfTxt(v)+') Tj ET');
  }
  function regua(){
    pg.ops.push('0.7 w 0.78 0.82 0.86 RG '+n2(MARG)+' '+n2(y)+' m '+n2(LARG-MARG)+' '+n2(y)+' l S');
  }

  /* ── cabeçalho ── */
  nova();
  txt(ent ? 'ENTRADA DE MATERIAIS' : 'CHECKLIST DE MATERIAIS — CONTAGEM DE ESTOQUE', MARG, 14, true);
  y -= 17;
  txt('Extreme Wind Blade Services  ·  '+NOME_CLI[clienteAtual], MARG, 9.5, false, true);
  y -= 13; regua(); y -= 15;
  txt('Parque / Projeto: '+(id.parque||'—'), MARG, 10); y -= 14;
  txt('Responsável: '+(id.resp||'—'), MARG, 10);
  txt('Data: '+(formatarData(id.data)||''), MARG+250, 10); y -= 22;

  /* ── colunas ── */
  const cQtd = LARG - MARG - (ent ? 250 : 90);
  const cUn  = cQtd + 46;
  const cLot = cUn + 34;
  const cVal = cLot + 92;
  const larguraNome = cQtd - MARG - 10;

  function cabecalhoTabela(){
    txt('MATERIAL', MARG, 8, true, true);
    txt('QTD', cQtd, 8, true, true);
    txt('UN', cUn, 8, true, true);
    if(ent){ txt('LOTE', cLot, 8, true, true); txt('VALIDADE', cVal, 8, true, true); }
    y -= 5; regua(); y -= 12;
  }
  cabecalhoTabela();

  itens.forEach(i=>{
    if(precisa(16)) cabecalhoTabela();
    txt(cortar(i.nome, 9, larguraNome), MARG, 9);
    txt(String(i.qtd), cQtd, 9, true);
    txt(i.un, cUn, 9, false, true);
    if(ent){
      txt(i.perecivel ? (i.lote||'—') : '', cLot, 8.5);
      const st = statusValidade(i.validade);
      let v = i.perecivel ? (validadeBR(i.validade)||'—') : '';
      if(st && st.classe==='vencido') v += ' VENCIDO';
      else if(st && st.classe==='proximo') v += ' ('+st.dias+'d)';
      txt(v, cVal, 8.5);
    }
    y -= 14;
  });

  /* O rodapé precisa do mesmo cuidado das linhas: sem isto, uma tabela que
     termina rente à margem escreveria o resumo fora da página. */
  precisa(20);
  y -= 4; regua(); y -= 13;
  txt(itens.length+' itens · gerado pelo app em '+new Date().toLocaleString('pt-BR'), MARG, 8, false, true);

  /* ── fotos dos químicos, duas por linha ── */
  const comFoto = itens.filter(i=>i.quimico && fotos[i.nome] && fotos[i.nome].d);
  if(comFoto.length){
    nova();
    txt('FOTOS DOS QUÍMICOS', MARG, 12, true); y -= 6; regua(); y -= 16;
    const CEL = (LARG - 2*MARG - 16) / 2, MAXH = 168;
    for(let k=0; k<comFoto.length; k+=2){
      const par = comFoto.slice(k, k+2);
      /* Altura da linha = a maior das duas fotos, senão a segunda coluna
         desalinha e a legenda cai sobre a foto de baixo. */
      const cxs = par.map(i=>{
        const f = fotos[i.nome];
        const k2 = Math.min(CEL/f.w, MAXH/f.h);
        return {i:i, f:f, w:f.w*k2, h:f.h*k2};
      });
      const hLinha = Math.max.apply(null, cxs.map(c=>c.h)) + 30;
      if(precisa(hLinha)){ txt('FOTOS DOS QUÍMICOS (continuação)', MARG, 12, true); y -= 6; regua(); y -= 16; }
      cxs.forEach((c,col)=>{
        const x = MARG + col*(CEL+16);
        const idx = imgs.length;
        imgs.push({bytes: b64Bytes(c.f.d.split(',')[1]), w:c.f.w, h:c.f.h});
        pg.usa.push(idx);
        pg.ops.push('q '+n2(c.w)+' 0 0 '+n2(c.h)+' '+n2(x)+' '+n2(y-c.h)+' cm /Im'+idx+' Do Q');
        const yTexto = y - c.h - 11;
        pg.ops.push('0 0 0 rg BT /F1 7.5 Tf 1 0 0 1 '+n2(x)+' '+n2(yTexto)+' Tm ('
          + pdfTxt(cortar(c.i.nome, 7.5, CEL)) + ') Tj ET');
        pg.ops.push('0.36 0.42 0.5 rg BT /F1 7 Tf 1 0 0 1 '+n2(x)+' '+n2(yTexto-9)+' Tm ('
          + pdfTxt(c.i.qtd+' '+c.i.un + (ent && c.i.lote ? '  ·  lote '+c.i.lote : '')) + ') Tj ET');
      });
      y -= hLinha;
    }
  }

  /* ── serialização ── */
  const objs = [];                 // 1-based; objs[0] fica vazio de propósito
  const CAT = 1, PGS = 2, FN1 = 3, FN2 = 4;
  const oImg = imgs.map((_,i)=> 5 + i);
  const base = 5 + imgs.length;
  const oPg  = paginas.map((_,i)=> base + 2*i);
  const oCt  = paginas.map((_,i)=> base + 2*i + 1);

  objs[CAT] = {t:'<< /Type /Catalog /Pages '+PGS+' 0 R >>'};
  objs[PGS] = {t:'<< /Type /Pages /Count '+paginas.length+' /Kids ['
                 + oPg.map(n=>n+' 0 R').join(' ')+'] >>'};
  objs[FN1] = {t:'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>'};
  objs[FN2] = {t:'<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>'};
  imgs.forEach((im,i)=>{
    objs[oImg[i]] = {t:'<< /Type /XObject /Subtype /Image /Width '+im.w+' /Height '+im.h
      +' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+im.bytes.length+' >>',
      bin: im.bytes};
  });
  paginas.forEach((p,i)=>{
    const xo = p.usa.length
      ? ' /XObject << '+p.usa.map(k=>'/Im'+k+' '+oImg[k]+' 0 R').join(' ')+' >>' : '';
    objs[oPg[i]] = {t:'<< /Type /Page /Parent '+PGS+' 0 R /MediaBox [0 0 '+n2(LARG)+' '+n2(ALT)+']'
      +' /Resources << /Font << /F1 '+FN1+' 0 R /F2 '+FN2+' 0 R >>'+xo+' >>'
      +' /Contents '+oCt[i]+' 0 R >>'};
    const cs = p.ops.join('\n');
    objs[oCt[i]] = {t:'<< /Length '+cs.length+' >>', bin: pdfBytes(cs)};
  });

  const partes = []; const off = []; let pos = 0;
  function põe(x){
    const b = (typeof x === 'string') ? pdfBytes(x) : x;
    partes.push(b); pos += b.length;
  }
  põe('%PDF-1.4\n%\u00e2\u00e3\u00cf\u00d3\n');
  for(let n=1; n<objs.length; n++){
    off[n] = pos;
    põe(n+' 0 obj\n'+objs[n].t+'\n');
    if(objs[n].bin){ põe('stream\n'); põe(objs[n].bin); põe('\nendstream\n'); }
    põe('endobj\n');
  }
  const inicioXref = pos;
  let x = 'xref\n0 '+objs.length+'\n0000000000 65535 f \n';
  for(let n=1; n<objs.length; n++){
    x += ('0000000000'+off[n]).slice(-10)+' 00000 n \n';
  }
  põe(x);
  põe('trailer\n<< /Size '+objs.length+' /Root '+CAT+' 0 R >>\nstartxref\n'+inicioXref+'\n%%EOF\n');

  let total = 0; partes.forEach(b=>total+=b.length);
  const saida = new Uint8Array(total); let o = 0;
  partes.forEach(b=>{ saida.set(b,o); o += b.length; });
  return new Blob([saida], {type:'application/pdf'});
}

/* ══ UTIL ══ */
function safeParse(k){ try{ return JSON.parse(localStorage.getItem(k)||'{}'); }catch(e){ return {}; } }
function safeParseObj(k){ try{ return JSON.parse(localStorage.getItem(k)||'{}'); }catch(e){ return {}; } }
let toastTimer;
function toast(msg,type){
  const t=document.getElementById('toast'); t.textContent=msg; t.className='show'+(type?(' '+type):'');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>{t.className='';},2600);
}

/* ══ SINCRONIZAÇÃO COM A PLANILHA (Google Apps Script) ══ */
/* Endpoint único do app (Cloudflare Worker) — mesma planilha das calculadoras.
   NÃO é segredo: é só um endereço. Quem guarda segredo é o Worker (URL do
   Apps Script, GAS_SECRET, credenciais do Dropbox) — nada disso chega ao
   navegador. Ver ew-dropbox-proxy/worker.js. Antes a URL do Apps Script vinha
   escrita aqui, e como este arquivo é público no GitHub Pages, qualquer pessoa
   podia gravar na planilha de produção. */
const API = 'https://ew-dropbox-proxy.ew-fotos.workers.dev';
const SYNC_KEY = 'ew_checklist_sync_queue';
function filaSyncAll(){ return safeParseArr(SYNC_KEY); }
function filaSyncSave(arr){ localStorage.setItem(SYNC_KEY, JSON.stringify(arr)); }
function safeParseArr(k){ try{ const v=JSON.parse(localStorage.getItem(k)||'[]'); return Array.isArray(v)?v:[]; }catch(e){ return []; } }

function enviarPlanilha(){
  const itens = coletados();
  if(!itens.length){ toast('Preencha ao menos uma QTD antes de enviar','error'); return; }
  const id = safeParseObj(IDKEY);
  /* Cabeçalho completo é OBRIGATÓRIO. O Parque vira a aba da planilha (sem ele
     o registro fica órfão e a análise semanal nem consegue criar a aba), e
     responsável e data são o que permite voltar e perguntar depois. */
  const faltaCab=[];
  if(!(id.parque||'').trim()) faltaCab.push(['i-parque','Parque / Projeto']);
  if(!(id.resp  ||'').trim()) faltaCab.push(['i-resp','Responsável']);
  if(!(id.data  ||'').trim()) faltaCab.push(['i-data','Data']);
  if(faltaCab.length){
    toast('Preencha '+faltaCab.map(f=>f[1]).join(', ')+' antes de enviar','error');
    const campo=document.getElementById(faltaCab[0][0]);
    campo.style.borderColor='#d1495b'; campo.focus();
    campo.scrollIntoView({block:'center'});
    setTimeout(()=>{campo.style.borderColor='';},2500);
    return;
  }
  /* Entrada de perecível SEM lote/validade não sai daqui.
     ATENÇÃO ao mexer nisto: antes era só um aviso, porque em campo acontece
     rótulo ilegível ou tambor já transferido. Passou a bloquear a pedido da
     engenharia — lote e validade são o que permite rastrear um lote vencido
     depois. Se voltar a travar gente em campo, o caminho é voltar ao confirm()
     e não afrouxar a regra pela metade. */
  if(modoAtual==='entrada'){
    const faltando = pendenciasLote();
    if(faltando.length){
      const lista = faltando.slice(0,8).map(n=>'• '+n).join('\n')
        + (faltando.length>8 ? `\n… e mais ${faltando.length-8}` : '');
      alert(
        `${faltando.length} material(is) perecível(is) sem LOTE ou VALIDADE:\n\n${lista}\n\n`
        + 'Preencha lote e validade dos itens em âmbar para poder enviar.');
      renderLista();
      document.getElementById('soPreenchidos').checked = true;
      aplicarFiltro();
      toast('Falta lote/validade em '+faltando.length+' item(ns)','error');
      return;
    }
  }

  const envio = {
    tipo: 'checklist_snapshot',
    registro: modoAtual,           // 'estoque' (contagem) ou 'entrada' (recebido)
    id: Date.now()+'-'+Math.round(Math.random()*1e9),
    cliente: NOME_CLI[clienteAtual],
    parque: id.parque||'', responsavel: id.resp||'', data: formatarData(id.data)||new Date().toLocaleDateString('pt-BR'),
    /* lote e validade só fazem sentido na ENTRADA (material recebido);
       na contagem de estoque vão vazios e a planilha ignora */
    itens: itens.map(i=>({material:i.nome, qtd:Number(i.qtd)||0, unidade:i.un,
      lote: modoAtual==='entrada' ? (i.lote||'') : '',
      validade: modoAtual==='entrada' ? (i.validade||'') : '',
      /* Material digitado em campo, fora da lista mestra. A planilha grava
         igual aos outros; como não tem preço cadastrado, ele cai sozinho no
         bloco "MATERIAIS SEM PREÇO" do relatório de gasto — que é o lugar
         certo para alguém decidir se vira item de lista ou não. */
      fora: !!i.fora}))
  };
  const fila = filaSyncAll(); fila.push(envio); filaSyncSave(fila);
  /* Baixa o alerta de prazo aqui, na hora de enfileirar — e não quando a
     planilha confirma. O técnico terminou o trabalho dele; a entrega é
     problema do app, que reenvia sozinho. Cobrar o cartão vermelho por falta
     de sinal seria cobrar a pessoa errada. */
  if(window.EWPrazo) window.EWPrazo.marcarFeito('materiais');
  atualizarStatusSync();
  tentarSincronizarPlanilha();
  toast(modoAtual==='entrada' ? 'Entrada de material na fila de envio' : 'Contagem de estoque na fila de envio','success');
}

let sincronizandoPlanilha=false;
function tentarSincronizarPlanilha(){
  const fila = filaSyncAll();
  if(sincronizandoPlanilha || !fila.length || !navigator.onLine){ atualizarStatusSync(); return; }
  sincronizandoPlanilha = true;
  atualizarStatusSync('Enviando para a planilha...');
  const item = fila[0];
  fetch(API+'/sheets',{method:'POST',body:JSON.stringify(item),headers:{'Content-Type':'text/plain;charset=utf-8'}})
    .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status);
      const restante = filaSyncAll().slice(1); filaSyncSave(restante);
      sincronizandoPlanilha = false;
      atualizarStatusSync();
      toast('☁️✓ Enviado para a planilha','success');
      if(restante.length) tentarSincronizarPlanilha();
    })
    .catch(e=>{ sincronizandoPlanilha=false; atualizarStatusSync('☁️✗ Falha no envio ('+e.message+') — tentando de novo automaticamente'); });
}
function atualizarStatusSync(msg){
  const el = document.getElementById('sync-status'); if(!el) return;
  const n = filaSyncAll().length;
  el.textContent = msg || (n>0 ? ('☁️ '+n+' pendente(s) para a planilha') : '');
}
window.addEventListener('online', tentarSincronizarPlanilha);
